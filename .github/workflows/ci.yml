# HL7 v2 Rust Workspace - CI Pipeline
# Implements the 4-stage pipeline design from docs/TESTING_ARCHITECTURE.md
#
# Stage 1 (Fast - ~12 LEM): Format, Clippy, lint policy, unit tests, doc tests
# Stage 2 (Standard - ~15 LEM): Integration tests, BDD tests, limited property tests
# Stage 2 (Matrix - ~85 LEM): Multi-OS/toolchain tests (see PR 07 for routing)
# Stage 3 (Extended - ~20 LEM): Full property tests + benchmarks (main only)

name: CI

on:
  push:
    branches: [main, 'release/**', 'claude/**']
  pull_request:
    branches: [main]
  merge_group:

# Cancellation policy:
# - PR synchronize events cancel stale runs for the same PR.
# - Push, label, merge_group events do NOT cancel in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # ============================================================================
  # Stage 1: Fast Feedback (~12 LEM)
  # Runs on every PR and push
  # ============================================================================
  fast:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-fast-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting (xtask)
        run: cargo run -p xtask -- gate --check --only fmt

      - name: Run clippy lints (xtask)
        run: cargo run -p xtask -- gate --check --only clippy

      - name: Check lint policy
        run: cargo run -p xtask -- check-lint-policy

      - name: Check no-panic-family policy
        run: cargo run -p xtask -- check-no-panic-family

      - name: Check non-Rust file policy
        run: cargo run -p xtask -- check-file-policy

      - name: Run unit tests
        run: cargo test --lib --workspace --all-features
        timeout-minutes: 3

      - name: Run doc tests
        run: cargo test --doc --workspace --all-features
        timeout-minutes: 2

  # ============================================================================
  # Stage 2: Standard Tests (~15 LEM)
  # Runs on every PR and push after fast stage passes
  # ============================================================================
  standard:
    name: Standard Tests
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-standard-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run integration tests
        run: cargo test --test '*' --workspace --all-features
        timeout-minutes: 10

      - name: Run BDD tests
        run: |
          # Run BDD tests for active crates that have them
          cargo test --test bdd_tests -p hl7v2-cli || echo "No BDD tests in hl7v2-cli"
          cargo test --test bdd_tests -p hl7v2-server || echo "No BDD tests in hl7v2-server"
        timeout-minutes: 5

      - name: Run limited property tests
        env:
          PROPTEST_CASES: 100
        run: |
          cargo test -p hl7v2 --all-features property_tests
        timeout-minutes: 5

  # ============================================================================
  # Stage 2 (Parallel): Multi-Rust Version Tests (~85 LEM)
  # TODO(PR-07): Route off ordinary PR path onto main/labels.
  # ============================================================================
  matrix-test:
    name: Matrix Tests
    runs-on: ${{ matrix.os }}
    needs: fast
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, '1.93']
        exclude:
          # beta and MSRV only on ubuntu to reduce CI load
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: '1.93'
          - os: macos-latest
            rust: '1.93'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-matrix-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}
          # Only save the canonical ubuntu+stable cache from main to avoid cache thrash
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}

      - name: Run tests
        run: cargo test --workspace --all-features
        timeout-minutes: 10

  # ============================================================================
  # Stage 3: Extended Tests (~20 LEM)
  # Runs only on main branch after standard stage passes
  # ============================================================================
  extended:
    name: Extended Tests
    runs-on: ubuntu-latest
    needs: [fast, standard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-extended-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run full property tests
        env:
          PROPTEST_CASES: 1000
        run: |
          cargo test -p hl7v2 --all-features property_tests
        timeout-minutes: 10

  # ============================================================================
  # Stage 3 (Parallel): Benchmarks (~15 LEM)
  # Non-failing, tracks performance regressions
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [fast, standard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-bench-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run benchmarks
        run: |
          cargo bench --workspace 2>&1 | tee benchmark-results.txt || true
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

  # ============================================================================
  # Summary Job (~1 LEM)
  # Reports overall CI status; candidate for branch protection simplification
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fast, standard, matrix-test]
    if: always() && !failure()
    steps:
      - name: Check CI status
        run: |
          echo "CI Pipeline completed successfully"
          echo "- Fast checks: passed"
          echo "- Standard tests: passed"
          echo "- Matrix tests: passed"
