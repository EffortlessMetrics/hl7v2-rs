# HL7 v2 Rust Workspace - CI Pipeline
# Implements the 4-stage pipeline design from docs/TESTING_ARCHITECTURE.md
#
# Stage 1 (Fast - ~12 LEM): Format, Clippy, lint policy, unit tests, doc tests
# Stage 2 (Standard - ~15 LEM): Integration tests, BDD tests, limited property tests
# Stage 2 (Matrix - ~85 LEM): Multi-OS/toolchain tests (see PR 07 for routing)
# Stage 3 (Extended - ~20 LEM): Full property tests + benchmarks (main only)

name: CI

on:
  push:
    branches: [main, 'release/**', 'claude/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

# Cancellation policy:
# - PR synchronize events cancel stale runs for the same PR.
# - Push, label, merge_group events do NOT cancel in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # ============================================================================
  # Stage 1: Fast Feedback (~12 LEM)
  # Runs on every PR and push
  # ============================================================================
  fast:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-fast-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting (xtask)
        run: cargo run -p xtask -- gate --check --only fmt

      - name: Run clippy lints (xtask)
        run: cargo run -p xtask -- gate --check --only clippy

      - name: Check lint policy
        run: cargo run -p xtask -- check-lint-policy

      - name: Check no-panic-family policy
        run: cargo run -p xtask -- check-no-panic-family

      - name: Check non-Rust file policy
        run: cargo run -p xtask -- check-file-policy

      - name: Install ripr
        if: github.event_name == 'pull_request'
        run: cargo install ripr --locked

      - name: Fetch base branch for RIPR
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      - name: RIPR PR evidence
        if: github.event_name == 'pull_request'
        run: cargo xtask ripr-pr

      - name: RIPR review guidance
        if: github.event_name == 'pull_request'
        run: cargo xtask ripr-review-comments

      - name: RIPR PR contract
        if: always() && github.event_name == 'pull_request'
        run: cargo xtask ripr-pr --check

      - name: RIPR review summary
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo "## RIPR Review Guidance"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: RIPR annotations
        if: always() && github.event_name == 'pull_request'
        run: python scripts/ripr-annotations.py

      - name: Upload RIPR PR evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn

      - name: Upload RIPR review guidance
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn

      - name: Run unit tests
        run: cargo test --lib --workspace --all-features
        timeout-minutes: 3

      - name: Run doc tests
        run: cargo test --doc --workspace --all-features
        timeout-minutes: 2

  # ============================================================================
  # Stage 2: Standard Tests (~15 LEM)
  # Runs on every PR and push after fast stage passes
  # ============================================================================
  standard:
    name: Standard Tests
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-standard-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run integration tests
        run: cargo test --test '*' --workspace --all-features
        timeout-minutes: 10

      - name: Run BDD tests
        run: |
          # Run BDD tests for active crates that have them
          cargo test --test bdd_tests -p hl7v2-cli || echo "No BDD tests in hl7v2-cli"
          cargo test --test bdd_tests -p hl7v2-server || echo "No BDD tests in hl7v2-server"
        timeout-minutes: 5

      - name: Run limited property tests
        env:
          PROPTEST_CASES: 100
        run: |
          cargo test -p hl7v2 --all-features property_tests
        timeout-minutes: 5

  # ============================================================================
  # Stage 2 (Parallel): MSRV smoke (~12 LEM)
  # Runs on every PR: verifies the minimum supported Rust version compiles.
  # ============================================================================
  msrv-smoke:
    name: MSRV Smoke (1.95)
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.95'

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-msrv-1.95-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace --all-features
        timeout-minutes: 10

  # ============================================================================
  # Stage 2 (Parallel): Full Multi-OS/Toolchain Matrix (~85 LEM)
  # Runs on: main push, merge_group, platform-matrix label, full-ci label,
  #           release-check label, workflow_dispatch.
  # NOT the default for ordinary PRs (see msrv-smoke above).
  # ============================================================================
  matrix-test:
    name: Matrix Tests
    runs-on: ${{ matrix.os }}
    needs: fast
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'platform-matrix') ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'release-check')
        )
      )
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, '1.95']
        exclude:
          # beta and MSRV only on ubuntu to reduce CI load
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: '1.95'
          - os: macos-latest
            rust: '1.95'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-matrix-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}
          # Only save the canonical ubuntu+stable cache from main
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}

      - name: Run tests
        run: cargo test --workspace --all-features
        timeout-minutes: 10

  # ============================================================================
  # Stage 3: Extended Tests (~20 LEM)
  # Runs only on main branch after standard stage passes
  # ============================================================================
  extended:
    name: Extended Tests
    runs-on: ubuntu-latest
    needs: [fast, standard]
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'property-tests') ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'release-check')
        )
      )
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-extended-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run full property tests
        env:
          PROPTEST_CASES: 1000
        run: |
          cargo test -p hl7v2 --all-features property_tests
        timeout-minutes: 10

  # ============================================================================
  # Stage 3 (Parallel): Benchmarks (~15 LEM)
  # Non-failing, tracks performance regressions
  # ============================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [fast, standard]
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        (
          contains(github.event.pull_request.labels.*.name, 'benchmarks') ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'release-check')
        )
      )
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hl7v2-bench-stable-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run benchmarks
        run: |
          cargo bench --workspace 2>&1 | tee benchmark-results.txt || true
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

  # ============================================================================
  # Summary Job (~1 LEM)
  # Reports overall CI status; candidate for branch protection simplification
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fast, standard, msrv-smoke, matrix-test]
    if: always()
    steps:
      - name: Check CI status
        run: |
          set -euo pipefail

          FAST='${{ needs.fast.result }}'
          STANDARD='${{ needs.standard.result }}'
          MSRV='${{ needs.msrv-smoke.result }}'
          MATRIX='${{ needs.matrix-test.result }}'

          echo "fast=$FAST standard=$STANDARD msrv=$MSRV matrix=$MATRIX"

          if [ "$FAST" != "success" ]; then
            echo "::error::Fast checks did not pass: $FAST"
            exit 1
          fi
          if [ "$STANDARD" != "success" ]; then
            echo "::error::Standard tests did not pass: $STANDARD"
            exit 1
          fi
          if [ "$MSRV" != "success" ]; then
            echo "::error::MSRV smoke did not pass: $MSRV"
            exit 1
          fi
          if [ "$MATRIX" != "success" ] && [ "$MATRIX" != "skipped" ]; then
            echo "::error::Matrix tests did not pass or skip cleanly: $MATRIX"
            exit 1
          fi

          echo "CI Pipeline completed successfully"
          echo "- Fast checks: passed"
          echo "- Standard tests: passed"
          echo "- MSRV smoke: passed"
          echo "- Matrix tests: $MATRIX"
