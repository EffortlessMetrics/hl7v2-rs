name: API Contracts

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'config.example.toml'
      - 'config/**'
      - '.spectral.yml'
      - 'buf.gen.yaml'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'config.example.toml'
      - 'config/**'
      - '.spectral.yml'
      - 'buf.gen.yaml'
      - '.github/workflows/contracts.yml'

jobs:
  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Validate OpenAPI
        run: spectral lint api/openapi/hl7v2-api-v1.yaml --ruleset .spectral.yml

      - name: Install Redocly
        run: npm install -g @redocly/cli

      - name: Generate API Docs
        run: redocly build-docs api/openapi/hl7v2-api-v1.yaml -o docs/api-reference.html

      - name: Upload API Docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api-reference.html

  validate-proto:
    name: Validate Protocol Buffers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install protoc-gen-doc
        run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1

      - name: Lint Protos
        run: buf lint api/proto

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          buf breaking api/proto \
            --against "https://github.com/${REPOSITORY}.git#branch=${BASE_REF},subdir=api/proto"

      - name: Generate Proto Docs
        run: |
          buf generate api/proto --template buf.gen.yaml

  schema-validation:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate Profile Schemas
        run: |
          ajv validate -c ajv-formats \
            -s schemas/profile/profile-v1.schema.json \
            -d 'profiles/*.yaml' \
            --spec=draft7

      - name: Convert Config TOML Fixtures
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          inputs = [Path("config.example.toml")]
          config_dir = Path("config")
          if config_dir.exists():
              inputs.extend(sorted(config_dir.glob("*.toml")))

          out_dir = Path("target/contracts/config")
          out_dir.mkdir(parents=True, exist_ok=True)

          for path in inputs:
              data = tomllib.loads(path.read_text(encoding="utf-8"))
              output = out_dir / f"{path.stem}.json"
              output.write_text(
                  json.dumps(data, indent=2, sort_keys=True),
                  encoding="utf-8",
              )
              print(f"{path} -> {output}")
          PY

      - name: Validate Config Schema
        run: |
          ajv validate -c ajv-formats \
            -s schemas/config/hl7v2-config-v1.schema.json \
            -d 'target/contracts/config/*.json' \
            --spec=draft7

      - name: Validate Test Data
        run: |
          find schemas -name '*.schema.json' -print0 | while IFS= read -r -d '' schema; do
            echo "Validating $schema"
            if [ "$schema" = "schemas/segment_field.schema.json" ]; then
              ajv compile -c ajv-formats -s "$schema" --spec=draft7
            else
              ajv compile -c ajv-formats \
                -s "$schema" \
                -r schemas/segment_field.schema.json \
                --spec=draft7
            fi
          done
