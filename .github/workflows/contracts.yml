name: API Contracts

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'fixtures/evidence/**'
      - 'config.example.toml'
      - 'config/**'
      - '.spectral.yml'
      - 'buf.gen.yaml'
      - 'xtask/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'fixtures/evidence/**'
      - 'config.example.toml'
      - 'config/**'
      - '.spectral.yml'
      - 'buf.gen.yaml'
      - 'xtask/**'
      - '.github/workflows/contracts.yml'

# Cancellation policy:
# - PR synchronize events cancel stale runs for the same PR.
# - Push and manual runs do NOT cancel in-progress contract validation.
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6.16.0

      - name: Validate OpenAPI
        run: spectral lint api/openapi/hl7v2-api-v1.yaml --ruleset .spectral.yml

      - name: Install Redocly
        run: npm install -g @redocly/cli@2.31.1

      - name: Generate API Docs
        run: redocly build-docs api/openapi/hl7v2-api-v1.yaml -o docs/api-reference.html

      - name: Upload API Docs
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/api-reference.html

  validate-proto:
    name: Validate Protocol Buffers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'

      - name: Install protoc-gen-doc
        run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1

      - name: Lint Protos
        run: npx -y @bufbuild/buf@1.69.0 lint api/proto

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          npx -y @bufbuild/buf@1.69.0 breaking api/proto \
            --against "https://github.com/${REPOSITORY}.git#branch=${BASE_REF},subdir=api/proto"

      - name: Generate Proto Docs
        run: |
          npx -y @bufbuild/buf@1.69.0 generate api/proto --template buf.gen.yaml

  schema-validation:
    name: Validate Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install ajv-cli
        run: npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1

      - name: Validate Profile Schemas
        run: |
          ajv validate -c ajv-formats \
            -s schemas/profile/profile-v1.schema.json \
            -d 'profiles/*.yaml' \
            --spec=draft7

      - name: Convert Config TOML Fixtures
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          inputs = [Path("config.example.toml")]
          config_dir = Path("config")
          if config_dir.exists():
              inputs.extend(sorted(config_dir.glob("*.toml")))

          out_dir = Path("target/contracts/config")
          out_dir.mkdir(parents=True, exist_ok=True)

          for path in inputs:
              data = tomllib.loads(path.read_text(encoding="utf-8"))
              output = out_dir / f"{path.stem}.json"
              output.write_text(
                  json.dumps(data, indent=2, sort_keys=True),
                  encoding="utf-8",
              )
              print(f"{path} -> {output}")
          PY

      - name: Validate Config Schema
        run: |
          ajv validate -c ajv-formats \
            -s schemas/config/hl7v2-config-v1.schema.json \
            -d 'target/contracts/config/*.json' \
            --spec=draft7

      - name: Validate Evidence Fixtures
        run: cargo run -p xtask -- evidence-schema-check

      - name: Validate Test Data
        run: |
          find schemas -name '*.schema.json' -print0 | while IFS= read -r -d '' schema; do
            echo "Validating $schema"
            if [ "$schema" = "schemas/segment_field.schema.json" ]; then
              ajv compile -c ajv-formats -s "$schema" --spec=draft7
            else
              ajv compile -c ajv-formats \
                -s "$schema" \
                -r schemas/segment_field.schema.json \
                --spec=draft7
            fi
          done
