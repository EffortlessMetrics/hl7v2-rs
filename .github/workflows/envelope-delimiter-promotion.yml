# One-shot branch repair; this workflow deletes itself after a successful promotion.
name: Envelope delimiter promotion

on:
  push:
    branches:
      - codex/977-envelope-delimiters

permissions:
  contents: read

jobs:
  promote:
    if: "${{ github.event.head_commit.message == 'chore: run envelope delimiter promotion' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply deterministic source patch
        run: |
          python .github/envelope_delimiter_promotion.py
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/hl7v2/src/writer/mod.rs")
          text = path.read_text()
          old = "Vec::with_capacity(batch_capacity_with_delims(batch, &delims))"
          new = "Vec::with_capacity(batch_capacity(batch))"
          if text.count(old) != 1:
              raise SystemExit(f"expected one standalone batch capacity call, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Verify envelope writer behavior
        run: |
          cargo test -p hl7v2 --lib writer::tests::test_write_batch_preserves_bhs_encoding_characters
          cargo test -p hl7v2 --lib writer::tests::test_write_file_batch_preserves_fhs_and_bhs_encoding_characters
          cargo test -p hl7v2 --lib writer::tests::test_write_batch_header_encoding_characters_follow_delims
          cargo test -p hl7v2 --lib writer::tests::test_write_file_batch_declares_one_delimiter_set_for_every_envelope
          cargo test -p hl7v2 --lib writer
          cargo check -p hl7v2 --all-targets --all-features
          cargo clippy -p hl7v2 --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check
      - name: Commit source-only promotion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/envelope-delimiter-promotion.yml
          git rm .github/envelope_delimiter_promotion.py
          git rm .github/envelope-delimiter-promotion.trigger
          git add crates/hl7v2/src/writer/mod.rs crates/hl7v2/src/writer/tests.rs
          git commit -m "fix(writer): keep batch envelope delimiters authoritative"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
