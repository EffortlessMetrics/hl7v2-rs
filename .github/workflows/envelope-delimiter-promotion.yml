# SPDX-License-Identifier: AGPL-3.0-or-later
# One-shot branch repair; this workflow deletes itself after a successful promotion.
name: Envelope delimiter promotion

on:
  push:
    branches:
      - codex/977-envelope-delimiters

permissions:
  contents: read

concurrency:
  group: envelope-delimiter-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: "${{ github.event.head_commit.message == 'chore: run envelope delimiter promotion' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Promote the file-envelope delimiter invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              if text.count(start) != 1:
                  raise SystemExit(f"expected one start marker: {start!r}")
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[:start_index] + replacement.rstrip() + "\n\n" + text[end_index:]

          mod_path = Path("crates/hl7v2/src/writer/mod.rs")
          text = mod_path.read_text()

          text = replace_between(
              text,
              "fn write_message_into(msg: &Message, buf: &mut Vec<u8>) {",
              "/// Write HL7 message with MLLP framing.",
              '''fn write_message_into(msg: &Message, buf: &mut Vec<u8>) {
    // Write segments
    for segment in &msg.segments {
        // Write segment ID
        buf.extend_from_slice(&segment.id);

        // MSH-1 and MSH-2 declare the delimiters used by the message. The
        // encoding characters are syntax, not ordinary field text, so they
        // must not pass through escaping.
        if &segment.id == b"MSH" {
            write_encoding_header_fields(segment, buf, &msg.delims);
        } else {
            // Write fields
            for field in &segment.fields {
                buf.push(msg.delims.field as u8);
                write_field(buf, field, &msg.delims);
            }
        }

        // End segment with carriage return
        buf.push(b'\\r');
    }
}''',
          )

          text = replace_between(
              text,
              "pub fn write_batch(batch: &Batch) -> Vec<u8> {",
              "/// Write file batch to bytes.",
              '''pub fn write_batch(batch: &Batch) -> Vec<u8> {
    let delims = get_delimiters_from_batch(batch);
    let mut result = Vec::with_capacity(batch_capacity_with_delims(batch, &delims));

    write_batch_with_delims(batch, &mut result, &delims);

    result
}

fn write_batch_with_delims(batch: &Batch, result: &mut Vec<u8>, delims: &Delims) {
    // Write BHS if present. BHS-1/BHS-2 have the same delimiter-declaration
    // role as MSH-1/MSH-2 and therefore use the same syntax writer.
    if let Some(header) = &batch.header {
        result.extend_from_slice(&header.id);
        write_encoding_header_fields(header, result, delims);
        result.push(b'\\r');
    }

    // Messages retain their own MSH-declared delimiter sets.
    for message in &batch.messages {
        write_message_into(message, result);
    }

    // BTS has no encoding-characters field.
    if let Some(trailer) = &batch.trailer {
        result.extend_from_slice(&trailer.id);
        result.push(delims.field as u8);
        write_segment_fields(trailer, result, delims);
        result.push(b'\\r');
    }
}''',
          )

          text = replace_between(
              text,
              "fn write_file_batch_into(file_batch: &FileBatch, result: &mut Vec<u8>) {",
              "// ============================================================================\n// Internal helper functions",
              '''fn write_file_batch_into(file_batch: &FileBatch, result: &mut Vec<u8>) {
    // One delimiter set governs the FHS/FTS envelope and every nested
    // BHS/BTS envelope. Resolve it once so a message-less leading batch cannot
    // introduce a conflicting default declaration.
    let delims = get_delimiters_from_file_batch(file_batch);

    // Write FHS if present
    if let Some(header) = &file_batch.header {
        result.extend_from_slice(&header.id);
        write_encoding_header_fields(header, result, &delims);
        result.push(b'\\r');
    }

    // Write all batches against the file-level envelope delimiters.
    for batch in &file_batch.batches {
        write_batch_with_delims(batch, result, &delims);
    }

    // Write FTS if present
    if let Some(trailer) = &file_batch.trailer {
        result.extend_from_slice(&trailer.id);
        result.push(delims.field as u8);
        write_segment_fields(trailer, result, &delims);
        result.push(b'\\r');
    }
}''',
          )

          text = replace_between(
              text,
              "fn batch_capacity(batch: &Batch) -> usize {",
              "fn file_batch_capacity(file_batch: &FileBatch) -> usize {",
              '''fn batch_capacity(batch: &Batch) -> usize {
    let delims = get_delimiters_from_batch(batch);
    batch_capacity_with_delims(batch, &delims)
}

fn batch_capacity_with_delims(batch: &Batch, delims: &Delims) -> usize {
    let mut capacity: usize = 0;

    if let Some(header) = &batch.header {
        capacity = capacity.saturating_add(segment_capacity(header, delims, true));
    }
    for message in &batch.messages {
        capacity = capacity.saturating_add(message_capacity(message));
    }
    if let Some(trailer) = &batch.trailer {
        capacity = capacity.saturating_add(segment_fields_capacity(trailer, delims));
    }

    capacity
}''',
          )

          text = replace_between(
              text,
              "fn file_batch_capacity(file_batch: &FileBatch) -> usize {",
              "fn segment_capacity(segment: &Segment, delims: &Delims, is_msh: bool) -> usize {",
              '''fn file_batch_capacity(file_batch: &FileBatch) -> usize {
    let delims = get_delimiters_from_file_batch(file_batch);
    let mut capacity: usize = 0;

    if let Some(header) = &file_batch.header {
        capacity = capacity.saturating_add(segment_capacity(header, &delims, true));
    }
    for batch in &file_batch.batches {
        capacity = capacity.saturating_add(batch_capacity_with_delims(batch, &delims));
    }
    if let Some(trailer) = &file_batch.trailer {
        capacity = capacity.saturating_add(segment_fields_capacity(trailer, &delims));
    }

    capacity
}''',
          )

          text = replace_between(
              text,
              "/// Helper function to write segment fields (without segment ID)",
              "#[cfg(test)]\nmod tests;",
              '''/// Write fields for an envelope header whose first two HL7 fields
/// declare its delimiter set (`MSH`, `BHS`, or `FHS`).
///
/// `segment.fields[0]` is the parsed encoding-characters field. It is skipped
/// deliberately: passing `^~\\&` through `write_field` would escape the escape
/// character and corrupt the delimiter declaration itself.
fn write_encoding_header_fields(segment: &Segment, output: &mut Vec<u8>, delims: &Delims) {
    output.push(delims.field as u8);
    output.push(delims.comp as u8);
    output.push(delims.rep as u8);
    output.push(delims.esc as u8);
    output.push(delims.sub as u8);

    for field in segment.fields.iter().skip(1) {
        output.push(delims.field as u8);
        write_field(output, field, delims);
    }
}

/// Helper function to write segment fields (without segment ID)
fn write_segment_fields(segment: &Segment, output: &mut Vec<u8>, delims: &Delims) {
    for (i, field) in segment.fields.iter().enumerate() {
        if i > 0 {
            output.push(delims.field as u8);
        }
        write_field(output, field, delims);
    }
}

fn get_delimiters_from_batch(batch: &Batch) -> Delims {
    batch
        .messages
        .first()
        .map_or_else(Delims::default, |message| message.delims.clone())
}

/// Return the delimiter set governing a file-level envelope.
///
/// Scan every nested batch because the leading batch may contain no messages.
/// Falling back from that batch alone would let one file declare multiple
/// envelope delimiter sets.
fn get_delimiters_from_file_batch(file_batch: &FileBatch) -> Delims {
    file_batch
        .batches
        .iter()
        .find_map(|batch| batch.messages.first())
        .map_or_else(Delims::default, |message| message.delims.clone())
}''',
          )

          mod_path.write_text(text)

          tests_path = Path("crates/hl7v2/src/writer/tests.rs")
          tests = tests_path.read_text()
          if "test_write_batch_preserves_bhs_encoding_characters" in tests:
              raise SystemExit("envelope delimiter regressions already exist")

          test_block = r'''

// ============================================================================
// Batch/file envelope delimiter regressions
// ============================================================================

#[test]
fn test_write_batch_preserves_bhs_encoding_characters() {
    let batch = Batch {
        header: Some(Segment {
            id: *b"BHS",
            fields: vec![Field::from_text("^~\\&"), Field::from_text("SENDAPP")],
        }),
        messages: vec![Message {
            delims: Delims::default(),
            segments: vec![Segment {
                id: *b"MSH",
                fields: vec![Field::from_text("^~\\&"), Field::from_text("APP")],
            }],
            charsets: vec![],
        }],
        trailer: None,
    };

    let bytes = write_batch(&batch);
    assert_eq!(bytes.capacity(), bytes.len());
    let result = String::from_utf8(bytes).unwrap();

    assert!(result.starts_with("BHS|^~\\&|SENDAPP\rMSH|^~\\&|APP\r"));
    assert!(!result.contains("BHS|^~\\E\\&"));
}

#[test]
fn test_write_file_batch_preserves_fhs_and_bhs_encoding_characters() {
    let file_batch = FileBatch {
        header: Some(Segment {
            id: *b"FHS",
            fields: vec![Field::from_text("^~\\&"), Field::from_text("FILE")],
        }),
        batches: vec![Batch {
            header: Some(Segment {
                id: *b"BHS",
                fields: vec![Field::from_text("^~\\&"), Field::from_text("BATCH")],
            }),
            messages: vec![Message {
                delims: Delims::default(),
                segments: vec![Segment {
                    id: *b"MSH",
                    fields: vec![Field::from_text("^~\\&"), Field::from_text("APP")],
                }],
                charsets: vec![],
            }],
            trailer: Some(Segment {
                id: *b"BTS",
                fields: vec![Field::from_text("1")],
            }),
        }],
        trailer: Some(Segment {
            id: *b"FTS",
            fields: vec![Field::from_text("1")],
        }),
    };

    let bytes = write_file_batch(&file_batch);
    assert_eq!(bytes.capacity(), bytes.len());
    let result = String::from_utf8(bytes).unwrap();

    assert!(result.starts_with("FHS|^~\\&|FILE\rBHS|^~\\&|BATCH\r"));
    assert!(!result.contains("FHS|^~\\E\\&"));
    assert!(!result.contains("BHS|^~\\E\\&"));
}

#[test]
fn test_write_batch_header_encoding_characters_follow_delims() {
    let delims = Delims {
        field: '!',
        comp: '*',
        rep: '~',
        esc: '\\',
        sub: '&',
    };
    let batch = Batch {
        header: Some(Segment {
            id: *b"BHS",
            fields: vec![Field::from_text("^~\\&"), Field::from_text("SENDAPP")],
        }),
        messages: vec![Message {
            delims,
            segments: vec![Segment {
                id: *b"MSH",
                fields: vec![Field::from_text("ignored"), Field::from_text("APP")],
            }],
            charsets: vec![],
        }],
        trailer: None,
    };

    let result = String::from_utf8(write_batch(&batch)).unwrap();
    assert!(result.starts_with("BHS!*~\\&!SENDAPP\rMSH!*~\\&!APP\r"));
    assert!(!result.starts_with("BHS!^~\\&"));
}

#[test]
fn test_write_file_batch_declares_one_delimiter_set_for_every_envelope() {
    let delims = Delims {
        field: '!',
        comp: '*',
        rep: '~',
        esc: '\\',
        sub: '&',
    };
    let empty_batch = Batch {
        header: Some(Segment {
            id: *b"BHS",
            fields: vec![Field::from_text("^~\\&"), Field::from_text("EMPTY")],
        }),
        messages: vec![],
        trailer: Some(Segment {
            id: *b"BTS",
            fields: vec![Field::from_text("0")],
        }),
    };
    let populated_batch = Batch {
        header: Some(Segment {
            id: *b"BHS",
            fields: vec![Field::from_text("^~\\&"), Field::from_text("FULL")],
        }),
        messages: vec![Message {
            delims,
            segments: vec![Segment {
                id: *b"MSH",
                fields: vec![Field::from_text("ignored"), Field::from_text("APP")],
            }],
            charsets: vec![],
        }],
        trailer: Some(Segment {
            id: *b"BTS",
            fields: vec![Field::from_text("1")],
        }),
    };
    let file_batch = FileBatch {
        header: Some(Segment {
            id: *b"FHS",
            fields: vec![Field::from_text("^~\\&"), Field::from_text("FILE")],
        }),
        batches: vec![empty_batch, populated_batch],
        trailer: Some(Segment {
            id: *b"FTS",
            fields: vec![Field::from_text("2")],
        }),
    };

    let bytes = write_file_batch(&file_batch);
    assert_eq!(bytes.capacity(), bytes.len());
    let result = String::from_utf8(bytes).unwrap();
    let lines: Vec<_> = result.split_terminator('\r').collect();

    assert_eq!(lines[0], "FHS!*~\\&!FILE");
    assert_eq!(lines[1], "BHS!*~\\&!EMPTY");
    assert_eq!(lines[2], "BTS!0");
    assert_eq!(lines[3], "BHS!*~\\&!FULL");
    assert_eq!(lines[4], "MSH!*~\\&!APP");
    assert_eq!(lines[5], "BTS!1");
    assert_eq!(lines[6], "FTS!2");
}
'''
          tests_path.write_text(tests.rstrip() + test_block + "\n")
          PY
          cargo fmt --all
      - name: Verify envelope writer behavior
        run: |
          cargo test -p hl7v2 --lib writer::tests::test_write_batch_preserves_bhs_encoding_characters
          cargo test -p hl7v2 --lib writer::tests::test_write_file_batch_preserves_fhs_and_bhs_encoding_characters
          cargo test -p hl7v2 --lib writer::tests::test_write_batch_header_encoding_characters_follow_delims
          cargo test -p hl7v2 --lib writer::tests::test_write_file_batch_declares_one_delimiter_set_for_every_envelope
          cargo test -p hl7v2 --lib writer
          cargo check -p hl7v2 --all-targets --all-features
          cargo clippy -p hl7v2 --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check
      - name: Commit source-only promotion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/envelope-delimiter-promotion.yml
          git add crates/hl7v2/src/writer/mod.rs crates/hl7v2/src/writer/tests.rs
          git commit -m "fix(writer): keep batch envelope delimiters authoritative"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
