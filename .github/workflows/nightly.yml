# HL7 v2 Rust Workspace - Nightly Tests
# Implements Stage4 of the pipeline design from docs/TESTING_ARCHITECTURE.md
#
# Stage 4 (Nightly - ~1 hour): Fuzz tests, Mutation tests
# Runs on schedule (nightly) and can be manually triggered

name: Nightly Tests

on:
  schedule:
    # Run at 2:00 AM UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzz test duration in seconds'
        required: false
        default: '300'
      run_mutation:
        description: 'Run mutation tests'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: -Dwarnings

jobs:
  # ============================================================================
  # Fuzz Tests
  # Uses cargo-fuzz with libFuzzer for extended fuzzing sessions
  # ============================================================================
  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - parser
          - value_source
          - mllp_codec
          - escape
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust toolchain (required for fuzzing)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz test - ${{ matrix.target }}
        run: |
          # Check if fuzz target exists
          if cargo fuzz list | grep -q "^${{ matrix.target }}$"; then
            echo "Running fuzz target: ${{ matrix.target }}"
            cargo fuzz run ${{ matrix.target }} \
              -- -max_total_time=${{ github.event.inputs.fuzz_duration || '300' }} \
                 -max_len=4096 \
                 -timeout=10
          else
            echo "Fuzz target ${{ matrix.target }} not found, skipping..."
            echo "Available targets:"
            cargo fuzz list || true
          fi
        continue-on-error: true
        timeout-minutes: 30

      - name: Collect fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30

  # ============================================================================
  # Mutation Tests
  # Uses cargo-mutants to find code that isn't being properly tested
  # ============================================================================
  mutation-tests:
    name: Mutation Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.run_mutation == 'true'
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation-nightly

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 26.1.2 --locked

      - name: Run mutation tests
        run: |
          set +e
          cargo mutants \
            --workspace \
            --timeout 300 \
            --output target/nightly-mutation \
            --no-shuffle
          mutation_status=$?
          set -e

          case "$mutation_status" in
            0)
              echo "::notice::cargo-mutants caught every tested viable mutant."
              ;;
            1)
              echo "::error::cargo-mutants failed because of invalid command-line arguments."
              ;;
            2)
              echo "::error::cargo-mutants found missed mutants. Review the mutation report artifact."
              ;;
            3)
              echo "::error::cargo-mutants reported timed-out tests. Review the mutation report artifact."
              ;;
            4)
              echo "::error::cargo-mutants baseline tests failed before mutation."
              ;;
            5|6)
              echo "::error::cargo-mutants diff input was invalid."
              ;;
            70)
              echo "::error::cargo-mutants reported an internal error."
              ;;
            *)
              echo "::error::cargo-mutants returned unexpected status ${mutation_status}."
              ;;
          esac

          exit "$mutation_status"
        timeout-minutes: 60

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: target/nightly-mutation/mutants.out/
          retention-days: 30

      - name: Parse mutation results
        if: always()
        run: |
          echo "## Mutation Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          out_dir="target/nightly-mutation/mutants.out"
          if [ -d "$out_dir" ]; then
            echo "| Outcome | Count |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | ---: |" >> $GITHUB_STEP_SUMMARY
            for outcome in caught missed timeout unviable; do
              file="$out_dir/${outcome}.txt"
              if [ -f "$file" ]; then
                count=$(grep -cve '^[[:space:]]*$' "$file" || true)
              else
                count=0
              fi
              echo "| ${outcome} | ${count} |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See the uploaded mutation report artifact for `outcomes.json`, logs, and diffs." >> $GITHUB_STEP_SUMMARY
          else
            echo "Mutation test results not available in expected format." >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Extended Property Tests
  # More thorough property-based testing with higher case counts
  # ============================================================================
  extended-property-tests:
    name: Extended Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: extended-property

      - name: Run extended property tests
        env:
          PROPTEST_CASES: 10000
        run: |
          cargo test -p hl7v2 --all-features property_tests \
            -- --nocapture
        timeout-minutes: 25

  # ============================================================================
  # Security Audit
  # Daily security scan of dependencies
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: security-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings

      - name: Run cargo deny
        run: cargo deny check advisories licenses bans sources

  # ============================================================================
  # Documentation Generation
  # Build and upload documentation
  # ============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: Build documentation
        run: |
          cargo doc --workspace --all-features --no-deps \
            --document-private-items
        timeout-minutes: 10

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: target/doc/
          retention-days: 7

  # ============================================================================
  # Summary Job
  # Reports overall nightly test status
  # ============================================================================
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [fuzz-tests, mutation-tests, extended-property-tests, security-audit]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Nightly Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzz Tests | ${{ needs.fuzz-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mutation Tests | ${{ needs.mutation-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Extended Property Tests | ${{ needs.extended-property-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::Some nightly tests failed. Check the job results for details."
          exit 1
