# SPDX-License-Identifier: AGPL-3.0-or-later
# One-shot branch helper; the successful product commit removes it.
name: Parser envelope promotion

on:
  push:
    branches:
      - codex/977-parser-envelope-delimiters

permissions:
  contents: read

jobs:
  promote:
    if: "${{ github.event.head_commit.message == 'chore: run parser envelope promotion' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply parser envelope contract
        run: python .github/parser_envelope_promotion.py
      - name: Format
        run: cargo fmt --all
      - name: Verify parser envelope behavior
        run: |
          cargo test -p hl7v2 --lib parser::batch::tests::file_batch_inherits_custom_delimiters_into_message_less_batch
          cargo test -p hl7v2 --lib parser::batch::tests::file_batch_rejects_conflicting_batch_delimiter_declaration
          cargo test -p hl7v2 --lib parser::batch::tests::file_batch_rejects_conflicting_message_delimiter_declaration
          cargo test -p hl7v2 --lib parser::segment::tests::envelope_headers_store_encoding_characters_as_one_logical_field
          cargo test -p hl7v2 --lib parser
          cargo check -p hl7v2 --all-targets --all-features
          cargo clippy -p hl7v2 --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check
      - name: Commit source-only promotion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/parser-envelope-promotion.yml
          git rm .github/parser_envelope_promotion.py
          git add crates/hl7v2/src/parser/batch.rs crates/hl7v2/src/parser/segment.rs
          git commit -m "fix(parser): enforce envelope delimiter inheritance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
