name: PR 977 UTF-8 product repair

on:
  push:
    branches: ['codex/977-utf8-delimiters']
    paths:
      - '.github/workflows/pr-977-product-repair.yml'

permissions:
  contents: write

concurrency:
  group: pr-977-product-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/977-utf8-delimiters
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Apply and verify product repair
        run: |
          python3 scripts/ci/pr_977_utf8_repair.py
          python3 <<'PY'
          from pathlib import Path

          path = Path('crates/hl7v2/src/writer/mod.rs')
          data = path.read_bytes()
          replacements = [
              (
                  b'.saturating_add(if index > 0 {\n                    delims.rep.len_utf8()\n                } else {\n                    0\n                })',
                  b'.saturating_add(if index > 0 { delims.rep.len_utf8() } else { 0 })',
              ),
              (
                  b'.saturating_add(if index > 0 {\n                    delims.comp.len_utf8()\n                } else {\n                    0\n                })',
                  b'.saturating_add(if index > 0 { delims.comp.len_utf8() } else { 0 })',
              ),
              (
                  b'.saturating_add(if index > 0 {\n                    delims.sub.len_utf8()\n                } else {\n                    0\n                })',
                  b'.saturating_add(if index > 0 { delims.sub.len_utf8() } else { 0 })',
              ),
          ]
          for old, new in replacements:
              found = data.count(old)
              if found != 1:
                  raise SystemExit(f'expected one formatter replacement, found {found}: {old!r}')
              data = data.replace(old, new)
          path.write_bytes(data)
          PY
          git -c core.whitespace=cr-at-eol diff --check
          cargo fmt --all -- --check
          cargo test -p hl7v2 --lib utf8_tests

          rm scripts/ci/pr_977_utf8_repair.py
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/writer/mod.rs crates/hl7v2/src/writer/utf8_tests.rs scripts/ci/pr_977_utf8_repair.py
          git commit -m 'fix(writer): encode delimiters as UTF-8'
          git push origin HEAD:codex/977-utf8-delimiters
