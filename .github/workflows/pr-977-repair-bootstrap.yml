name: PR 977 repair bootstrap

on:
  push:
    branches: ['codex/977-utf8-delimiters']
    paths:
      - '.github/workflows/pr-977-repair-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: pr-977-repair-bootstrap
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/977-utf8-delimiters
          fetch-depth: 0

      - name: Correct legacy CRLF diff check and remove bootstrap
        run: |
          python3 <<'PY'
          from pathlib import Path

          repair = Path('.github/workflows/pr-977-utf8-delimiter-repair.yml')
          text = repair.read_text(encoding='utf-8')
          old = '          git diff --check\n'
          new = '          git -c core.whitespace=cr-at-eol diff --check\n'
          if text.count(old) != 1:
              raise SystemExit('repair workflow diff check was not found exactly once')
          repair.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/pr-977-repair-bootstrap.yml').unlink()
          PY

          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add .github/workflows/pr-977-utf8-delimiter-repair.yml .github/workflows/pr-977-repair-bootstrap.yml
          git commit -m 'chore: permit retained CRLF in byte-preserving repair'
          git push origin HEAD:codex/977-utf8-delimiters
