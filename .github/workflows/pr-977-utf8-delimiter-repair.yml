name: PR 977 UTF-8 delimiter repair

on:
  push:
    branches: ['codex/977-utf8-delimiters']
    paths:
      - '.github/workflows/pr-977-utf8-delimiter-repair.yml'

permissions:
  contents: write

concurrency:
  group: pr-977-utf8-delimiter-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/977-utf8-delimiters
          fetch-depth: 0

      - name: Apply byte-preserving writer repair
        env:
          UTF8_TEST_B64: 
          WRITER_HELPER_B64: 
        run: |
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("crates/hl7v2/src/writer/mod.rs")
          data = path.read_bytes()

          def replace_exact(old: bytes, new: bytes, expected: int = 1) -> None:
              global data
              found = data.count(old)
              if found != expected:
                  raise SystemExit(f"expected {expected} occurrences of {old!r}, found {found}")
              data = data.replace(old, new)

          def replace_between(start: bytes, end: bytes, old: bytes, new: bytes, expected: int = 1) -> None:
              global data
              start_at = data.index(start)
              end_at = data.index(end, start_at)
              block = data[start_at:end_at]
              found = block.count(old)
              if found != expected:
                  raise SystemExit(
                      f"expected {expected} occurrences of {old!r} between {start!r} and {end!r}, found {found}"
                  )
              block = block.replace(old, new)
              data = data[:start_at] + block + data[end_at:]

          replace_exact(
              b"buf.push(msg.delims.field as u8);",
              b"push_delimiter(buf, msg.delims.field);",
          )
          replace_exact(
              b"result.push(delims.field as u8);",
              b"push_delimiter(result, delims.field);",
              expected=2,
          )
          replace_exact(
              b"output.push(delims.field as u8);",
              b"push_delimiter(output, delims.field);",
              expected=3,
          )
          replace_exact(
              b"output.push(delims.comp as u8);",
              b"push_delimiter(output, delims.comp);",
              expected=2,
          )
          replace_exact(
              b"output.push(delims.rep as u8);",
              b"push_delimiter(output, delims.rep);",
              expected=2,
          )
          replace_exact(
              b"output.push(delims.esc as u8);",
              b"push_delimiter(output, delims.esc);",
          )
          replace_exact(
              b"output.push(delims.sub as u8);",
              b"push_delimiter(output, delims.sub);",
              expected=2,
          )

          replace_exact(
              b"capacity = capacity.saturating_add(5);",
              b"capacity = capacity.saturating_add(encoding_header_delimiters_capacity(delims));",
          )
          replace_between(
              b"fn segment_capacity(",
              b"fn segment_fields_capacity(",
              b".saturating_add(1)\n                .saturating_add(field_capacity(field, delims));",
              b".saturating_add(delims.field.len_utf8())\n                .saturating_add(field_capacity(field, delims));",
              expected=2,
          )
          replace_between(
              b"fn segment_fields_capacity(",
              b"fn field_capacity(",
              b".saturating_add(if index > 0 { 1 } else { 0 })",
              b".saturating_add(if index > 0 {\n                        delims.field.len_utf8()\n                    } else {\n                        0\n                    })",
          )
          replace_between(
              b"fn segment_fields_capacity(",
              b"fn field_capacity(",
              b".saturating_add(1)\n        .saturating_add(fields_capacity)",
              b".saturating_add(delims.field.len_utf8())\n        .saturating_add(fields_capacity)",
          )
          replace_between(
              b"fn field_capacity(",
              b"fn rep_capacity(",
              b".saturating_add(if index > 0 { 1 } else { 0 })",
              b".saturating_add(if index > 0 {\n                    delims.rep.len_utf8()\n                } else {\n                    0\n                })",
          )
          replace_between(
              b"fn rep_capacity(",
              b"fn comp_capacity(",
              b".saturating_add(if index > 0 { 1 } else { 0 })",
              b".saturating_add(if index > 0 {\n                    delims.comp.len_utf8()\n                } else {\n                    0\n                })",
          )
          replace_between(
              b"fn comp_capacity(",
              b"fn atom_capacity(",
              b".saturating_add(if index > 0 { 1 } else { 0 })",
              b".saturating_add(if index > 0 {\n                    delims.sub.len_utf8()\n                } else {\n                    0\n                })",
          )

          helper = base64.b64decode(os.environ["WRITER_HELPER_B64"])
          replace_exact(
              b"/// Write a field to bytes (with escaping)",
              helper + b"/// Write a field to bytes (with escaping)",
          )
          replace_exact(
              b"#[cfg(test)]\r\nmod tests;\r\n",
              b"#[cfg(test)]\r\nmod tests;\r\n\n#[cfg(test)]\nmod utf8_tests;\n",
          )

          path.write_bytes(data)
          Path("crates/hl7v2/src/writer/utf8_tests.rs").write_bytes(
              base64.b64decode(os.environ["UTF8_TEST_B64"])
          )
          Path(".github/workflows/pr-977-utf8-delimiter-repair.yml").unlink()
          PY

          git diff --check
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/writer/mod.rs crates/hl7v2/src/writer/utf8_tests.rs .github/workflows/pr-977-utf8-delimiter-repair.yml
          git commit -m 'fix(writer): encode delimiters as UTF-8'
          git push origin HEAD:codex/977-utf8-delimiters
