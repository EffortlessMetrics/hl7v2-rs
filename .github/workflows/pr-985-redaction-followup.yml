name: PR 985 redaction follow-up

on:
  push:
    branches:
      - codex/977-redaction-repetitions

permissions:
  contents: write

concurrency:
  group: pr-985-redaction-followup
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: run PR 985 redaction follow-up' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Share canonical redaction execution
        shell: bash
        run: |
          python - <<'PY'
          import runpy
          import textwrap

          standard_dedent = textwrap.dedent

          def rust_aware_dedent(value: str) -> str:
              result = standard_dedent(value)
              if result.startswith((
                  "let redaction_policy",
                  "let receipt",
                  "let mut redacted_message",
              )):
                  return textwrap.indent(result, "    ")
              return result

          textwrap.dedent = rust_aware_dedent
          runpy.run_path(".github/pr-985-followup.py", run_name="__main__")
          PY

      - name: Format
        run: cargo fmt --all

      - name: Verify focused redaction surfaces
        run: |
          cargo test -p hl7v2 --lib redact
          cargo test -p hl7v2-server redaction
          cargo test -p hl7v2-cli --test redaction_repetition_test
          cargo check -p hl7v2-cli -p hl7v2-server --all-targets

      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            crates/hl7v2-cli/src/evidence_bundle.rs \
            crates/hl7v2-cli/tests/redaction_repetition_test.rs \
            crates/hl7v2-server/src/redaction.rs \
            api/proto/hl7v2/v1/hl7v2.proto \
            crates/hl7v2-server/proto/hl7v2/v1/hl7v2.proto \
            schemas/evidence/redaction-receipt-v1.schema.json \
            schemas/evidence/redaction-receipt-v2.schema.json \
            api/openapi/hl7v2-api-v1.yaml \
            crates/hl7v2-server/openapi/hl7v2-api-v1.yaml
          if git diff --cached --quiet; then
            echo "No source changes were produced"
            exit 1
          fi
          git commit -m "fix(redaction): share safe-analysis execution across surfaces"
          git push origin HEAD:codex/977-redaction-repetitions
