# SPDX-License-Identifier: AGPL-3.0-or-later
name: PR 988 parser roundtrip repair

on:
  push:
    branches:
      - codex/977-envelope-delimiters-clean

permissions:
  contents: read

concurrency:
  group: pr-988-parser-roundtrip-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: run PR 988 parser roundtrip repair' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Make encoding headers parser-authoritative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          segment_path = Path("crates/hl7v2/src/parser/segment.rs")
          segment = segment_path.read_text()
          start_marker = "    let mut fields = parse_fields(fields_str, delims)"
          end_marker = "\nfn parse_fields("
          if start_marker not in segment:
              raise SystemExit("segment parser start marker not found")
          start = segment.index(start_marker)
          end = segment.index(end_marker, start)
          replacement = '''    let fields = if is_encoding_header(&id) {
              parse_encoding_header_fields(fields_str, delims)
          } else {
              parse_fields(fields_str, delims)
          }
          .map_err(|e| Error::ParseError {
              segment_id: String::from_utf8_lossy(&id).to_string(),
              field_index: 0,
              source: Box::new(e),
          })?;

          Ok(Segment { id, fields })
          }

          fn is_encoding_header(id: &[u8; 3]) -> bool {
              id == b"MSH" || id == b"BHS" || id == b"FHS"
          }

          fn parse_encoding_header_fields(
              fields_str: &str,
              delims: &Delims,
          ) -> Result<Vec<Field>, Error> {
              let encoding_chars = String::from_iter([delims.comp, delims.rep, delims.esc, delims.sub]);
              let Some(remainder) = fields_str.strip_prefix(&encoding_chars) else {
                  return Err(Error::InvalidFieldFormat {
                      details: "Encoding header does not declare the configured delimiters".to_string(),
                  });
              };

              let mut fields = vec![encoding_field(delims)];
              if remainder.is_empty() {
                  return Ok(fields);
              }

              let Some(remaining_fields) = remainder.strip_prefix(delims.field) else {
                  return Err(Error::InvalidFieldFormat {
                      details: "Encoding characters must be followed by the field separator"
                          .to_string(),
                  });
              };
              fields.extend(parse_fields(remaining_fields, delims)?);
              Ok(fields)
          }

          fn encoding_field(delims: &Delims) -> Field {
              let encoding_chars = String::from_iter([delims.comp, delims.rep, delims.esc, delims.sub]);

              Field {
                  reps: vec![Rep {
                      comps: vec![Comp {
                          subs: vec![Atom::Text(encoding_chars)],
                      }],
                  }],
              }
          }
          '''
          segment_path.write_text(segment[:start] + replacement + segment[end:])

          batch_path = Path("crates/hl7v2/src/parser/batch.rs")
          batch = batch_path.read_text()

          batch_start = batch.index(
              "fn parse_batch_with_header(source: &str, lines: &[SegmentLine<'_>]) -> Result<Batch, Error> {"
          )
          batch_end = batch.index("\n    let mut header", batch_start)
          batch_prefix = '''fn parse_batch_with_header(source: &str, lines: &[SegmentLine<'_>]) -> Result<Batch, Error> {
              let Some(first_line) = lines.first() else {
                  return Err(Error::InvalidBatchHeader {
                      details: "Batch must start with BHS segment".to_string(),
                  });
              };
              if !first_line.text.starts_with("BHS") {
                  return Err(Error::InvalidBatchHeader {
                      details: "Batch must start with BHS segment".to_string(),
                  });
              }

              // BHS-1/BHS-2 declare the batch-envelope delimiters. Derive them
              // from the header itself so message-less and custom-delimiter
              // batches do not depend on a later MSH segment.
              let delims = Delims::parse_from_msh(first_line.text).map_err(|e| Error::BatchParseError {
                  details: format!("Failed to parse BHS delimiters: {}", e),
              })?;
          '''
          batch = batch[:batch_start] + batch_prefix + batch[batch_end:]

          file_start = batch.index("fn parse_file_batch_with_header(")
          file_end = batch.index("\n    let mut header", file_start)
          file_prefix = '''fn parse_file_batch_with_header(
              source: &str,
              lines: &[SegmentLine<'_>],
          ) -> Result<FileBatch, Error> {
              let Some(first_line) = lines.first() else {
                  return Err(Error::InvalidBatchHeader {
                      details: "File batch must start with FHS segment".to_string(),
                  });
              };
              if !first_line.text.starts_with("FHS") {
                  return Err(Error::InvalidBatchHeader {
                      details: "File batch must start with FHS segment".to_string(),
                  });
              }

              // FHS-1/FHS-2 are authoritative for the file envelope. Nested
              // BHS headers declare their own batch envelope and therefore parse
              // even when a leading batch contains no messages.
              let delims = Delims::parse_from_msh(first_line.text).map_err(|e| Error::BatchParseError {
                  details: format!("Failed to parse FHS delimiters: {}", e),
              })?;
          '''
          batch = batch[:file_start] + file_prefix + batch[file_end:]

          finder_start = batch.index("fn find_and_parse_delimiters(")
          finder_end = batch.index("fn segment_window", finder_start)
          batch_path.write_text(batch[:finder_start] + batch[finder_end:])

          tests_path = Path("crates/hl7v2/src/writer/tests.rs")
          tests = tests_path.read_text()
          if "fn test_write_then_parse_batch_round_trips_encoding_header()" in tests:
              raise SystemExit("round-trip tests already present")
          tests += r'''

          #[test]
          fn test_write_then_parse_batch_round_trips_encoding_header() -> Result<(), crate::model::Error> {
              let batch = Batch {
                  header: Some(Segment {
                      id: *b"BHS",
                      fields: vec![Field::from_text("ignored"), Field::from_text("SENDAPP")],
                  }),
                  messages: vec![Message {
                      delims: Delims::default(),
                      segments: vec![Segment {
                          id: *b"MSH",
                          fields: vec![Field::from_text("ignored"), Field::from_text("APP")],
                      }],
                      charsets: vec![],
                  }],
                  trailer: Some(Segment {
                      id: *b"BTS",
                      fields: vec![Field::from_text("1")],
                  }),
              };

              let bytes = write_batch(&batch);
              let parsed = crate::parser::parse_batch(&bytes)?;

              assert_eq!(
                  parsed
                      .header
                      .as_ref()
                      .and_then(|header| header.fields.first())
                      .and_then(Field::first_text),
                  Some("^~\\&")
              );
              assert_eq!(parsed.messages.len(), 1);
              assert_eq!(parsed.messages[0].delims, Delims::default());
              Ok(())
          }

          #[test]
          fn test_write_then_parse_file_batch_round_trips_custom_envelope(
          ) -> Result<(), crate::model::Error> {
              let delims = Delims {
                  field: '!',
                  comp: '*',
                  rep: '~',
                  esc: '\\',
                  sub: '&',
              };
              let file_batch = FileBatch {
                  header: Some(Segment {
                      id: *b"FHS",
                      fields: vec![Field::from_text("ignored"), Field::from_text("FILE")],
                  }),
                  batches: vec![
                      Batch {
                          header: Some(Segment {
                              id: *b"BHS",
                              fields: vec![Field::from_text("ignored"), Field::from_text("EMPTY")],
                          }),
                          messages: vec![],
                          trailer: Some(Segment {
                              id: *b"BTS",
                              fields: vec![Field::from_text("0")],
                          }),
                      },
                      Batch {
                          header: Some(Segment {
                              id: *b"BHS",
                              fields: vec![Field::from_text("ignored"), Field::from_text("FULL")],
                          }),
                          messages: vec![Message {
                              delims: delims.clone(),
                              segments: vec![Segment {
                                  id: *b"MSH",
                                  fields: vec![
                                      Field::from_text("ignored"),
                                      Field::from_text("APP"),
                                  ],
                              }],
                              charsets: vec![],
                          }],
                          trailer: Some(Segment {
                              id: *b"BTS",
                              fields: vec![Field::from_text("1")],
                          }),
                      },
                  ],
                  trailer: Some(Segment {
                      id: *b"FTS",
                      fields: vec![Field::from_text("2")],
                  }),
              };

              let bytes = write_file_batch(&file_batch);
              let parsed = crate::parser::parse_file_batch(&bytes)?;

              assert_eq!(
                  parsed
                      .header
                      .as_ref()
                      .and_then(|header| header.fields.first())
                      .and_then(Field::first_text),
                  Some("*~\\&")
              );
              assert_eq!(parsed.batches.len(), 2);
              assert!(parsed.batches[0].messages.is_empty());
              assert_eq!(parsed.batches[1].messages[0].delims, delims);
              assert_eq!(
                  parsed.batches[1]
                      .header
                      .as_ref()
                      .and_then(|header| header.fields.first())
                      .and_then(Field::first_text),
                  Some("*~\\&")
              );
              Ok(())
          }
          '''
          tests_path.write_text(tests)
          PY
          cargo fmt --all

      - name: Verify writer-parser interoperability
        run: |
          cargo test -p hl7v2 --lib writer::tests::test_write_then_parse_batch_round_trips_encoding_header
          cargo test -p hl7v2 --lib writer::tests::test_write_then_parse_file_batch_round_trips_custom_envelope
          cargo test -p hl7v2 --lib parser
          cargo test -p hl7v2 --lib writer
          cargo check -p hl7v2 --all-targets --all-features
          cargo clippy -p hl7v2 --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check

      - name: Commit source-only repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/pr-988-parser-roundtrip-repair.yml
          git add crates/hl7v2/src/parser/segment.rs crates/hl7v2/src/parser/batch.rs crates/hl7v2/src/writer/tests.rs
          git commit -m "fix(parser): round-trip batch delimiter headers"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
