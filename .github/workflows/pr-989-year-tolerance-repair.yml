name: PR 989 year tolerance repair

on:
  push:
    branches:
      - codex/977-temporal-tolerance

permissions:
  contents: read

concurrency:
  group: pr-989-year-tolerance-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: run PR 989 year tolerance repair' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Reconcile the shipped calendar-year tolerance contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          validation_path = Path("crates/hl7v2/src/conformance/profile/validation.rs")
          validation = validation_path.read_text()
          old_import = "use crate::model::{Atom, Comp, Field, Message, Rep, Segment};\nuse regex::Regex;"
          new_import = "use crate::model::{Atom, Comp, Field, Message, Rep, Segment};\nuse chrono::Datelike;\nuse regex::Regex;"
          if validation.count(old_import) != 1:
              raise SystemExit(f"validation import anchor: found {validation.count(old_import)}")
          validation = validation.replace(old_import, new_import, 1)

          parse_start = validation.index("/// Parse a temporal tolerance string")
          parse_end = validation.index("/// Validate temporal rule", parse_start)
          parse_block = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(super) enum TemporalTolerance {
              /// Exact elapsed-time tolerance.
              Fixed(chrono::Duration),
              /// Calendar-year tolerance, preserving month/day/time where possible.
              CalendarYears(u32),
          }

          impl TemporalTolerance {
              pub(super) fn deadline_after(
                  self,
                  after: chrono::DateTime<chrono::Utc>,
              ) -> chrono::DateTime<chrono::Utc> {
                  match self {
                      Self::Fixed(duration) => after
                          .checked_add_signed(duration)
                          .unwrap_or(chrono::DateTime::<chrono::Utc>::MAX_UTC),
                      Self::CalendarYears(years) => {
                          let Ok(years) = i32::try_from(years) else {
                              return chrono::DateTime::<chrono::Utc>::MAX_UTC;
                          };
                          let Some(target_year) = after.year().checked_add(years) else {
                              return chrono::DateTime::<chrono::Utc>::MAX_UTC;
                          };

                          if let Some(deadline) = after.with_year(target_year) {
                              return deadline;
                          }

                          // Clamp leap day to the last valid day of February in
                          // a non-leap target year while preserving the time.
                          if after.month() == 2 && after.day() == 29 {
                              return after
                                  .with_day(28)
                                  .and_then(|date| date.with_year(target_year))
                                  .unwrap_or(chrono::DateTime::<chrono::Utc>::MAX_UTC);
                          }

                          chrono::DateTime::<chrono::Utc>::MAX_UTC
                      }
                  }
              }
          }

          /// Parse a temporal tolerance such as `30s`, `5m`, `2h`, `1d`, or `1y`.
          ///
          /// Seconds, minutes, hours, and days are exact elapsed durations. Years
          /// are calendar years so shipped rules such as `1y` and `150y` retain
          /// their stated meaning across leap years; February 29 clamps to
          /// February 28 when the target year is not a leap year.
          ///
          /// The grammar is a non-negative ASCII integer followed by one unit
          /// character (`s`, `m`, `h`, `d`, or `y`). Returns `None` for malformed
          /// or overflowing values.
          pub(super) fn parse_tolerance(raw: &str) -> Option<TemporalTolerance> {
              // Split off the final character rather than a byte so malformed
              // multibyte suffixes cannot create an invalid UTF-8 boundary.
              let mut chars = raw.trim().chars();
              let unit = chars.next_back()?;
              let amount_text = chars.as_str();
              if amount_text.is_empty()
                  || !amount_text.bytes().all(|byte| byte.is_ascii_digit())
              {
                  return None;
              }

              if unit == 'y' {
                  return amount_text
                      .parse::<u32>()
                      .ok()
                      .map(TemporalTolerance::CalendarYears);
              }

              let amount = amount_text.parse::<i64>().ok()?;
              let duration = match unit {
                  's' => chrono::Duration::try_seconds(amount),
                  'm' => chrono::Duration::try_minutes(amount),
                  'h' => chrono::Duration::try_hours(amount),
                  'd' => chrono::Duration::try_days(amount),
                  _ => None,
              }?;
              Some(TemporalTolerance::Fixed(duration))
          }

          '''
          validation = validation[:parse_start] + parse_block + validation[parse_end:]

          tolerance_start = validation.index("    // A configured tolerance widens the allowed window")
          tolerance_end = validation.index("\n    if let Some((before_value, after_value))", tolerance_start)
          tolerance_block = '''    // A configured tolerance widens the allowed window: `before` may be up to
              // `tolerance` later than `after` and still be compliant. A malformed
              // value does not widen runtime acceptance; profile lint reports the
              // configuration error separately.
              let tolerance = rule
                  .tolerance
                  .as_deref()
                  .and_then(parse_tolerance)
                  .unwrap_or(TemporalTolerance::Fixed(chrono::Duration::zero()));

              // Shared by the search predicate and final check so the two cannot
              // drift. `allow_equal` governs exact equality at `after`; the upper
              // tolerance boundary itself is inclusive.
              let violates = |before_time: chrono::DateTime<chrono::Utc>,
                              after_time: chrono::DateTime<chrono::Utc>| {
                  let deadline = tolerance.deadline_after(after_time);
                  before_time > deadline || (!rule.allow_equal && before_time == after_time)
              };
          '''
          validation = validation[:tolerance_start] + tolerance_block + validation[tolerance_end:]
          validation_path.write_text(validation)

          lint_path = Path("crates/hl7v2/src/conformance/profile/lint.rs")
          lint = lint_path.read_text()
          old_lint = "followed by a unit (s, m, h, d), for example '30s' or '5m'"
          new_lint = "followed by a unit (s, m, h, d, y), for example '30s', '5m', or '1y'"
          if lint.count(old_lint) != 1:
              raise SystemExit(f"lint message anchor: found {lint.count(old_lint)}")
          lint_path.write_text(lint.replace(old_lint, new_lint, 1))

          tests_path = Path("crates/hl7v2/src/conformance/profile/tests.rs")
          tests = tests_path.read_text()
          test_start = tests.index("    #[test]\n    fn test_parse_tolerance_grammar_and_malformed_inputs()")
          test_end = tests.index("\n    #[test]\n    fn debug_compare_same_dates()", test_start)
          test_block = '''    #[test]
              fn test_parse_tolerance_grammar_and_malformed_inputs() {
                  use super::super::validation::{TemporalTolerance, parse_tolerance};

                  assert_eq!(
                      parse_tolerance("30s"),
                      chrono::Duration::try_seconds(30).map(TemporalTolerance::Fixed)
                  );
                  assert_eq!(
                      parse_tolerance("5m"),
                      chrono::Duration::try_minutes(5).map(TemporalTolerance::Fixed)
                  );
                  assert_eq!(
                      parse_tolerance("2h"),
                      chrono::Duration::try_hours(2).map(TemporalTolerance::Fixed)
                  );
                  assert_eq!(
                      parse_tolerance("1d"),
                      chrono::Duration::try_days(1).map(TemporalTolerance::Fixed)
                  );
                  assert_eq!(
                      parse_tolerance("1y"),
                      Some(TemporalTolerance::CalendarYears(1))
                  );
                  assert_eq!(
                      parse_tolerance("150y"),
                      Some(TemporalTolerance::CalendarYears(150))
                  );
                  assert_eq!(
                      parse_tolerance(" 5m "),
                      chrono::Duration::try_minutes(5).map(TemporalTolerance::Fixed)
                  );
                  assert_eq!(
                      parse_tolerance("0s"),
                      chrono::Duration::try_seconds(0).map(TemporalTolerance::Fixed)
                  );

                  // Malformed values must return None without panicking. Multibyte
                  // suffixes exercise the character-boundary path.
                  for bad in [
                      "",
                      "  ",
                      "5",
                      "m",
                      "5min",
                      "-5m",
                      "+5m",
                      "5x",
                      "€",
                      "5€",
                      "9999999999999999999d",
                      "9999999999999999999y",
                  ] {
                      assert_eq!(parse_tolerance(bad), None, "expected None for {bad:?}");
                  }
              }

              #[test]
              fn test_calendar_year_tolerance_preserves_repository_semantics() {
                  use super::super::validation::parse_tolerance;
                  use chrono::{TimeZone, Utc};

                  let leap_day = Utc
                      .with_ymd_and_hms(2024, 2, 29, 12, 30, 45)
                      .single()
                      .unwrap();
                  let one_year = parse_tolerance("1y").unwrap();
                  assert_eq!(
                      one_year.deadline_after(leap_day),
                      Utc.with_ymd_and_hms(2025, 2, 28, 12, 30, 45)
                          .single()
                          .unwrap()
                  );

                  let birth = Utc
                      .with_ymd_and_hms(1875, 9, 5, 0, 0, 0)
                      .single()
                      .unwrap();
                  let one_hundred_fifty_years = parse_tolerance("150y").unwrap();
                  assert_eq!(
                      one_hundred_fifty_years.deadline_after(birth),
                      Utc.with_ymd_and_hms(2025, 9, 5, 0, 0, 0)
                          .single()
                          .unwrap()
                  );
              }
          '''
          tests = tests[:test_start] + test_block + tests[test_end:]

          bad_rule = '''  - id: "good-tolerance"
              description: ""
              before: "PV1.10"
              after: "ORC.4"
              tolerance: "5m"
          "#;'''
          good_year_rule = '''  - id: "good-tolerance"
              description: ""
              before: "PV1.10"
              after: "ORC.4"
              tolerance: "5m"
            - id: "good-year-tolerance"
              description: ""
              before: "PV1.10"
              after: "ORC.4"
              tolerance: "1y"
          "#;'''
          if tests.count(bad_rule) != 1:
              raise SystemExit(f"lint YAML anchor: found {tests.count(bad_rule)}")
          tests = tests.replace(bad_rule, good_year_rule, 1)
          tests = tests.replace(
              '// Only the malformed "5min" tolerance is flagged; the valid "5m" is not.',
              '// Only malformed "5min" is flagged; both fixed and calendar-year units are valid.',
              1,
          )

          insertion_marker = '''    #[test]
              fn test_lint_profile_yaml_sanitizes_yaml_error_messages() {'''
          example_test = '''    #[test]
              fn shipped_profile_tolerances_match_runtime_grammar() {
                  for (name, yaml) in [
                      (
                          "ADT_A01",
                          include_str!("../../../../../examples/profiles/ADT_A01.yaml"),
                      ),
                      (
                          "ORU_R01",
                          include_str!("../../../../../examples/profiles/ORU_R01.yaml"),
                      ),
                  ] {
                      let report = lint_profile_yaml(yaml);
                      let tolerance_issues: Vec<_> = report
                          .issues
                          .iter()
                          .filter(|issue| issue.code == "invalid_temporal_tolerance")
                          .collect();
                      assert!(
                          tolerance_issues.is_empty(),
                          "{name} contains unsupported temporal tolerance syntax: {tolerance_issues:?}"
                      );
                  }
              }

              #[test]
              fn test_lint_profile_yaml_sanitizes_yaml_error_messages() {'''
          if tests.count(insertion_marker) != 1:
              raise SystemExit(f"example lint insertion anchor: found {tests.count(insertion_marker)}")
          tests_path.write_text(tests.replace(insertion_marker, example_test, 1))
          PY
          cargo fmt --all

      - name: Verify fixed and calendar tolerance semantics
        run: |
          cargo test -p hl7v2 --lib conformance::profile
          cargo check -p hl7v2 --all-targets --all-features
          cargo clippy -p hl7v2 --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check

      - name: Commit source-only repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/pr-989-year-tolerance-repair.yml
          git add crates/hl7v2/src/conformance/profile/validation.rs crates/hl7v2/src/conformance/profile/lint.rs crates/hl7v2/src/conformance/profile/tests.rs
          git commit -m "fix(profile): support calendar-year tolerances"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
