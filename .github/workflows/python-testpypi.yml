name: Python TestPyPI Proof

on:
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish the built wheel to TestPyPI and install it back"
        required: true
        type: boolean
        default: false
      diagnose_trusted_publisher:
        description: "Record TestPyPI trusted-publisher OIDC claims without uploading"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-testpypi-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  wheel_proof:
    name: Build and smoke wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate publish ref
        if: ${{ inputs.publish_to_testpypi && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::TestPyPI publishing proof must run from refs/heads/main"
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-testpypi-ubuntu-py3.13

      - name: Install maturin
        run: python -m pip install --upgrade pip "maturin==1.13.1"

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          package = next(
              pkg for pkg in metadata["packages"] if pkg["name"] == "hl7v2-python"
          )
          print(f"version={package['version']}")
          PY

      - name: Build wheel
        run: maturin build --release --out dist

      - name: Install built wheel in fresh venv
        shell: bash
        run: |
          python -m venv .venv-local-wheel
          . .venv-local-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl
          python tests/python_smoke/smoke.py
          python tests/python_smoke/evidence_workflow_guide.py
          python tests/python_smoke/dirty_evidence_workflow.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-testpypi-wheel
          path: dist/*.whl
          retention-days: 7

  publish_testpypi:
    name: Publish to TestPyPI
    needs: wheel_proof
    if: ${{ inputs.publish_to_testpypi || inputs.diagnose_trusted_publisher }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hl7v2/${{ needs.wheel_proof.outputs.package_version }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v7
        with:
          name: python-testpypi-wheel
          path: dist

      - name: Record trusted publisher setup
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.wheel_proof.outputs.package_version }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::TestPyPI publishing proof must run from refs/heads/main"
            exit 1
          fi

          {
            echo "## TestPyPI Trusted Publisher"
            echo
            echo "This job records the actual GitHub OIDC publisher claims for \`hl7v2==${PACKAGE_VERSION}\`."
            echo "It uploads to TestPyPI only when \`publish_to_testpypi=true\`."
            echo
            echo "| Field | Expected value |"
            echo "| --- | --- |"
            echo "| Project name | \`hl7v2\` |"
            echo "| Owner | \`EffortlessMetrics\` |"
            echo "| Repository name | \`hl7v2-rs\` |"
            echo "| Workflow filename | \`python-testpypi.yml\` |"
            echo "| Environment name | \`testpypi\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Trusted publisher subject | \`repo:${GITHUB_REPOSITORY}:environment:testpypi\` |"
            echo
            echo "If upload fails with \`invalid-publisher\`, configure the pending publisher on TestPyPI with these values and rerun this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record actual OIDC publisher claims
        shell: bash
        env:
          EXPECTED_SUBJECT: repo:${{ github.repository }}:environment:testpypi
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_ENVIRONMENT: testpypi
          EXPECTED_REF: refs/heads/main
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not request_url or not request_token:
              print(
                  "::error::GitHub OIDC request environment is missing; publish job needs id-token: write",
                  file=sys.stderr,
              )
              sys.exit(1)

          separator = "&" if urllib.parse.urlsplit(request_url).query else "?"
          token_url = f"{request_url}{separator}audience=pypi"
          request = urllib.request.Request(
              token_url,
              headers={"Authorization": f"Bearer {request_token}"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              token_response = json.load(response)
          token = token_response.get("value")
          if not token:
              print("::error::GitHub OIDC response did not include a token value", file=sys.stderr)
              sys.exit(1)

          try:
              payload = token.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload.encode("ascii")))
          except (IndexError, json.JSONDecodeError, ValueError) as error:
              print(f"::error::failed to decode GitHub OIDC claims: {error}", file=sys.stderr)
              sys.exit(1)

          expected = {
              "sub": os.environ["EXPECTED_SUBJECT"],
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "environment": os.environ["EXPECTED_ENVIRONMENT"],
              "ref": os.environ["EXPECTED_REF"],
          }
          summary_fields = [
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "environment",
              "workflow_ref",
              "job_workflow_ref",
              "sha",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Actual GitHub OIDC publisher claims\n\n")
              summary.write("| Claim | Value |\n| --- | --- |\n")
              for field in summary_fields:
                  summary.write(f"| `{field}` | `{claims.get(field, '')}` |\n")
              summary.write("\n")

          errors = []
          for claim, expected_value in expected.items():
              actual = claims.get(claim)
              if actual != expected_value:
                  errors.append(f"{claim}: expected {expected_value!r}, got {actual!r}")

          if errors:
              for error in errors:
                  print(f"::error::OIDC publisher claim mismatch: {error}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publish package distributions to TestPyPI
        if: ${{ inputs.publish_to_testpypi }}
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  install_from_testpypi:
    name: Install from TestPyPI and smoke
    needs:
      - wheel_proof
      - publish_testpypi
    if: ${{ inputs.publish_to_testpypi }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Install published wheel from TestPyPI
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.wheel_proof.outputs.package_version }}
        run: |
          cargo run -p xtask -- python-public-registry-proof \
            --index testpypi \
            --version "${PACKAGE_VERSION}"
