name: Reconcile batch header fields

on:
  push:
    branches:
      - codex/977-batch-header-fields

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source-first batch metadata fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("crates/hl7v2/src/batch.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "    /// Batch name/ID (from FHS/BHS-10)\n    pub batch_name: Option<String>,\n    /// Batch comment (from FHS/BHS-11)",
                  "    /// Batch name/ID/type (from BHS-9 / FHS-9)\n    pub batch_name: Option<String>,\n    /// Batch comment (from BHS-10 / FHS-10)",
              ),
              (
                  "    // fields[7] = (BHS-9 / FHS-9 — unused)\n    // fields[8] = Name/ID (BHS-10 / FHS-10)\n    // fields[9] = Batch Comment (BHS-11 / FHS-11)",
                  "    // fields[7] = Batch Name/ID/Type (BHS-9 / FHS-9)\n    // fields[8] = Batch Comment (BHS-10 / FHS-10)\n    // fields[9] = Batch Control ID (BHS-11 / FHS-11 — unused)",
              ),
              (
                  "    if let Some(batch_name) = fields.get(8) {\n        info.batch_name = Some((*batch_name).to_string());\n    }\n    if let Some(batch_comment) = fields.get(9) {",
                  "    if let Some(batch_name) = fields.get(7) {\n        info.batch_name = Some((*batch_name).to_string());\n    }\n    if let Some(batch_comment) = fields.get(8) {",
              ),
              (
                  '            "BHS*:+\\\\&*SEND*SFAC*RECV*RFAC*202605030101*SEC**BATCH42*Nightly import\\r{}\\rBTS*1*done\\r",',
                  '            // BHS-9 = Batch Name, BHS-10 = Comment, BHS-11 = Control ID.\\n            "BHS*:+\\\\&*SEND*SFAC*RECV*RFAC*202605030101*SEC*BATCH42*Nightly import*CTRLID\\r{}\\rBTS*1*done\\r",',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one batch replacement for: {old[:60]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          rm .github/workflows/reconcile-batch-header-fields.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/batch.rs .github/workflows/reconcile-batch-header-fields.yml
          git diff --cached --check
          git commit -m "fix(batch): read BHS and FHS metadata from fields 9 and 10"
          git push origin "HEAD:${GITHUB_REF_NAME}"
