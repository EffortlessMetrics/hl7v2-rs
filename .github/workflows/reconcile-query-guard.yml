name: Reconcile query guard

on:
  push:
    branches:
      - codex/977-query-msh-zero

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source-first query guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path("crates/hl7v2/src/query/mod.rs")
          text = source.read_text(encoding="utf-8")

          value_old = ") -> Option<&'a str> {\n    if field_index == 1 {\n        // MSH-1 is the field separator character"
          value_new = ") -> Option<&'a str> {\n    if field_index == 0 {\n        return None;\n    }\n\n    if field_index == 1 {\n        // MSH-1 is the field separator character"
          if text.count(value_old) != 1:
              raise SystemExit("expected one get_msh_field insertion point")
          text = text.replace(value_old, value_new, 1)

          presence_old = ") -> Presence {\n    if field_index == 1 {\n        // MSH-1 is the field separator character"
          presence_new = ") -> Presence {\n    if field_index == 0 {\n        return Presence::Missing;\n    }\n\n    if field_index == 1 {\n        // MSH-1 is the field separator character"
          if text.count(presence_old) != 1:
              raise SystemExit("expected one get_msh_field_presence insertion point")
          text = text.replace(presence_old, presence_new, 1)
          source.write_text(text, encoding="utf-8")

          test = Path("crates/hl7v2/tests/query_programmatic_paths.rs")
          test.write_text(
              '''use hl7v2::{
              LocatedPath, Path, Presence, QueryIndex, get_located, get_presence_located, parse,
          };

          #[test]
          fn programmatic_msh_zero_field_is_missing_without_panicking()
          -> Result<(), Box<dyn std::error::Error>> {
              let message = parse(
                  b"MSH|^~\\\\&|SND|SF|RCV|RF|202609050101||ADT^A01|CTRL1|P|2.5\\rPID|1||12345\\r",
              )?;
              let path = LocatedPath {
                  segment_repetition: None,
                  path: Path::new("MSH", 0),
              };

              assert_eq!(get_located(&message, &path), None);
              assert!(matches!(
                  get_presence_located(&message, &path),
                  Presence::Missing
              ));

              let index = QueryIndex::new(&message);
              assert_eq!(index.get_located(&path), None);
              assert!(matches!(
                  index.get_presence_located(&path),
                  Presence::Missing
              ));
              Ok(())
          }
          ''',
              encoding="utf-8",
          )
          PY

          rm .github/workflows/reconcile-query-guard.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/query/mod.rs crates/hl7v2/tests/query_programmatic_paths.rs .github/workflows/reconcile-query-guard.yml
          git diff --cached --check
          git commit -m "fix(query): reject zero MSH field paths"
          git push origin "HEAD:${GITHUB_REF_NAME}"
