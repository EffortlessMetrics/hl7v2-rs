name: Reconcile repetition-complete redaction

on:
  push:
    branches:
      - codex/977-redaction-repetitions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source-first redaction repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          library = Path("crates/hl7v2/src/redact/target.rs")
          text = library.read_text(encoding="utf-8")
          old = dedent('''
          pub(crate) fn apply_redaction_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              action: RedactionAction,
              delims: &crate::Delims,
          ) -> bool {
              let Some(target) = select_target(field, path) else {
                  return false;
              };

              match action {
                  RedactionAction::Hash => target.hash(delims),
                  RedactionAction::Drop => target.drop_value(),
                  RedactionAction::Retain => {}
              }

              true
          }

          pub(crate) fn replace_redaction_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              replacement: &str,
          ) -> bool {
              let Some(target) = select_target(field, path) else {
                  return false;
              };

              target.replace_with_text(replacement.to_string());
              true
          }
          ''')
          new = dedent('''
          pub(crate) fn apply_redaction_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              action: RedactionAction,
              delims: &crate::Delims,
          ) -> bool {
              for_each_target(field, path, |target| match action {
                  RedactionAction::Hash => target.hash(delims),
                  RedactionAction::Drop => target.drop_value(),
                  RedactionAction::Retain => {}
              })
          }

          pub(crate) fn replace_redaction_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              replacement: &str,
          ) -> bool {
              for_each_target(field, path, |target| {
                  target.replace_with_text(replacement.to_string());
              })
          }
          ''')
          if text.count(old) != 1:
              raise SystemExit("expected library redaction entry points")
          text = text.replace(old, new, 1)

          old = dedent('''
          fn select_target<'a>(
              field: &'a mut Field,
              path: &ParsedRedactionPath,
          ) -> Option<RedactionTarget<'a>> {
              if path.field_repetition.is_none() && path.component.is_none() {
                  return Some(RedactionTarget::Field(field));
              }

              let rep_index = path.field_repetition.unwrap_or(1).checked_sub(1)?;
              let rep = field.reps.get_mut(rep_index)?;
              let Some(component) = path.component else {
                  return Some(RedactionTarget::Rep(rep));
              };

              let component_index = component.checked_sub(1)?;
              let comp = rep.comps.get_mut(component_index)?;
              let Some(subcomponent) = path.subcomponent else {
                  return Some(RedactionTarget::Comp(comp));
              };

              let subcomponent_index = subcomponent.checked_sub(1)?;
              comp.subs
                  .get_mut(subcomponent_index)
                  .map(RedactionTarget::Atom)
          }
          ''')
          new = dedent('''
          /// Visit all targets selected by a redaction path.
          ///
          /// A whole-field rule remains one target. A component or subcomponent
          /// rule without an explicit field-repetition selector visits every
          /// repetition; an explicit selector remains narrow. The boolean reports
          /// one match for the containing segment field, preserving receipt counts.
          fn for_each_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              mut visit: impl FnMut(RedactionTarget<'_>),
          ) -> bool {
              if path.field_repetition.is_none() && path.component.is_none() {
                  visit(RedactionTarget::Field(field));
                  return true;
              }

              if let Some(repetition) = path.field_repetition {
                  let Some(index) = repetition.checked_sub(1) else {
                      return false;
                  };
                  let Some(rep) = field.reps.get_mut(index) else {
                      return false;
                  };
                  let Some(target) = select_rep_target(rep, path) else {
                      return false;
                  };
                  visit(target);
                  return true;
              }

              let mut matched = false;
              for rep in &mut field.reps {
                  if let Some(target) = select_rep_target(rep, path) {
                      visit(target);
                      matched = true;
                  }
              }
              matched
          }

          fn select_rep_target<'a>(
              rep: &'a mut Rep,
              path: &ParsedRedactionPath,
          ) -> Option<RedactionTarget<'a>> {
              let Some(component) = path.component else {
                  return Some(RedactionTarget::Rep(rep));
              };

              let component_index = component.checked_sub(1)?;
              let comp = rep.comps.get_mut(component_index)?;
              let Some(subcomponent) = path.subcomponent else {
                  return Some(RedactionTarget::Comp(comp));
              };

              let subcomponent_index = subcomponent.checked_sub(1)?;
              comp.subs
                  .get_mut(subcomponent_index)
                  .map(RedactionTarget::Atom)
          }
          ''')
          if text.count(old) != 1:
              raise SystemExit("expected library select_target")
          text = text.replace(old, new, 1)

          tests = dedent(r'''

          #[cfg(test)]
          mod tests {
              use super::{field_to_text, replace_redaction_target};
              use crate::model::{Atom, Comp, Field, Rep};
              use crate::redact::path::parse_redaction_path;
              use crate::redact::{
                  RedactionActionStatus, RedactionConfig, RedactionError, redact,
                  redact_hl7_safe_analysis,
              };
              use std::io;

              type TestResult = Result<(), Box<dyn std::error::Error>>;

              fn require(condition: bool, message: &'static str) -> TestResult {
                  if condition {
                      Ok(())
                  } else {
                      Err(io::Error::other(message).into())
                  }
              }

              fn fixture_field(value: &str) -> Field {
                  Field {
                      reps: value
                          .split('~')
                          .map(|rep| Rep {
                              comps: rep
                                  .split('^')
                                  .map(|comp| Comp {
                                      subs: comp
                                          .split('&')
                                          .map(|atom| Atom::Text(atom.to_string()))
                                          .collect(),
                                  })
                                  .collect(),
                          })
                          .collect(),
                  }
              }

              #[test]
              fn omitted_repetition_selects_components_in_every_repetition() -> TestResult {
                  let mut field = fixture_field("Alpha^one~Beta^two~Gamma^three");
                  let path = parse_redaction_path("OBX.5.1")?;

                  require(
                      replace_redaction_target(&mut field, &path, "XXX"),
                      "component path should match the field",
                  )?;
                  require(
                      field_to_text(&field, &crate::Delims::default())
                          == "XXX^one~XXX^two~XXX^three",
                      "component replacement must cover every repetition",
                  )
              }

              #[test]
              fn explicit_repetition_remains_narrow() -> TestResult {
                  let mut field = fixture_field("Alpha^one~Beta^two");
                  let path = parse_redaction_path("OBX.5[2].1")?;

                  require(
                      replace_redaction_target(&mut field, &path, "XXX"),
                      "explicit repetition should match",
                  )?;
                  require(
                      field_to_text(&field, &crate::Delims::default()) == "Alpha^one~XXX^two",
                      "explicit repetition must not alter its sibling",
                  )
              }

              #[test]
              fn missing_early_component_does_not_hide_later_targets() -> TestResult {
                  let mut field = fixture_field("keep~keep^Alpha~keep^Beta");
                  let path = parse_redaction_path("OBX.5.2")?;

                  require(
                      replace_redaction_target(&mut field, &path, "XXX"),
                      "later repetitions should still match",
                  )?;
                  require(
                      field_to_text(&field, &crate::Delims::default())
                          == "keep~keep^XXX~keep^XXX",
                      "later component targets were not all replaced",
                  )
              }

              #[test]
              fn public_redaction_covers_repeated_fields_in_repeated_segments() -> TestResult {
                  let mut message = crate::parse(
                      b"MSH|^~\\&|SEND|FAC|RECV|FAC|202605090101||ORU^R01|CTRL1|P|2.5\rOBX|1|ST|A||Alpha^one~Beta^two\rOBX|2|ST|B||Gamma^three~Delta^four",
                  )?;
                  redact(
                      &mut message,
                      &RedactionConfig {
                          fields: vec!["OBX.5.1".to_string()],
                          replacement: "XXX".to_string(),
                      },
                  );
                  let written = String::from_utf8(crate::write(&message))?;

                  require(
                      written.contains("OBX|1|ST|A||XXX^one~XXX^two\r"),
                      "first repeated segment was not fully redacted",
                  )?;
                  require(
                      written.contains("OBX|2|ST|B||XXX^three~XXX^four\r"),
                      "second repeated segment was not fully redacted",
                  )
              }

              #[test]
              fn safe_analysis_counts_segments_not_field_repetitions() -> TestResult {
                  let output = redact_hl7_safe_analysis(
                      "MSH|^~\\&|SEND|FAC|RECV|FAC|202605090101||ORU^R01|CTRL1|P|2.5\rOBX|1|ST|A||Alpha^one~Beta^two\rOBX|2|ST|B||Gamma^three~Delta^four",
                      r#"
          [[rules]]
          path = "OBX.5.1"
          action = "drop"
          reason = "Remove every first component"
          "#,
                  )?;
                  let action = output
                      .receipt
                      .actions
                      .iter()
                      .find(|action| action.path == "OBX.5.1")
                      .ok_or_else(|| io::Error::other("missing OBX.5.1 receipt"))?;

                  require(action.matched_count == 2, "receipt must count two segments")?;
                  require(
                      action.status == RedactionActionStatus::Applied,
                      "receipt must report applied",
                  )?;
                  require(
                      output.redacted_hl7.contains("OBX|1|ST|A||^one~^two\r"),
                      "first segment repetitions were not dropped",
                  )?;
                  require(
                      output.redacted_hl7.contains("OBX|2|ST|B||^three~^four\r"),
                      "second segment repetitions were not dropped",
                  )
              }

              #[test]
              fn component_rule_does_not_claim_whole_sensitive_field_coverage() -> TestResult {
                  let result = redact_hl7_safe_analysis(
                      "MSH|^~\\&|SEND|FAC|RECV|FAC|202605090101||ADT^A01|CTRL1|P|2.5\rPID|1||||Alpha^one~Beta^two",
                      r#"
          [[rules]]
          path = "PID.5.1"
          action = "drop"
          reason = "A component rule is not whole-field protection"
          "#,
                  );

                  match result {
                      Err(RedactionError::Policy(reason))
                          if reason.contains(
                              "does not protect present sensitive field(s): PID.5",
                          ) => Ok(()),
                      _ => Err(io::Error::other(
                          "component rule must not satisfy whole-field safe-analysis coverage",
                      )
                      .into()),
                  }
              }
          }
          ''')
          if "omitted_repetition_selects_components_in_every_repetition" in text:
              raise SystemExit("library repetition tests already exist")
          library.write_text(text.rstrip() + tests + "\n", encoding="utf-8")

          server = Path("crates/hl7v2-server/src/redaction.rs")
          text = server.read_text(encoding="utf-8")
          old = dedent('''
          fn apply_redaction_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              action: RedactionAction,
              delims: &hl7v2::Delims,
          ) -> bool {
              let Some(target) = select_target(field, path) else {
                  return false;
              };

              match action {
                  RedactionAction::Hash => target.hash(delims),
                  RedactionAction::Drop => target.replace_with_text(String::new()),
                  RedactionAction::Retain => {}
              }

              true
          }
          ''')
          new = dedent('''
          fn apply_redaction_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              action: RedactionAction,
              delims: &hl7v2::Delims,
          ) -> bool {
              for_each_target(field, path, |target| match action {
                  RedactionAction::Hash => target.hash(delims),
                  RedactionAction::Drop => target.replace_with_text(String::new()),
                  RedactionAction::Retain => {}
              })
          }
          ''')
          if text.count(old) != 1:
              raise SystemExit("expected server redaction entry point")
          text = text.replace(old, new, 1)

          old = dedent('''
          fn select_target<'a>(
              field: &'a mut Field,
              path: &ParsedRedactionPath,
          ) -> Option<RedactionTarget<'a>> {
              if path.field_repetition.is_none() && path.component.is_none() {
                  return Some(RedactionTarget::Field(field));
              }

              let rep_index = path.field_repetition.unwrap_or(1).checked_sub(1)?;
              let rep = field.reps.get_mut(rep_index)?;
              let Some(component) = path.component else {
                  return Some(RedactionTarget::Rep(rep));
              };

              let component_index = component.checked_sub(1)?;
              let comp = rep.comps.get_mut(component_index)?;
              let Some(subcomponent) = path.subcomponent else {
                  return Some(RedactionTarget::Comp(comp));
              };

              let subcomponent_index = subcomponent.checked_sub(1)?;
              comp.subs
                  .get_mut(subcomponent_index)
                  .map(RedactionTarget::Atom)
          }
          ''')
          new = dedent('''
          fn for_each_target(
              field: &mut Field,
              path: &ParsedRedactionPath,
              mut visit: impl FnMut(RedactionTarget<'_>),
          ) -> bool {
              if path.field_repetition.is_none() && path.component.is_none() {
                  visit(RedactionTarget::Field(field));
                  return true;
              }

              if let Some(repetition) = path.field_repetition {
                  let Some(index) = repetition.checked_sub(1) else {
                      return false;
                  };
                  let Some(rep) = field.reps.get_mut(index) else {
                      return false;
                  };
                  let Some(target) = select_rep_target(rep, path) else {
                      return false;
                  };
                  visit(target);
                  return true;
              }

              let mut matched = false;
              for rep in &mut field.reps {
                  if let Some(target) = select_rep_target(rep, path) {
                      visit(target);
                      matched = true;
                  }
              }
              matched
          }

          fn select_rep_target<'a>(
              rep: &'a mut Rep,
              path: &ParsedRedactionPath,
          ) -> Option<RedactionTarget<'a>> {
              let Some(component) = path.component else {
                  return Some(RedactionTarget::Rep(rep));
              };

              let component_index = component.checked_sub(1)?;
              let comp = rep.comps.get_mut(component_index)?;
              let Some(subcomponent) = path.subcomponent else {
                  return Some(RedactionTarget::Comp(comp));
              };

              let subcomponent_index = subcomponent.checked_sub(1)?;
              comp.subs
                  .get_mut(subcomponent_index)
                  .map(RedactionTarget::Atom)
          }
          ''')
          if text.count(old) != 1:
              raise SystemExit("expected server select_target")
          text = text.replace(old, new, 1)

          tests = dedent(r'''

          #[cfg(test)]
          mod tests {
              use super::redact_message;
              use std::io;

              type TestResult = Result<(), Box<dyn std::error::Error>>;

              fn require(condition: bool, message: &'static str) -> TestResult {
                  if condition {
                      Ok(())
                  } else {
                      Err(io::Error::other(message).into())
                  }
              }

              #[test]
              fn server_redaction_covers_every_field_repetition() -> TestResult {
                  let mut message = hl7v2::parse(
                      b"MSH|^~\\&|SEND|FAC|RECV|FAC|202605090101||ORU^R01|CTRL1|P|2.5\rOBX|1|ST|A||Alpha^one~Beta^two",
                  )?;
                  let receipt = redact_message(
                      &mut message,
                      r#"
          [[rules]]
          path = "OBX.5.1"
          action = "drop"
          reason = "Remove every first component"
          "#,
                  )
                  .map_err(io::Error::other)?;
                  let written = String::from_utf8(hl7v2::write(&message))?;
                  let action = receipt
                      .actions
                      .first()
                      .ok_or_else(|| io::Error::other("missing server redaction receipt"))?;

                  require(
                      written.contains("OBX|1|ST|A||^one~^two"),
                      "server left a later field repetition unredacted",
                  )?;
                  require(
                      action.matched_count == 1,
                      "server receipt must count the containing segment once",
                  )
              }
          }
          ''')
          if "server_redaction_covers_every_field_repetition" in text:
              raise SystemExit("server repetition test already exists")
          server.write_text(text.rstrip() + tests + "\n", encoding="utf-8")

          types = Path("crates/hl7v2/src/redact/types.rs")
          text = types.read_text(encoding="utf-8")
          text = text.replace(
              "    /// List of field paths to redact, for example `PID.5` or `PID.7`.\n    pub fields: Vec<String>,",
              "    /// List of field paths to redact, for example `PID.5` or `PID.7`.\n    ///\n    /// Component and subcomponent paths without a field repetition selector\n    /// apply to every repetition. Use `PID.13[2].1` to select only the first\n    /// component of the second repetition.\n    pub fields: Vec<String>,",
              1,
          )
          text = text.replace(
              "/// One rule in a safe-analysis redaction policy.\n#[derive(Debug, Clone, Deserialize)]",
              "/// One rule in a safe-analysis redaction policy.\n///\n/// Component and subcomponent paths without a field repetition selector apply\n/// to every repetition. An explicit selector, such as `OBX.5[2].1`, limits the\n/// rule to that repetition.\n#[derive(Debug, Clone, Deserialize)]",
              1,
          )
          if text.count("/// Number of matching values affected by this action.") != 1:
              raise SystemExit("expected library matched_count documentation")
          text = text.replace(
              "    /// Number of matching values affected by this action.",
              "    /// Number of matching segments containing a selected target.\n    ///\n    /// Several field repetitions selected within one segment count once.",
              1,
          )
          types.write_text(text, encoding="utf-8")

          server_models = Path("crates/hl7v2-server/src/models/evidence.rs")
          text = server_models.read_text(encoding="utf-8")
          if text.count("/// Number of matching values affected by this action.") != 1:
              raise SystemExit("expected server matched_count documentation")
          server_models.write_text(
              text.replace(
                  "    /// Number of matching values affected by this action.",
                  "    /// Number of matching segments containing a selected target.\n    ///\n    /// Several field repetitions selected within one segment count once.",
                  1,
              ),
              encoding="utf-8",
          )

          for proto in [
              Path("api/proto/hl7v2/v1/hl7v2.proto"),
              Path("crates/hl7v2-server/proto/hl7v2/v1/hl7v2.proto"),
          ]:
              text = proto.read_text(encoding="utf-8")
              old = "  // Number of matching values affected by this action"
              if text.count(old) != 1:
                  raise SystemExit(f"expected matched_count comment in {proto}")
              proto.write_text(
                  text.replace(
                      old,
                      "  // Number of matching segments containing a selected target; several\n  // selected field repetitions in one segment count once",
                      1,
                  ),
                  encoding="utf-8",
              )

          for schema in [
              Path("schemas/evidence/redaction-receipt-v1.schema.json"),
              Path("schemas/evidence/redaction-receipt-v2.schema.json"),
          ]:
              text = schema.read_text(encoding="utf-8")
              old = '"description": "Number of matching values affected by the action."'
              if text.count(old) != 1:
                  raise SystemExit(f"expected matched_count description in {schema}")
              schema.write_text(
                  text.replace(
                      old,
                      '"description": "Number of matching segments containing a selected target; several selected field repetitions in one segment count once."',
                      1,
                  ),
                  encoding="utf-8",
              )
          PY

          cargo fmt --all
          rm .github/workflows/reconcile-redaction-repetitions.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/redact/target.rs crates/hl7v2/src/redact/types.rs crates/hl7v2-server/src/redaction.rs crates/hl7v2-server/src/models/evidence.rs api/proto/hl7v2/v1/hl7v2.proto crates/hl7v2-server/proto/hl7v2/v1/hl7v2.proto schemas/evidence/redaction-receipt-v1.schema.json schemas/evidence/redaction-receipt-v2.schema.json .github/workflows/reconcile-redaction-repetitions.yml
          git diff --cached --check
          git commit -m "fix(redaction): cover omitted field repetitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
