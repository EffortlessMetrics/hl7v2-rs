name: Reconcile rule operator parity

on:
  push:
    branches:
      - codex/977-rule-operator-parity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source-first operator parity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          validation = Path("crates/hl7v2/src/conformance/validation.rs")
          text = validation.read_text(encoding="utf-8")
          old = '''        // existence
                  "exists" => !lhs_values.is_empty(),
                  "not_exists" => lhs_values.is_empty(),
          '''
          new = '''        // numeric comparisons: true if any left-hand value satisfies the
                  // relation against the right-hand value. Non-numeric operands compare
                  // false rather than failing open.
                  "gt" | "lt" | "ge" | "le" => match rhs_first {
                      Some(rhs) => lhs_values.iter().any(|lhs| {
                          validate_mathematical_relationship(lhs, rhs, condition.operator.as_str())
                      }),
                      None => false,
                  },

                  // existence
                  "exists" => !lhs_values.is_empty(),
                  "not_exists" | "missing" => lhs_values.is_empty(),
          '''
          old = dedent(old)
          new = dedent(new)
          if text.count(old) != 1:
              raise SystemExit("expected one rule-condition existence block")
          validation.write_text(text.replace(old, new, 1), encoding="utf-8")

          lint = Path("crates/hl7v2/src/conformance/profile/lint.rs")
          text = lint.read_text(encoding="utf-8")
          old = '''        "eq" | "ne" | "contains" | "in" | "exists" | "not_exists" | "is_date" | "before"
                  | "within_range" => {}
          '''
          new = '''        "eq" | "ne" | "gt" | "lt" | "ge" | "le" | "contains" | "in" | "exists"
                  | "not_exists" | "missing" | "is_date" | "before" | "within_range" => {}
          '''
          old = dedent(old)
          new = dedent(new)
          if text.count(old) != 1:
              raise SystemExit("expected one rule-condition lint allowlist")
          lint.write_text(text.replace(old, new, 1), encoding="utf-8")

          unit_tests = Path("crates/hl7v2/src/conformance/validation/tests/unit_tests.rs")
          text = unit_tests.read_text(encoding="utf-8")
          marker = '''#[test]
          fn test_check_rule_condition_contains() {'''
          marker = dedent(marker)
          tests = dedent('''
          #[test]
          fn test_check_rule_condition_numeric_comparisons() {
              let msg = parse_test_message(
                  "MSH|^~\\\\&|App|Fac|Recv|Fac|20230101||ORU^R01|1|P|2.5\\rOBX|1|NM|GLU^Glucose||10|mg/dL\\r",
              );

              let cond = |operator: &str, value: &str| RuleCondition {
                  field: "OBX.5".to_string(),
                  operator: operator.to_string(),
                  value: Some(value.to_string()),
                  values: None,
              };

              assert!(check_rule_condition(&msg, &cond("gt", "5")));
              assert!(!check_rule_condition(&msg, &cond("gt", "10")));
              assert!(check_rule_condition(&msg, &cond("ge", "10")));
              assert!(!check_rule_condition(&msg, &cond("ge", "11")));
              assert!(check_rule_condition(&msg, &cond("lt", "20")));
              assert!(!check_rule_condition(&msg, &cond("lt", "10")));
              assert!(check_rule_condition(&msg, &cond("le", "10")));
              assert!(!check_rule_condition(&msg, &cond("le", "9")));
              assert!(!check_rule_condition(&msg, &cond("gt", "abc")));
          }

          #[test]
          fn test_check_rule_condition_missing_is_alias_for_not_exists() {
              let msg = parse_test_message(
                  "MSH|^~\\\\&|App|Fac|Recv|Fac|20230101||ADT^A01|1|P|2.5\\rPID|1||12345^^^MRN||Doe^John\\r",
              );

              let missing = RuleCondition {
                  field: "PID.99".to_string(),
                  operator: "missing".to_string(),
                  value: None,
                  values: None,
              };
              assert!(check_rule_condition(&msg, &missing));

              let present = RuleCondition {
                  field: "PID.3.1".to_string(),
                  operator: "missing".to_string(),
                  value: None,
                  values: None,
              };
              assert!(!check_rule_condition(&msg, &present));
          }

          ''')
          if text.count(marker) != 1:
              raise SystemExit("expected one unit-test insertion point")
          unit_tests.write_text(text.replace(marker, tests + marker, 1), encoding="utf-8")

          profile_tests = Path("crates/hl7v2/src/conformance/profile/tests.rs")
          text = profile_tests.read_text(encoding="utf-8")
          marker = '''    #[test]
              fn test_lint_profile_yaml_sanitizes_yaml_error_messages() {'''
          marker = dedent(marker)
          test = indent(dedent('''
          #[test]
          fn test_lint_profile_yaml_accepts_numeric_and_missing_operators() {
              let y = r#"
          message_structure: "xfield_operators"
          version: "2.5.1"
          segments:
            - id: "OBX"
          cross_field_rules:
            - id: "gt-rule"
              description: ""
              conditions:
                - field: "OBX.5"
                  operator: "gt"
                  value: "5"
              actions: []
            - id: "lt-rule"
              description: ""
              conditions:
                - field: "OBX.5"
                  operator: "lt"
                  value: "50"
              actions: []
            - id: "ge-rule"
              description: ""
              conditions:
                - field: "OBX.5"
                  operator: "ge"
                  value: "5"
              actions: []
            - id: "le-rule"
              description: ""
              conditions:
                - field: "OBX.5"
                  operator: "le"
                  value: "50"
              actions: []
            - id: "missing-rule"
              description: ""
              conditions:
                - field: "OBX.99"
                  operator: "missing"
              actions: []
          "#;

              let report = lint_profile_yaml(y);

              assert!(
                  !report
                      .issues
                      .iter()
                      .any(|issue| issue.code == "unknown_rule_condition_operator"),
                  "numeric/missing operators must be recognized by the linter: {report:?}"
              );
          }

          '''), "    ")
          if text.count(marker) != 1:
              raise SystemExit("expected one profile-lint test insertion point")
          profile_tests.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")
          PY

          cargo fmt --all
          rm .github/workflows/reconcile-rule-operators.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/conformance/validation.rs crates/hl7v2/src/conformance/profile/lint.rs crates/hl7v2/src/conformance/validation/tests/unit_tests.rs crates/hl7v2/src/conformance/profile/tests.rs .github/workflows/reconcile-rule-operators.yml
          git diff --cached --check
          git commit -m "fix(conformance): align cross-field operator runtime and lint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
