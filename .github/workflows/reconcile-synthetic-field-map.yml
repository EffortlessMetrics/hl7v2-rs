name: Reconcile synthetic field mapping

on:
  push:
    branches:
      - codex/977-synthetic-field-map

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply source-first synthetic mapping fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("crates/hl7v2/src/synthetic/template.rs")
          text = path.read_text(encoding="utf-8")
          old = (
              "    } else {\n"
              "        // For other segments, process all fields\n"
              "        for (offset, field_template) in field_templates.iter().enumerate() {\n"
              "            let field_number = offset\n"
              "                .checked_add(2)\n"
          )
          new = (
              "    } else {\n"
              "        // For other segments, process all fields. `field_templates` holds the\n"
              "        // fields after the segment ID, so offset 0 is field 1 (for example,\n"
              "        // PID-1). MSH is different because MSH-1 is the field separator and\n"
              "        // MSH-2 is emitted separately above.\n"
              "        for (offset, field_template) in field_templates.iter().enumerate() {\n"
              "            let field_number = offset\n"
              "                .checked_add(1)\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected one non-MSH field-number block")
          text = text.replace(old, new, 1)

          if "fn value_source_maps_to_named_non_msh_field" in text:
              raise SystemExit("regression test already exists")
          tests = dedent(r'''

          #[cfg(test)]
          mod tests {
              use super::{Template, ValueSource, generate};
              use std::collections::HashMap;

              #[test]
              fn value_source_maps_to_named_non_msh_field()
              -> Result<(), Box<dyn std::error::Error>> {
                  let mut values: HashMap<String, Vec<ValueSource>> = HashMap::new();
                  values.insert(
                      "PID.3".to_string(),
                      vec![ValueSource::Fixed("MRNVAL".to_string())],
                  );
                  let template = Template {
                      name: "regression".to_string(),
                      delims: "^~\\&".to_string(),
                      segments: vec![
                          "MSH|^~\\&|APP".to_string(),
                          "PID|1||ORIGMRN||Doe^John".to_string(),
                      ],
                      values,
                  };

                  let messages = generate(&template, 42, 1)?;
                  let msg = messages
                      .first()
                      .ok_or_else(|| std::io::Error::other("expected one generated message"))?;

                  assert_eq!(crate::get(msg, "PID.3"), Some("MRNVAL"));
                  assert_ne!(crate::get(msg, "PID.2"), Some("MRNVAL"));
                  Ok(())
              }
          }
          ''')
          path.write_text(text.rstrip() + tests + "\n", encoding="utf-8")
          PY

          cargo fmt --all
          rm .github/workflows/reconcile-synthetic-field-map.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/synthetic/template.rs .github/workflows/reconcile-synthetic-field-map.yml
          git diff --cached --check
          git commit -m "fix(synthetic): map value sources to named non-MSH fields"
          git push origin "HEAD:${GITHUB_REF_NAME}"
