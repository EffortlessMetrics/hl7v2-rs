name: Reconcile synthetic test style

on:
  push:
    branches:
      - codex/977-synthetic-field-map

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace assertions with returned errors
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("crates/hl7v2/src/synthetic/template.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        assert_eq!(crate::get(msg, "PID.3"), Some("MRNVAL"));
                  assert_ne!(crate::get(msg, "PID.2"), Some("MRNVAL"));
                  Ok(())
          '''
          new = '''        if crate::get(msg, "PID.3") != Some("MRNVAL") {
                      return Err(std::io::Error::other(
                          "PID.3 did not receive the configured value-source override",
                      )
                      .into());
                  }
                  if crate::get(msg, "PID.2") == Some("MRNVAL") {
                      return Err(std::io::Error::other(
                          "value-source override was shifted into PID.2",
                      )
                      .into());
                  }
                  Ok(())
          '''
          if text.count(old) != 1:
              raise SystemExit("expected one synthetic regression assertion block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cargo fmt --all
          rm .github/workflows/reconcile-synthetic-test-style.yml
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/hl7v2/src/synthetic/template.rs .github/workflows/reconcile-synthetic-test-style.yml
          git diff --cached --check
          git commit -m "test(synthetic): return mapping failures instead of asserting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
