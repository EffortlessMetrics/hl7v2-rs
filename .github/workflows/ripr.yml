name: ripr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ripr.toml"
      - "policy/ripr-suppressions.toml"
      - "badges/**"
      - "docs/VERIFICATION.md"
      - ".github/workflows/ripr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  ripr:
    name: ripr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install ripr
        run: cargo install ripr --version 0.5.0 --locked

      - name: Run advisory ripr evidence
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          BASE_REF="${BASE_REF:-main}"
          mkdir -p target/ripr target/ripr/pr target/ripr/review target/xtask/badges target/xtask/impacted-evidence
          git fetch origin "$BASE_REF" --depth=50

          cargo run -p xtask -- badges --check
          cargo run -p xtask -- ripr-pr --base "origin/$BASE_REF" --head HEAD
          cargo run -p xtask -- ripr-pr --base "origin/$BASE_REF" --head HEAD --check
          cargo run -p xtask -- ripr-review-comments --base "origin/$BASE_REF" --head HEAD
          cargo run -p xtask -- ripr-review-comments --base "origin/$BASE_REF" --head HEAD --check
          cargo run -p xtask -- ripr-pr-summary
          cargo run -p xtask -- ripr-pr-summary --check
          cargo run -p xtask -- ripr-annotations
          cargo run -p xtask -- ripr-annotations --check
          cargo run -p xtask -- impacted-evidence
          cargo run -p xtask -- impacted-evidence --check

          cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s target/ripr/review/comments.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat target/ripr/review/comments.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s target/xtask/impacted-evidence/latest.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat target/xtask/impacted-evidence/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s target/ripr/review/annotations.txt ]; then
            cat target/ripr/review/annotations.txt
          fi

      - name: Upload ripr artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripr-pr-evidence
          path: |
            target/ripr/pr/**
            target/ripr/review/**
            target/xtask/badges/**
            target/xtask/impacted-evidence/**
          if-no-files-found: warn
          retention-days: 14
