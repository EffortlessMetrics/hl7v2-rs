# One-shot branch repair; this workflow deletes itself after a successful promotion.
name: Security advisory promotion

on:
  push:
    branches:
      - codex/978-security-advisories

permissions:
  contents: read

jobs:
  promote:
    if: "${{ github.event.head_commit.message == 'chore: run security advisory promotion' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Resolve the three current dependency findings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/hl7v2/Cargo.toml")
          text = path.read_text()
          old = 'lru = { version = "0.16", optional = true }'
          new = 'lru = { version = "0.18.2", optional = true }'
          if text.count(old) != 1:
              raise SystemExit(f"expected one lru requirement, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo update -p lru@0.16.4 --precise 0.18.2
          cargo update -p h2@0.4.15 --precise 0.4.16
          cargo update -p chacha20@0.10.1 --precise 0.10.0
          cargo fmt --all
          cargo tree -i lru@0.18.2
          cargo tree -i h2@0.4.16
          cargo tree -i chacha20@0.10.0
      - name: Install security tools
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.18.9 --locked
      - name: Prove the resolved graph independently
        run: |
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings
          cargo deny check
      - name: Verify the workspace on the resolved graph
        run: |
          cargo check --workspace --all-targets --all-features
          cargo test --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check
      - name: Commit source-only promotion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/security-advisory-promotion.yml
          git add crates/hl7v2/Cargo.toml Cargo.lock
          git commit -m "fix(security): resolve current dependency findings"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
