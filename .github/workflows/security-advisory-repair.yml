# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security advisory repair

on:
  push:
    branches:
      - fix/security-advisory-baseline

permissions:
  contents: read

concurrency:
  group: security-advisory-repair
  cancel-in-progress: false

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: run security advisory repair' }}"
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Resolve current advisories without widening unrelated dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/hl7v2/Cargo.toml")
          text = path.read_text()
          old = 'lru = { version = "0.16", optional = true }'
          new = 'lru = { version = "0.18.2", optional = true }'
          if text.count(old) != 1:
              raise SystemExit(f"expected one lru requirement, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo update -p lru
          cargo update -p h2
          cargo update -p rand
          cargo update -p rand_chacha
          cargo update -p chacha20
          cargo fmt --all

      - name: Install security tools
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.18.9 --locked

      - name: Prove the resolved graph
        run: |
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings
          cargo deny check
          cargo check --workspace --all-targets --all-features
          cargo test --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check

      - name: Commit source-only repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/security-advisory-repair.yml
          git add crates/hl7v2/Cargo.toml Cargo.lock
          git commit -m "fix(security): resolve current dependency advisories"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
