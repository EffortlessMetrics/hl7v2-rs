name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

# Cancellation policy:
# - PR synchronize events cancel stale runs for the same PR.
# - Push and scheduled scans do NOT cancel in-progress security checks.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Run Audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings

      - name: Generate Audit Report
        if: failure()
        run: cargo audit --json > audit-report.json

      - name: Upload Audit Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.json

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Keep the release tag for readability and the digest for reproducibility.
      # Refresh both values together when updating Semgrep.
      image: returntocorp/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep --config auto --sarif > semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  clippy-security:
    name: Clippy Security Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run Clippy with Security Lints
        run: |
          cargo clippy --all-targets --all-features -- \
            -W clippy::cast_ptr_alignment \
            -W clippy::explicit_deref_methods \
            -W clippy::mem_forget \
            -W clippy::missing_safety_doc \
            -W clippy::undocumented_unsafe_blocks \
            -D warnings

  # Disable dependency-review as it's not supported in this repo
  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   steps:
  #     - uses: actions/checkout@v6
  #     - name: Dependency Review
  #       uses: actions/dependency-review-action@v4

  license-check:
    name: License Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Check for stale license references
        run: |
          if rg -n "(\bMIT\b|MIT OR Apache|Apache-2\.0|SPDX-License-Identifier:\s*(MIT|Apache-2\.0))" \
            --glob '!deny.toml' \
            --glob '!Cargo.lock' \
            --glob '!THIRD_PARTY_NOTICES.md' \
            --glob '!target/**' \
            --glob '!.github/workflows/security.yml' \
            --glob '!docs/governance/**' \
            --glob '!GEMINI.md' \
            --glob '!metadata.json' \
            .; then
            echo "::error::Found MIT/Apache license references in project files"
            exit 1
          fi

  secrets-scanning:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.93.8
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      - name: TruffleHog OSS (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.93.8
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: TruffleHog OSS (initial push)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.93.8
        with:
          path: ./
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

  trivy-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
