id = "hl7v2-installable-workbench"
title = "Installable HL7v2 workbench across public package surfaces"
status = "active"
owner = "codex"
created = "2026-09-04"
issue = "https://github.com/EffortlessMetrics/hl7v2-rs/issues/967"

objective = """
Make install -> inspect -> validate -> normalize -> redact -> diff -> bundle ->
replay work from the installed public package surfaces, with fixture-backed
cross-surface evidence and explicit support boundaries. hl7v2-rs remains the
canonical product, public-support, release, registry, and final-acceptance
repository until swarm cutover is proven or the authority policy is explicitly
changed. Begin with semantic source/swarm reconciliation, not a history merge.
"""

must_not_touch = [
  "Do not treat swarm #5 as a blocker to source-first workbench work or claim cutover from hosted fallback.",
  "Do not overwrite the swarm active.toml variant: swarm #158 must retain its live cutover item and exact non-claims.",
  "Do not expand the ten-path source-sync boundary or leave accepted shared product changes only in swarm.",
  "Do not replay rescue branches, merge whole histories, or reuse future-dated receipts as proof.",
  "Do not change routing or branch protection as part of this product goal.",
  "Do not treat source-checkout, local-wheel, or crates.io binding-backend proof as public Python/npm install-back proof.",
  "Do not make hl7v2-python the recommended Rust API.",
  "Do not publish without the dedicated guarded workflows and explicit registry authorization; no token fallback or skip-existing.",
  "Do not claim registry success before upload and clean install-back pass for the exact candidate.",
  "Do not weaken lint, no-panic, PHI, evidence, or file-policy gates to clear the queue.",
  "Do not make ripr blocking before calibration or substitute it for targeted runtime mutation.",
  "Do not add broad ordinary-PR mutation, unrelated GUI/cloud/scripting work, or another orchestration framework.",
]

end_state = [
  "Accepted shared behavior is canonicalized in source with regression witnesses and exact-SHA verification.",
  "Source and swarm differ only in the ten intentional infrastructure paths after the required synchronization checkpoints.",
  "Python TestPyPI proof and production PyPI publish-or-park decisions have explicit upload/install-back or blocked-state receipts.",
  "TypeScript/WASM work and npm publish-or-park decisions are source-first, with truthful installed-package claims.",
  "Installed-surface acceptance covers inspect, validate, normalize, redact, diff, bundle, and replay without substituting checkout-only tests.",
  "Support tiers, evidence parity, and final mirror state agree with the earned proof; unavailable surfaces remain explicitly unavailable.",
  "Historical v1.5/Rust-1.95 release receipts remain intact; their completion is not a new release or swarm cutover claim.",
]

canonical_sources = [
  "docs/STATUS.md",
  "docs/status/SUPPORT_TIERS.md",
  "docs/specs/HL7V2-SPEC-0001-source-of-truth-stack.md",
  "docs/specs/HL7V2-SPEC-0004-binding-backend-release-proof.md",
  "docs/specs/HL7V2-SPEC-0005-npm-wasm-binding-package-model.md",
  "docs/specs/HL7V2-SPEC-0006-cross-surface-evidence-parity.md",
  "policy/evidence-parity.toml",
  "docs/audits/v1.5.0-goal-transition-2026-09-04.md",
]

proof_commands = [
  "python -c \"import pathlib,tomllib; tomllib.loads(pathlib.Path('.hl7v2/goals/active.toml').read_text(encoding='utf-8'))\"",
  "cargo +1.95.0 run -p xtask -- check-doc-links",
  "cargo +1.95.0 run -p xtask -- check-spec-policy-links",
  "cargo +1.95.0 run -p xtask -- check-file-policy",
  "cargo +1.95.0 run -p xtask -- check-evidence-parity",
  "cargo +1.95.0 run -p xtask -- badges --check",
  "cargo +1.95.0 run -p xtask -- publish-plan",
  "cargo +1.95.0 run -p xtask -- gate --check --changed",
  "git diff --check",
]

