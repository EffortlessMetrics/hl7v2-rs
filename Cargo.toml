[workspace]
members = [
    # Top-level name-claim crate
    "crates/hl7v2",
    # Microcrates (SRP-focused)
    "crates/hl7v2-model",
    "crates/hl7v2-escape",
    "crates/hl7v2-mllp",
    "crates/hl7v2-query",
    "crates/hl7v2-json",
    "crates/hl7v2-parser",
    "crates/hl7v2-writer",
    "crates/hl7v2-normalize",
    "crates/hl7v2-network",
    "crates/hl7v2-batch",
    "crates/hl7v2-stream",
    "crates/hl7v2-validation",
    "crates/hl7v2-datatype",
    "crates/hl7v2-datetime",
    "crates/hl7v2-path",
    "crates/hl7v2-faker",
    "crates/hl7v2-corpus",
    # Higher-level crates
    "crates/hl7v2-core",
    "crates/hl7v2-bench",
    "crates/hl7v2-prof",
    "crates/hl7v2-redact",
    "crates/hl7v2-lifecycle",
    "crates/hl7v2-guard",
    "crates/hl7v2-python",
    "crates/hl7v2-template",
    "crates/hl7v2-template-values",
    "crates/hl7v2-gen",
    "crates/hl7v2-ack",
    "crates/hl7v2-cli",
    "crates/hl7v2-server",
    "crates/hl7v2-e2e-tests",
    # Testing utilities
    "crates/hl7v2-test-utils",
    # Tools
    "xtask",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.93"

authors = ["EffortlessMetrics <team@effortlessmetrics.com>"]
homepage = "https://github.com/EffortlessMetrics/hl7v2-rs"
repository = "https://github.com/EffortlessMetrics/hl7v2-rs"
license = "AGPL-3.0-or-later"
keywords = ["hl7", "healthcare", "parser", "validator"]
categories = ["parser-implementations", "encoding"]
description = "High-performance HL7 v2 Processing Toolkit for Rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
tower_governor = "0.8.0"
tower = "0.5"
tower-http = "0.6"
axum = "0.8"
regex = "1.10"
uuid = "1.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
anyhow = "1.0"
cargo_metadata = "0.19.1"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3.32"
bytes = "1.11.1"
tokio-util = "0.7.18"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
uselesskey = "0.4.0"
tonic = "0.12.3"
prost = "0.13.5"
tonic-build = "0.12.3"
protoc-bin-vendored = "3"
hl7v2-core = { version = "1.2.0", path = "crates/hl7v2-core" }
hl7v2-model = { version = "1.2.0", path = "crates/hl7v2-model" }
hl7v2-test-utils = { version = "1.2.0", path = "crates/hl7v2-test-utils" }

# Example dependencies (workspace examples)
[package]
name = "hl7v2-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false


[lints]
workspace = true
[dependencies]
hl7v2-core = { workspace = true }
hl7v2-ack = { version = "1.2.0", path = "crates/hl7v2-ack" }
hl7v2-batch = { version = "1.2.0", path = "crates/hl7v2-batch" }
hl7v2-prof = { version = "1.2.0", path = "crates/hl7v2-prof" }
hl7v2-template = { version = "1.2.0", path = "crates/hl7v2-template" }
hl7v2-stream = { version = "1.2.0", path = "crates/hl7v2-stream" }
hl7v2-network = { version = "1.2.0", path = "crates/hl7v2-network" }
tokio = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "parsing_basics"
path = "examples/parsing_basics.rs"

[[example]]
name = "message_building"
path = "examples/message_building.rs"

[[example]]
name = "validation_basics"
path = "examples/validation_basics.rs"

[[example]]
name = "mllp_client"
path = "examples/mllp_client.rs"

[[example]]
name = "batch_processing"
path = "examples/batch_processing.rs"

[[example]]
name = "streaming_parser"
path = "examples/streaming_parser.rs"

[[example]]
name = "template_generation"
path = "examples/template_generation.rs"

[[example]]
name = "ack_generation"
path = "examples/ack_generation.rs"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unexpected_cfgs = "warn"
const_item_interior_mutations = "deny"
function_casts_as_integer = "deny"

[workspace.lints.clippy]
# Panic-free production and tests
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unreachable = "deny"
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
out_of_bounds_indexing = "deny"
unchecked_time_subtraction = "deny"

# AST / parser / UTF-8 / slice safety
char_indices_as_byte_indices = "deny"
sliced_string_as_bytes = "deny"
index_refutable_slice = "deny"

# Silent failure
let_underscore_future = "deny"
let_underscore_must_use = "deny"
let_underscore_lock = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"
lines_filter_map_ok = "deny"

# Async / concurrency
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
future_not_send = "warn"
large_futures = "warn"
arc_with_non_send_sync = "deny"
rc_mutex = "deny"
mut_mutex_lock = "deny"
readonly_write_lock = "deny"

# Unsafe / memory
mem_forget = "deny"
forget_non_drop = "deny"
drop_non_drop = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
repr_packed_without_abi = "deny"

# Numeric correctness
float_cmp = "deny"
float_cmp_const = "deny"
float_equality_without_abs = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
invalid_upcast_comparisons = "deny"
cast_abs_to_unsigned = "deny"
cast_enum_truncation = "deny"
cast_nan_to_int = "deny"
manual_midpoint = "warn"
manual_is_multiple_of = "warn"
manual_div_ceil = "warn"
arithmetic_side_effects = "warn"

# File/process/path footguns
suspicious_open_options = "deny"
nonsensical_open_options = "deny"
ineffective_open_options = "deny"
path_buf_push_overwrite = "deny"
join_absolute_paths = "deny"
read_line_without_trim = "warn"
exit = "deny"

# API / trait correctness
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
fallible_impl_from = "deny"
error_impl_error = "deny"
result_unit_err = "warn"
result_large_err = "warn"

# Good taste that pays rent
format_in_format_args = "deny"
to_string_in_format_args = "deny"
unused_format_specs = "deny"
unnecessary_debug_formatting = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_strip = "warn"
manual_split_once = "warn"
manual_is_variant_and = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
match_result_ok = "deny"
cloned_instead_of_copied = "warn"
iter_cloned_collect = "warn"
iter_overeager_cloned = "warn"
needless_collect = "warn"
redundant_closure = "warn"
redundant_closure_for_method_calls = "warn"
missing_panics_doc = "deny"
missing_errors_doc = "warn"

# Suppression governance
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
