# Example HL7v2 Configuration File
# This file documents the expected configuration structure for both
# the CLI and server binaries.
#
# Usage:
#   hl7v2-cli --config ./config.toml [subcommand]
#   hl7v2-server --config ./config.toml

# ============================================================================
# Server Settings
# ============================================================================
[server]
# Host address to bind to
# - "0.0.0.0" listens on all interfaces (default)
# - "127.0.0.1" listens only on localhost (more secure)
# - "[::1]" for IPv6 localhost
host = "0.0.0.0"

# Port to listen on (default: 8080)
port = 8080

# Log level: trace, debug, info, warn, error (default: info)
log_level = "info"

# Maximum request body size in bytes (default: 10MB)
max_body_size = 10485760

# Request timeout in seconds (default: 30)
request_timeout = 30

# ============================================================================
# HL7 Message Settings
# ============================================================================
[hl7]
# HL7 version to use (default: "2.5.1")
version = "2.5.1"

# Strict parsing mode (default: true)
# When true, parser rejects non-standard messages
strict_parsing = true

# Default character encoding (default: "UTF-8")
default_encoding = "UTF-8"

# ACK generation mode: "original" or "enhanced" (default: "enhanced")
acknowledgment_mode = "enhanced"

# ============================================================================
# Security Settings
# ============================================================================
[security]
# API key for authentication (optional)
# If set, all requests must include this key
api_key = "your-secret-api-key-here"

# Enable TLS/HTTPS (default: false)
tls_enabled = false

# Path to TLS certificate (required if tls_enabled = true)
cert_path = "/etc/hl7v2/certs/server.crt"

# Path to TLS private key (required if tls_enabled = true)
key_path = "/etc/hl7v2/certs/server.key"

# Allowed CORS origins (optional)
cors_origins = [
    "http://localhost:3000",
    "https://example.com"
]

# Rate limit per minute per client (default: 100)
rate_limit = 100

# ============================================================================
# Logging Settings
# ============================================================================
[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log format: pretty, json, compact
format = "pretty"

# Log output: stdout, stderr, or file path
output = "stdout"

# Log file path (when output is "file")
# file_path = "/var/log/hl7v2/server.log"

# ============================================================================
# Performance Settings
# ============================================================================
[performance]
# Maximum concurrent connections
max_connections = 1000

# Worker thread count (0 = number of CPUs)
worker_threads = 0

# Connection keep-alive timeout in seconds
keep_alive_timeout = 60

# ============================================================================
# Feature Flags (for enabling experimental features)
# ============================================================================
[features]
# Enable gRPC server (experimental)
grpc_enabled = false

# Enable WebSocket support (experimental)
websockets_enabled = false

# Enable metrics endpoint
metrics_enabled = true
