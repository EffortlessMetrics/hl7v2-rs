# HL7v2-rs Configuration Example

[server]
host = "127.0.0.1"
port = 8080
# api_key = "secret-key"
# bundle_output_root = "bundles"
# max_message_size = 52428800 # 50 MiB application-level HL7 message limit

[ack]
mode = "original" # original|enhanced
accept_on = "valid"
reject_on = ["parse_error", "validation_error"]
include_error_text = true

[quarantine]
enabled = false
# path = "quarantine"
write_redacted = true
write_report = true
write_bundle = true

[cli]
default_version = "2.5.1"
output_format = "text"

[logging]
level = "info"
log_to_file = false
# log_path = "hl7v2.log"
