[package]
readme = "README.md"
name = "hl7v2-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Benchmarks for hl7v2 crates"
license.workspace = true
publish = false
repository.workspace = true
keywords = ["hl7", "healthcare", "benchmarking", "performance"]
categories = ["development-tools", "parsing"]

[dependencies]
# Library surface under benchmark
hl7v2 = { version = "1.5.0", path = "../hl7v2", features = [
    "profile",
    "ack",
    "normalize",
    "batch",
    "stream",
    "network",
    "synthetic",
] }

# Async runtime for network benchmarks
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
futures = "0.3.32"

# Serialization
serde_json = { workspace = true }

# Random number generation for template benchmarks
rand = "0.10.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }

# Benchmark definitions
[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "mllp"
harness = false

[[bench]]
name = "escape"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "json"
harness = false

[[bench]]
name = "network"
harness = false

[[bench]]
name = "template"
harness = false
