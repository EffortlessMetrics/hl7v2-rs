[package]
readme = "README.md"
name = "hl7v2-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Command-line interface for HL7 v2 message manipulation and validation."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml.workspace = true
sha2.workspace = true
hl7v2 = { version = "1.5.0", path = "../hl7v2", features = [
    "profile",
    "ack",
    "normalize",
    "batch",
    "stream",
    "network",
    "synthetic",
] }
hl7v2-server = { version = "1.5.0", path = "../hl7v2-server" }
sysinfo = "0.38.2"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml = "1.1.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.19"
hl7v2-test-utils = { path = "../hl7v2-test-utils" }
cucumber = { version = "0.22", default-features = false, features = ["macros"] }
futures = "0.3"
tonic = { workspace = true }

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "serve_grpc_contract_test"
path = "tests/serve_grpc_contract_test.rs"

[[test]]
name = "bdd_tests"
path = "tests/bdd_tests.rs"
harness = false

[lints]
workspace = true
