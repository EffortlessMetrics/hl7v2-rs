[package]
readme = "README.md"
name = "hl7v2-faker"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Realistic HL7 v2 test data generation (names, addresses, medical codes, etc.)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["hl7", "healthcare", "faker", "test-data", "mock"]
categories = ["development-tools::testing", "parser-implementations"]

[dependencies]
hl7v2 = { version = "1.2.0", path = "../hl7v2", default-features = false, features = [
    "synthetic",
] }

[dev-dependencies]
rand = "0.10.0"
proptest = "1.6"
cucumber = "0.22.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd_tests"
harness = false

