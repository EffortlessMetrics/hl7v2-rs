[package]
readme = "README.md"
name = "hl7v2-faker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Realistic HL7 v2 test data generation (names, addresses, medical codes, etc.)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["hl7", "healthcare", "faker", "test-data", "mock"]
categories = ["development-tools::testing", "parser-implementations"]


[lints]
workspace = true
[dependencies]
rand = "0.10.0"
rand_distr = "0.6.0"
chrono = { version = "0.4.44", features = ["serde", "std", "clock"], default-features = false }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
proptest = "1.6"
cucumber = "0.22.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd_tests"
harness = false

