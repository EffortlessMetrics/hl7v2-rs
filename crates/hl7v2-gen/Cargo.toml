[package]
readme = "README.md"
name = "hl7v2-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Code generation utilities for creating Rust models from HL7 v2 profiles."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
hl7v2 = { version = "1.2.0", path = "../hl7v2", default-features = false, features = [
    "synthetic",
] }

[dev-dependencies]
proptest = "1.6"
rand = "0.10.0"
cucumber = "0.22.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = "0.8"
hl7v2-query = { version = "1.2.0", path = "../hl7v2-query" }
hl7v2-normalize = { version = "1.2.0", path = "../hl7v2-normalize" }
hl7v2-parser = { version = "1.2.0", path = "../hl7v2-parser" }

[[test]]
name = "bdd_tests"
harness = false
