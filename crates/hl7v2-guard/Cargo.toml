[package]
name = "hl7v2-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ML-based anomaly detection and threat response for HL7 messages"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["hl7", "healthcare", "security", "anomaly-detection", "ml"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[dependencies]
hl7v2-model = { version = "1.2.0", path = "../hl7v2-model" }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
hl7v2-test-utils = { path = "../hl7v2-test-utils" }
hl7v2-parser = { path = "../hl7v2-parser" }

[features]
default = []
serde = ["dep:serde"]
tracing = ["dep:tracing"]
