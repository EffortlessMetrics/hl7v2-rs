[package]
readme = "README.md"
name = "hl7v2-mllp"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "MLLP (Minimal Lower Layer Protocol) framing for HL7 v2"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["hl7", "healthcare", "mllp", "protocol", "framing"]
categories = ["network-programming", "encoding"]

[dependencies]
hl7v2 = { version = "1.2.1", path = "../hl7v2", default-features = false }

[dev-dependencies]
hl7v2-test-utils = { path = "../hl7v2-test-utils" }
proptest = "1.6"
cucumber = "0.22.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd_tests"
harness = false

[features]
default = []
