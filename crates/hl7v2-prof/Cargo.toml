[package]
readme = "README.md"
name = "hl7v2-prof"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HL7 v2 message profile and conformance processing."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
hl7v2 = { version = "1.2.1", path = "../hl7v2", default-features = false, features = [
    "profile-core",
] }

[features]
default = ["persistent-cache"]
persistent-cache = ["hl7v2/persistent-cache"]

[dev-dependencies]
hl7v2-parser = { version = "1.2.1", path = "../hl7v2-parser" }
serde_yaml = { workspace = true }
tempfile = "3.26.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs"] }
wiremock = "0.6"
proptest = "1.6"
