[package]
readme = "README.md"
name = "hl7v2-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP/REST API server for HL7v2 message processing"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Local crates
hl7v2-core = { version = "1.2.0", path = "../hl7v2-core", features = ["network"] }
hl7v2-prof = { version = "1.2.0", path = "../hl7v2-prof" }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true, features = ["trace", "cors", "compression-gzip"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18.1", default-features = false, features = ["http-listener"] }
tower_governor = { workspace = true }
governor = "0.8"
serde_yaml = { workspace = true }

# Additional dependencies
http = "1.0"
hyper = "1.0"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipa = { version = "5.4", features = ["yaml"] }
subtle = "2.6.1"
tonic = "0.12.3"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1.18"
hl7v2-parser = { version = "1.2.0", path = "../hl7v2-parser" }
hl7v2-model.workspace = true
hl7v2-gen = { version = "1.2.0", path = "../hl7v2-gen" }
hl7v2-mllp = { version = "1.2.0", path = "../hl7v2-mllp" }
hl7v2-writer = { version = "1.2.0", path = "../hl7v2-writer" }
hl7v2-normalize = { version = "1.2.0", path = "../hl7v2-normalize" }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
cucumber = "0.22.1"
serde_json = { workspace = true }
hl7v2-test-utils = { path = "../hl7v2-test-utils" }

[[test]]
name = "bdd_tests"
harness = false

[[bin]]
name = "hl7v2-server"
path = "src/main.rs"

[build-dependencies]
tonic-build = "0.12.3"

