        ack_code:
          type: string
          enum: [AA, AE, AR, CA, CE, CR]
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    AckPolicyRequest:
      type: object
      required: [message, profile]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        profile:
          type: string
          description: Profile content (YAML) used to validate before choosing ACK or NAK
        mllp_framed:
          type: boolean
          default: false
          description: Whether the input message is MLLP framed
        mllp_frame:
          type: boolean
          default: false
          description: Whether to MLLP frame the ACK response

    AckPolicyResponse:
      type: object
      required: [ack_message, ack_code, decision, metadata]
      properties:
        ack_message:
          type: string
          description: Generated ACK or NAK message
        ack_code:
          type: string
          enum: [AA, AR, CA, CR]
        decision:
          $ref: '#/components/schemas/AckPolicyDecision'
        validation_report:
          allOf:
            - $ref: '#/components/schemas/ValidationReport'
          nullable: true
          description: Validation report used for the decision, absent when the message could not be parsed
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    AckPolicyDecision:
      type: object
      required: [mode, outcome, reason, ack_code, include_error_text]
      properties:
        mode:
          type: string
          enum: [original, enhanced]
        outcome:
          type: string
          enum: [accepted, rejected]
        reason:
          type: string
          enum: [valid, parse_error, validation_error]
        ack_code:
          type: string
          enum: [AA, AR, CA, CR]
        include_error_text:
          type: boolean
        error_text:
          type: string
          nullable: true
          description: Non-PHI error text included in ERR when configured

    NormalizeRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        mllp_framed:
          type: boolean
          default: false
          description: Whether the input message is MLLP framed
        options:
          $ref: '#/components/schemas/NormalizeOptions'

    NormalizeOptions:
      type: object
      properties:
        canonical_delimiters:
          type: boolean
          default: true
          description: Rewrite delimiters to canonical HL7 delimiters
        mllp_frame:
          type: boolean
          default: false
          description: Whether to MLLP frame the normalized response

    NormalizeResponse:
      type: object
      required: [normalized_message, metadata]
      properties:
        normalized_message:
          type: string
          description: Normalized HL7 message
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    ValidationError:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        location:
          type: string
          nullable: true
        severity:
          type: string
          enum: [error, warning, info]

    ValidationReportIssue:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: Stable snake_case issue code
        severity:
          type: string
          enum: [error, warning]
        path:
          type: string
          nullable: true
          description: HL7 path associated with the issue, such as PID.3
        rule_id:
          type: string
          nullable: true
          description: Stable rule identifier
        message:
          type: string
          description: Human-readable issue message
        segment_index:
          type: integer
          minimum: 0
          nullable: true
          description: Zero-based segment index when available
        field_index:
          type: integer
          minimum: 1
          nullable: true
          description: One-based HL7 field index when available

    ValidationWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        location:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error message. Raw HL7 payloads, raw profile YAML, and server-local roots are not echoed by design.
        safe_detail:
          type: string
          nullable: true
          description: PHI-safe operator detail describing what failed without echoing raw request payloads.
        location:
          type: string
          nullable: true
          description: Request field, artifact role, or evidence location when the server can identify one.
        suggested_next_action:
          type: string
          nullable: true
          description: Suggested next step for the caller or operator.
        details:
          type: object
          nullable: true
          description: Reserved structured details for future compatible error expansion.
