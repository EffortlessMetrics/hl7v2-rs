openapi: 3.1.0
info:
  title: HL7v2-rs HTTP API
  version: 1.3.0
  description: |
    RESTful API for HL7 v2 message parsing, validation, and processing.

    This API provides endpoints for:
    - Parsing HL7 v2 messages
    - Validating messages against conformance profiles
    - Generating ACK messages
    - Normalizing HL7 v2 messages

    ## Authentication

    HL7 processing endpoints under `/hl7/*` require API Key authentication via
    the `X-API-Key` header when the server is configured with an API key:
    ```
    X-API-Key: <your-api-key>
    ```

    Health, readiness, metrics, and API documentation endpoints are public by
    design so load balancers, scrapers, and local operators can inspect service
    state without application credentials.

    ## Rate Limiting

    - 120 requests per minute per IP
    - Exceeded limits return 429 Too Many Requests

    ## Tracing

    The system uses internal tracing spans. Correlation IDs may be added in future versions.
  contact:
    name: HL7v2-rs Team
    url: https://github.com/EffortlessMetrics/hl7v2-rs
    email: team@effortlessmetrics.com
  license:
    name: AGPL-3.0-or-later
    url: https://github.com/EffortlessMetrics/hl7v2-rs/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Health and readiness checks
  - name: hl7
    description: HL7 v2 message operations

paths:
  /health:
    get:
      summary: Health check
      description: Returns service status and uptime
      tags: [health]
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness check
      description: Returns startup readiness checks and typed evidence self-check status
      tags: [health]
      operationId: readinessCheck
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns metrics in Prometheus text format
      tags: [health]
      operationId: getMetrics
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

  /hl7/parse:
    post:
      summary: Parse HL7 message
      description: |
        Parse an HL7 v2 message and return metadata and optional JSON.
      tags: [hl7]
      operationId: parseMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Message parsed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          description: Invalid message format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /hl7/validate:
    post:
      summary: Validate HL7 message
      description: |
        Validate an HL7 message against a conformance profile.
      tags: [hl7]
      operationId: validateMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Validation complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '400':
          description: Invalid request or profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/validate-redacted:
    post:
      summary: Validate redacted HL7 message
      description: |
        Apply a safe-analysis redaction policy to an HL7 message, then validate the redacted message against a conformance profile. When server quarantine output is enabled, failed validation writes configured quarantine artifacts under the server-controlled quarantine root.
      tags: [hl7]
      operationId: validateRedactedMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRedactedRequest'
      responses:
        '200':
          description: Redaction and validation complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateRedactedResponse'
        '400':
          description: Invalid request, profile, message, or redaction policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '503':
          description: Server quarantine output is enabled but not configured or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hl7/bundle:
    post:
      summary: Create redacted evidence bundle
      description: |
        Apply safe-analysis redaction, validate the redacted message, and write a replayable evidence bundle under the server's configured bundle output root. The request supplies a bundle_id, not a filesystem path.
      tags: [hl7]
      operationId: createEvidenceBundle
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleRequest'
      responses:
        '201':
          description: Evidence bundle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundleSummary'
        '400':
          description: Invalid request, profile, message, redaction policy, or bundle id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Bundle id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Server bundle output root is not configured or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hl7/ack:
    post:
      summary: Generate HL7 ACK
      description: |
        Generate an HL7 v2 ACK message with an explicit caller-supplied ACK code.
      tags: [hl7]
      operationId: generateAck
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        '200':
          description: ACK generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid message format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /hl7/ack-policy:
    post:
      summary: Generate policy-driven HL7 ACK
      description: |
        Parse and validate an inbound HL7 v2 message, then choose an ACK or NAK code using the server's configured ACK policy.
      tags: [hl7]
      operationId: generatePolicyAck
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckPolicyRequest'
      responses:
        '200':
          description: Policy-driven ACK generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckPolicyResponse'
        '400':
          description: Invalid message or profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /hl7/normalize:
    post:
      summary: Normalize HL7 message
      description: |
        Parse and rewrite an HL7 v2 message with stable delimiters and optional MLLP output framing.
      tags: [hl7]
      operationId: normalizeMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizeRequest'
      responses:
        '200':
          description: Message normalized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResponse'
        '400':
          description: Invalid message format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication via header

  schemas:
    HealthResponse:
      type: object
      required: [status, version, uptime_seconds]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        uptime_seconds:
          type: integer

    ReadyResponse:
      type: object
      required: [ready, status, version, checks]
      properties:
        ready:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        version:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'

    ReadinessCheck:
      type: object
      required: [name, status, message]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, fail]
        message:
          type: string

    ParseRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        mllp_framed:
          type: boolean
          default: false
        options:
          $ref: '#/components/schemas/ParseOptions'

    ParseOptions:
      type: object
      properties:
        include_json:
          type: boolean
          default: true
        validate_structure:
          type: boolean
          default: true

    ParseResponse:
      type: object
      required: [metadata]
      properties:
        message:
          type: object
          description: Parsed message in JSON format
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        warnings:
          type: array
          items:
            type: string

    MessageMetadata:
      type: object
      required: [message_type, version, sending_application, sending_facility, message_control_id, segment_count, charsets]
      properties:
        message_type:
          type: string
        version:
          type: string
        sending_application:
          type: string
        sending_facility:
          type: string
        message_control_id:
          type: string
        segment_count:
          type: integer
        charsets:
          type: array
          items:
            type: string

    ValidateRequest:
      type: object
      required: [message, profile]
      properties:
        message:
          type: string
        profile:
          type: string
          description: Profile content (YAML)
        mllp_framed:
          type: boolean
          default: false
        report_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Optional validation report schema version. Version 2 adds validation_report_v2 with embedded evidence provenance while preserving the existing response fields.

    ValidateResponse:
      type: object
      required: [valid, message_type, segment_count, issue_count, issues, metadata]
      properties:
        valid:
          type: boolean
        message_type:
          type: string
          description: HL7 trigger event from MSH.9, such as ADT^A01
        profile:
          type: string
          nullable: true
          description: Profile identifier used for validation
        segment_count:
          type: integer
          minimum: 0
          description: Number of parsed message segments
        issue_count:
          type: integer
          minimum: 0
          description: Number of reported validation issues
        issues:
          type: array
          description: Stable validation issue records shared with CLI reports
          items:
            $ref: '#/components/schemas/ValidationReportIssue'
        validation_report_v2:
          allOf:
            - $ref: '#/components/schemas/ValidationReportV2'
          nullable: true
          description: Opt-in validation report v2 artifact returned when report_schema_version is 2
        errors:
          type: array
          deprecated: true
          description: Compatibility error array; use issues instead
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          deprecated: true
          description: Compatibility warning array; use issues instead
          items:
            $ref: '#/components/schemas/ValidationWarning'
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    ValidateRedactedRequest:
      type: object
      required: [message, profile, redaction_policy]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        profile:
          type: string
          description: Profile content (YAML)
        redaction_policy:
          type: string
          description: Safe-analysis redaction policy content (TOML)
        mllp_framed:
          type: boolean
          default: false
        include_redacted_hl7:
          type: boolean
          default: false
          description: Whether to include the redacted HL7 payload in the response
        report_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Optional validation report schema version. Version 2 adds validation_report_v2 with embedded evidence provenance while preserving the existing response fields.

    ValidateRedactedResponse:
      type: object
      required: [validation_report, redaction_receipt]
      properties:
        validation_report:
          $ref: '#/components/schemas/ValidationReport'
        validation_report_v2:
          allOf:
            - $ref: '#/components/schemas/ValidationReportV2'
          nullable: true
          description: Opt-in validation report v2 artifact returned when report_schema_version is 2
        redaction_receipt:
          $ref: '#/components/schemas/RedactionReceipt'
        quarantine:
          allOf:
            - $ref: '#/components/schemas/QuarantineOutputSummary'
          nullable: true
          description: Quarantine output summary when configured and validation failed
        redacted_hl7:
          type: string
          nullable: true
          description: Redacted HL7 payload, returned only when requested

    BundleRequest:
      type: object
      required: [message, profile, redaction_policy, bundle_id]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        profile:
          type: string
          description: Profile content (YAML)
        redaction_policy:
          type: string
          description: Safe-analysis redaction policy content (TOML)
        bundle_id:
          type: string
          pattern: '^(?!\.{1,2}$)[A-Za-z0-9_.-]{1,128}$'
          description: Single safe path segment relative to the configured server bundle output root
        mllp_framed:
          type: boolean
          default: false

    EvidenceBundleSummary:
      type: object
      required:
        - bundle_version
        - output_dir
        - message_type
        - validation_valid
        - validation_issue_count
        - redaction_phi_removed
        - artifacts
      properties:
        bundle_version:
          type: string
          enum: ['1']
        output_dir:
          type: string
          description: Bundle id relative to the configured server bundle output root
        message_type:
          type: string
        validation_valid:
          type: boolean
        validation_issue_count:
          type: integer
          minimum: 0
        redaction_phi_removed:
          type: boolean
        artifacts:
          type: array
          items:
            type: string

    QuarantineOutputSummary:
      type: object
      required:
        - quarantine_version
        - output_dir
        - reason
        - validation_issue_count
        - artifacts
      properties:
        quarantine_version:
          type: string
          enum: ['1']
        output_dir:
          type: string
          description: Quarantine output id relative to the configured server quarantine root
        reason:
          type: string
          enum: [validation_error]
        validation_issue_count:
          type: integer
          minimum: 0
        artifacts:
          type: array
          items:
            type: string

    ValidationReport:
      type: object
      required: [valid, message_type, segment_count, issue_count, issues]
      properties:
        valid:
          type: boolean
        message_type:
          type: string
          description: HL7 trigger event from MSH.9, such as ADT^A01
        profile:
          type: string
          nullable: true
          description: Profile identifier used for validation
        segment_count:
          type: integer
          minimum: 0
          description: Number of parsed message segments
        issue_count:
          type: integer
          minimum: 0
          description: Number of reported validation issues
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationReportIssue'

    ValidationReportV2:
      type: object
      required: [schema_version, tool_name, tool_version, valid, message_type, segment_count, issue_count, issues]
      properties:
        schema_version:
          type: string
          enum: ['2']
        tool_name:
          type: string
          enum: [hl7v2-server]
        tool_version:
          type: string
          description: Semantic version of the server crate that generated the report
        valid:
          type: boolean
        message_type:
          type: string
          description: HL7 trigger event from MSH.9, such as ADT^A01
        profile:
          type: string
          nullable: true
          description: Profile identifier used for validation
        profile_identity:
          allOf:
            - $ref: '#/components/schemas/ValidationReportProfileIdentity'
          nullable: true
          description: Reproducible profile identity metadata for the inline profile
        segment_count:
          type: integer
          minimum: 0
          description: Number of parsed message segments
        issue_count:
          type: integer
          minimum: 0
          description: Number of reported validation issues
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationReportIssue'

    ValidationReportProfileIdentity:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: Display label for the inline profile; the server uses the loaded profile message structure
        message_structure:
          type: string
          nullable: true
          description: Loaded profile message structure when known
        version:
          type: string
          nullable: true
          description: Loaded profile HL7 version when known
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          nullable: true
          description: SHA-256 digest of the supplied inline profile YAML

    RedactionReceipt:
      type: object
      required: [phi_removed, hash_algorithm, actions]
      properties:
        phi_removed:
          type: boolean
          description: Whether any configured PHI-bearing path was removed or hashed
        hash_algorithm:
          type: string
          enum: [sha256]
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RedactionActionReceipt'

    RedactionActionReceipt:
      type: object
      required: [path, action, reason, matched_count, optional, status]
      properties:
        path:
          type: string
        action:
          type: string
          enum: [hash, drop, retain]
        reason:
          type: string
        matched_count:
          type: integer
          minimum: 0
        optional:
          type: boolean
        status:
          type: string
          enum: [applied, retained, not_found]

    AckRequest:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        code:
          type: string
          enum: [AA, AE, AR, CA, CE, CR]
          description: ACK code to generate
        error_message:
          type: string
          nullable: true
          description: Optional error text for ERR segment generation
        mllp_framed:
          type: boolean
          default: false
          description: Whether the input message is MLLP framed
        mllp_frame:
          type: boolean
          default: false
          description: Whether to MLLP frame the ACK response

    AckResponse:
      type: object
      required: [ack_message, ack_code, metadata]
      properties:
        ack_message:
          type: string
          description: Generated ACK message
        ack_code:
          type: string
          enum: [AA, AE, AR, CA, CE, CR]
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    AckPolicyRequest:
      type: object
      required: [message, profile]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        profile:
          type: string
          description: Profile content (YAML) used to validate before choosing ACK or NAK
        mllp_framed:
          type: boolean
          default: false
          description: Whether the input message is MLLP framed
        mllp_frame:
          type: boolean
          default: false
          description: Whether to MLLP frame the ACK response

    AckPolicyResponse:
      type: object
      required: [ack_message, ack_code, decision, metadata]
      properties:
        ack_message:
          type: string
          description: Generated ACK or NAK message
        ack_code:
          type: string
          enum: [AA, AR, CA, CR]
        decision:
          $ref: '#/components/schemas/AckPolicyDecision'
        validation_report:
          allOf:
            - $ref: '#/components/schemas/ValidationReport'
          nullable: true
          description: Validation report used for the decision, absent when the message could not be parsed
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    AckPolicyDecision:
      type: object
      required: [mode, outcome, reason, ack_code, include_error_text]
      properties:
        mode:
          type: string
          enum: [original, enhanced]
        outcome:
          type: string
          enum: [accepted, rejected]
        reason:
          type: string
          enum: [valid, parse_error, validation_error]
        ack_code:
          type: string
          enum: [AA, AR, CA, CR]
        include_error_text:
          type: boolean
        error_text:
          type: string
          nullable: true
          description: Non-PHI error text included in ERR when configured

    NormalizeRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        mllp_framed:
          type: boolean
          default: false
          description: Whether the input message is MLLP framed
        options:
          $ref: '#/components/schemas/NormalizeOptions'

    NormalizeOptions:
      type: object
      properties:
        canonical_delimiters:
          type: boolean
          default: true
          description: Rewrite delimiters to canonical HL7 delimiters
        mllp_frame:
          type: boolean
          default: false
          description: Whether to MLLP frame the normalized response

    NormalizeResponse:
      type: object
      required: [normalized_message, metadata]
      properties:
        normalized_message:
          type: string
          description: Normalized HL7 message
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    ValidationError:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        location:
          type: string
          nullable: true
        severity:
          type: string
          enum: [error, warning, info]

    ValidationReportIssue:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          description: Stable snake_case issue code
        severity:
          type: string
          enum: [error, warning]
        path:
          type: string
          nullable: true
          description: HL7 path associated with the issue, such as PID.3
        rule_id:
          type: string
          nullable: true
          description: Stable rule identifier
        message:
          type: string
          description: Human-readable issue message
        segment_index:
          type: integer
          minimum: 0
          nullable: true
          description: Zero-based segment index when available
        field_index:
          type: integer
          minimum: 1
          nullable: true
          description: One-based HL7 field index when available

    ValidationWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        location:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
