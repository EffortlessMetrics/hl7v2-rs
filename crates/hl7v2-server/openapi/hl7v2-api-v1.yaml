openapi: 3.1.0
info:
  title: HL7v2-rs HTTP API
  version: 1.5.0
  description: |
    RESTful API for HL7 v2 message parsing, validation, and processing.

    This API provides endpoints for:
    - Parsing HL7 v2 messages
    - Validating messages against conformance profiles
    - Generating ACK messages
    - Normalizing HL7 v2 messages

    ## Authentication

    HL7 processing endpoints under `/hl7/*` require API Key authentication via
    the `X-API-Key` header when the server is configured with an API key:
    ```
    X-API-Key: <your-api-key>
    ```

    Health, readiness, metrics, and API documentation endpoints are public by
    design so load balancers, scrapers, and local operators can inspect service
    state without application credentials.

    ## Rate Limiting

    - 120 requests per minute per IP
    - Exceeded limits return 429 Too Many Requests

    ## Tracing

    The system uses internal tracing spans. Correlation IDs may be added in future versions.
  contact:
    name: HL7v2-rs Team
    url: https://github.com/EffortlessMetrics/hl7v2-rs
    email: team@effortlessmetrics.com
  license:
    name: AGPL-3.0-or-later
    url: https://github.com/EffortlessMetrics/hl7v2-rs/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
    description: Health and readiness checks
  - name: hl7
    description: HL7 v2 message operations

paths:
  /health:
    get:
      summary: Health check
      description: Returns service status and uptime
      tags: [health]
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness check
      description: Returns startup readiness checks and typed evidence self-check status
      tags: [health]
      operationId: readinessCheck
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns metrics in Prometheus text format
      tags: [health]
      operationId: getMetrics
      responses:
        '200':
          description: Metrics data
          content:
            text/plain:
              schema:
                type: string

  /hl7/parse:
    post:
      summary: Parse HL7 message
      description: |
        Parse an HL7 v2 message and return metadata and optional JSON.
      tags: [hl7]
      operationId: parseMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Message parsed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          description: Invalid message format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /hl7/validate:
    post:
      summary: Validate HL7 message
      description: |
        Validate an HL7 message against a conformance profile.
      tags: [hl7]
      operationId: validateMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Validation complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '400':
          description: Invalid request or profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/validate-redacted:
    post:
      summary: Validate redacted HL7 message
      description: |
        Apply a safe-analysis redaction policy to an HL7 message, then validate the redacted message against a conformance profile. When server quarantine output is enabled, failed validation writes configured quarantine artifacts under the server-controlled quarantine root.
      tags: [hl7]
      operationId: validateRedactedMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRedactedRequest'
      responses:
        '200':
          description: Redaction and validation complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateRedactedResponse'
        '400':
          description: Invalid request, profile, message, or redaction policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '503':
          description: Server quarantine output is enabled but not configured or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hl7/bundle:
    post:
      summary: Create redacted evidence bundle
      description: |
        Apply safe-analysis redaction, validate the redacted message, and write a replayable evidence bundle under the server's configured bundle output root. The request supplies a bundle_id, not a filesystem path.
      tags: [hl7]
      operationId: createEvidenceBundle
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleRequest'
      responses:
        '201':
          description: Evidence bundle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundleSummary'
        '400':
          description: Invalid request, profile, message, redaction policy, or bundle id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Bundle id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Server bundle output root is not configured or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hl7/replay:
    post:
      summary: Replay evidence bundle
      description: |
        Replay and verify a previously written evidence bundle under the server's configured bundle output root. The request supplies a bundle_id, not a filesystem path.
      tags: [hl7]
      operationId: replayEvidenceBundle
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Replay verification complete
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EvidenceReplayReport'
                  - $ref: '#/components/schemas/EvidenceReplayReportV2'
        '400':
          description: Invalid replay request or bundle id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Bundle id was not found under the configured output root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Server bundle output root is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /hl7/corpus/summarize:
    post:
      summary: Summarize inline HL7 corpus
      description: |
        Summarize caller-supplied HL7 messages without reading filesystem paths from the request. Message ids are safe labels used only for parse-error attribution.
      tags: [hl7]
      operationId: summarizeInlineCorpus
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusSummaryRequest'
      responses:
        '200':
          description: Corpus summary generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CorpusSummary'
                  - $ref: '#/components/schemas/CorpusSummaryV2'
        '400':
          description: Invalid corpus request or schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/corpus/fingerprint:
    post:
      summary: Fingerprint inline HL7 corpus
      description: |
        Generate a deterministic compact signature for caller-supplied HL7 messages. Optional inline profile content adds profile identity metadata and validation issue-code counts.
      tags: [hl7]
      operationId: fingerprintInlineCorpus
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusFingerprintRequest'
      responses:
        '200':
          description: Corpus fingerprint generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CorpusFingerprint'
                  - $ref: '#/components/schemas/CorpusFingerprintV2'
        '400':
          description: Invalid corpus request, profile, or schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/corpus/diff:
    post:
      summary: Diff inline HL7 corpora
      description: |
        Compare before and after sets of caller-supplied HL7 messages. Optional inline profile content adds profile identity metadata and validation issue-code deltas.
      tags: [hl7]
      operationId: diffInlineCorpus
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusDiffRequest'
      responses:
        '200':
          description: Corpus diff generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CorpusDiffReport'
                  - $ref: '#/components/schemas/CorpusDiffReportV2'
        '400':
          description: Invalid corpus request, profile, or schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/profile/lint:
    post:
      summary: Lint inline conformance profile
      description: |
        Lint caller-supplied profile YAML and return a PHI-safe profile lint evidence report. Malformed YAML returns a lint report rather than echoing raw profile content.
      tags: [hl7]
      operationId: lintInlineProfile
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileLintRequest'
      responses:
        '200':
          description: Profile lint report generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProfileLintReport'
                  - $ref: '#/components/schemas/ProfileLintReportV2'
        '400':
          description: Invalid schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/profile/explain:
    post:
      summary: Explain inline conformance profile
      description: |
        Load and explain caller-supplied profile YAML without echoing the raw profile. The optional profile_name is a safe label, not a filesystem path.
      tags: [hl7]
      operationId: explainInlineProfile
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileExplainRequest'
      responses:
        '200':
          description: Profile explain report generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProfileExplainReport'
                  - $ref: '#/components/schemas/ProfileExplainReportV2'
        '400':
          description: Invalid profile, label, or schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/profile/test:
    post:
      summary: Test inline profile fixtures
      description: |
        Validate caller-supplied inline HL7 fixtures against an inline profile and return a profile test evidence report. Fixture labels are safe labels and are never read as filesystem paths.
      tags: [hl7]
      operationId: testInlineProfileFixtures
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileTestRequest'
      responses:
        '200':
          description: Profile fixture test report generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProfileTestReport'
                  - $ref: '#/components/schemas/ProfileTestReportV2'
        '400':
          description: Invalid profile, fixture, expected report, or schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized

  /hl7/ack:
    post:
      summary: Generate HL7 ACK
      description: |
        Generate an HL7 v2 ACK message with an explicit caller-supplied ACK code.
      tags: [hl7]
      operationId: generateAck
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        '200':
          description: ACK generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          description: Invalid message format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /hl7/ack-policy:
    post:
      summary: Generate policy-driven HL7 ACK
      description: |
        Parse and validate an inbound HL7 v2 message, then choose an ACK or NAK code using the server's configured ACK policy.
      tags: [hl7]
      operationId: generatePolicyAck
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckPolicyRequest'
      responses:
        '200':
          description: Policy-driven ACK generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckPolicyResponse'
        '400':
          description: Invalid message or profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /hl7/normalize:
    post:
      summary: Normalize HL7 message
      description: |
        Parse and rewrite an HL7 v2 message with stable delimiters and optional MLLP output framing.
      tags: [hl7]
      operationId: normalizeMessage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizeRequest'
      responses:
        '200':
          description: Message normalized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResponse'
        '400':
          description: Invalid message format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication via header

  schemas:
    HealthResponse:
      type: object
      required: [status, version, uptime_seconds]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        uptime_seconds:
          type: integer

    ReadyResponse:
      type: object
      required: [ready, status, version, checks]
      properties:
        ready:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        version:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'

    ReadinessCheck:
      type: object
      required: [name, status, message]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, fail]
        message:
          type: string

    ParseRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        mllp_framed:
          type: boolean
          default: false
        options:
          $ref: '#/components/schemas/ParseOptions'

    ParseOptions:
      type: object
      properties:
        include_json:
          type: boolean
          default: true
        validate_structure:
          type: boolean
          default: true

    ParseResponse:
      type: object
      required: [metadata]
      properties:
        message:
          type: object
          description: Parsed message in JSON format
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        warnings:
          type: array
          items:
            type: string

    MessageMetadata:
      type: object
      required: [message_type, version, sending_application, sending_facility, message_control_id, segment_count, charsets]
      properties:
        message_type:
          type: string
        version:
          type: string
        sending_application:
          type: string
        sending_facility:
          type: string
        message_control_id:
          type: string
        segment_count:
          type: integer
        charsets:
          type: array
          items:
            type: string

    ValidateRequest:
      type: object
      required: [message, profile]
      properties:
        message:
          type: string
        profile:
          type: string
          description: Profile content (YAML)
        mllp_framed:
          type: boolean
          default: false
        report_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Optional validation report schema version. Version 2 adds validation_report_v2 with embedded evidence provenance while preserving the existing response fields.

    ValidateResponse:
      type: object
      required: [valid, message_type, segment_count, issue_count, issues, metadata]
      properties:
        valid:
          type: boolean
        message_type:
          type: string
          description: HL7 trigger event from MSH.9, such as ADT^A01
        profile:
          type: string
          nullable: true
          description: Profile identifier used for validation
        segment_count:
          type: integer
          minimum: 0
          description: Number of parsed message segments
        issue_count:
          type: integer
          minimum: 0
          description: Number of reported validation issues
        issues:
          type: array
          description: Stable validation issue records shared with CLI reports
          items:
            $ref: '#/components/schemas/ValidationReportIssue'
        validation_report_v2:
          allOf:
            - $ref: '#/components/schemas/ValidationReportV2'
          nullable: true
          description: Opt-in validation report v2 artifact returned when report_schema_version is 2
        errors:
          type: array
          deprecated: true
          description: Compatibility error array; use issues instead
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          deprecated: true
          description: Compatibility warning array; use issues instead
          items:
            $ref: '#/components/schemas/ValidationWarning'
        metadata:
          $ref: '#/components/schemas/MessageMetadata'

    ValidateRedactedRequest:
      type: object
      required: [message, profile, redaction_policy]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        profile:
          type: string
          description: Profile content (YAML)
        redaction_policy:
          type: string
          description: Safe-analysis redaction policy content (TOML)
        mllp_framed:
          type: boolean
          default: false
        include_redacted_hl7:
          type: boolean
          default: false
          description: Whether to include the redacted HL7 payload in the response
        report_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Optional validation report schema version. Version 2 adds validation_report_v2 with embedded evidence provenance while preserving the existing response fields.
        redaction_receipt_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Optional redaction receipt schema version. Version 2 adds redaction_receipt_v2 with embedded evidence provenance while preserving the existing response fields.
        quarantine_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Optional quarantine output summary schema version. Version 2 adds quarantine_v2 with embedded evidence provenance while preserving the existing quarantine field.

    ValidateRedactedResponse:
      type: object
      required: [validation_report, redaction_receipt]
      properties:
        validation_report:
          $ref: '#/components/schemas/ValidationReport'
        validation_report_v2:
          allOf:
            - $ref: '#/components/schemas/ValidationReportV2'
          nullable: true
          description: Opt-in validation report v2 artifact returned when report_schema_version is 2
        redaction_receipt:
          $ref: '#/components/schemas/RedactionReceipt'
        redaction_receipt_v2:
          allOf:
            - $ref: '#/components/schemas/RedactionReceiptV2'
          nullable: true
          description: Opt-in redaction receipt v2 artifact returned when redaction_receipt_schema_version is 2
        quarantine:
          allOf:
            - $ref: '#/components/schemas/QuarantineOutputSummary'
          nullable: true
          description: Quarantine output summary when configured and validation failed
        quarantine_v2:
          allOf:
            - $ref: '#/components/schemas/QuarantineOutputSummaryV2'
          nullable: true
          description: Opt-in quarantine output v2 artifact returned when quarantine_schema_version is 2 and quarantine output is written
        redacted_hl7:
          type: string
          nullable: true
          description: Redacted HL7 payload, returned only when requested

    BundleRequest:
      type: object
      required: [message, profile, redaction_policy, bundle_id]
      properties:
        message:
          type: string
          description: Raw HL7 message content
        profile:
          type: string
          description: Profile content (YAML)
        redaction_policy:
          type: string
          description: Safe-analysis redaction policy content (TOML)
        bundle_id:
          type: string
          pattern: '^(?!\.{1,2}$)[A-Za-z0-9_.-]{1,128}$'
          description: Single safe path segment relative to the configured server bundle output root
        mllp_framed:
          type: boolean
          default: false
        bundle_artifact_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Opt into v2 bundle-internal artifacts for manifest.json, environment.json, field-paths.json, and redaction-receipt.json

    EvidenceBundleSummary:
      type: object
      required:
        - bundle_version
        - output_dir
        - message_type
        - validation_valid
        - validation_issue_count
        - redaction_phi_removed
        - artifacts
      properties:
        bundle_version:
          type: string
          enum: ['1']
        output_dir:
          type: string
          description: Bundle id relative to the configured server bundle output root
        message_type:
          type: string
        validation_valid:
          type: boolean
        validation_issue_count:
          type: integer
          minimum: 0
        redaction_phi_removed:
          type: boolean
        artifacts:
          type: array
          items:
            type: string

    ReplayRequest:
      type: object
      required: [bundle_id]
      properties:
        bundle_id:
          type: string
          pattern: '^(?!\.{1,2}$)[A-Za-z0-9_.-]{1,128}$'
          description: Single safe path segment relative to the configured server bundle output root
        replay_report_schema_version:
          type: integer
          enum: [1, 2]
          default: 1
          description: Opt into the v2 evidence replay report response shape

    EvidenceReplayReport:
      type: object
      required:
        - replay_version
        - bundle_version
        - tool_name
        - tool_version
        - message_type
        - reproduced
        - validation_valid
        - validation_issue_count
        - checks
      properties:
        replay_version:
          type: string
          enum: ['1']
        bundle_version:
          type: string
          nullable: true
        tool_name:
          type: string
          enum: [hl7v2-server]
        tool_version:
          type: string
        message_type:
          type: string
          nullable: true
        reproduced:
          type: boolean
        validation_valid:
          type: boolean
          nullable: true
        validation_issue_count:
          type: integer
          minimum: 0
          nullable: true
        checks:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceReplayCheck'
        validation_report:
          allOf:
            - $ref: '#/components/schemas/ValidationReport'
          nullable: true

    EvidenceReplayReportV2:
      type: object
      required:
        - schema_version
        - replay_version
        - bundle_version
        - tool_name
        - tool_version
        - message_type
        - reproduced
        - validation_valid
        - validation_issue_count
        - checks
      properties:
        schema_version:
          type: string
          enum: ['2']
        replay_version:
          type: string
          enum: ['1']
        bundle_version:
          type: string
          nullable: true
        tool_name:
          type: string
          enum: [hl7v2-server]
        tool_version:
          type: string
        message_type:
          type: string
          nullable: true
        reproduced:
          type: boolean
        validation_valid:
          type: boolean
          nullable: true
        validation_issue_count:
          type: integer
          minimum: 0
