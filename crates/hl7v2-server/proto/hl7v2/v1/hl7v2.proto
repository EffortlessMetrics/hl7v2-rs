syntax = "proto3";

package hl7v2.v1;

option go_package = "github.com/EffortlessMetrics/hl7v2-rs/gen/go/hl7v2/v1;hl7v2v1";
option java_package = "com.hl7v2rs.api.v1";
option java_multiple_files = true;

// HL7v2 Service provides gRPC endpoints for HL7 v2 message processing
service HL7Service {
  // Parse an HL7 v2 message
  rpc Parse(ParseRequest) returns (ParseResponse);

  // Parse multiple messages in a stream
  rpc ParseStream(stream ParseStreamRequest) returns (stream ParseStreamResponse);

  // Validate a message against a profile
  rpc Validate(ValidateRequest) returns (ValidateResponse);

  // Redact a message with a safe-analysis policy, then validate it
  rpc ValidateRedacted(ValidateRedactedRequest) returns (ValidateRedactedResponse);

  // Summarize an inline corpus without reading caller-supplied filesystem paths
  rpc CorpusSummarize(CorpusSummarizeRequest) returns (CorpusSummarizeResponse);

  // Generate an acknowledgment (ACK) message
  rpc GenerateAck(GenerateAckRequest) returns (GenerateAckResponse);

  // Normalize a message
  rpc Normalize(NormalizeRequest) returns (NormalizeResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Parse Request
message ParseRequest {
  // HL7 message bytes
  bytes message = 1;

  // Whether message is MLLP-framed
  bool mllp_framed = 2;

  // Parse options
  ParseOptions options = 3;
}

message ParseStreamRequest {
  // HL7 message bytes
  bytes message = 1;

  // Whether message is MLLP-framed
  bool mllp_framed = 2;

  // Parse options
  ParseOptions options = 3;
}

message ParseOptions {
  // Strict parsing mode
  bool strict = 1;

  // Expected HL7 version
  string expected_version = 2;
}

// Parse Response
message ParseResponse {
  // Whether parsing succeeded
  bool success = 1;

  // Parsed message (if successful)
  Message message = 2;

  // Errors (if any)
  repeated Error errors = 3;

  // Metadata
  MessageMetadata metadata = 4;
}

message ParseStreamResponse {
  // Whether parsing succeeded
  bool success = 1;

  // Parsed message (if successful)
  Message message = 2;

  // Errors (if any)
  repeated Error errors = 3;

  // Metadata
  MessageMetadata metadata = 4;
}

// Message representation
message Message {
  // Delimiters used
  Delimiters delimiters = 1;

  // Segments
  repeated Segment segments = 2;
}

// Delimiters
message Delimiters {
  string field = 1;
  string component = 2;
  string repetition = 3;
  string escape = 4;
  string subcomponent = 5;
}

// Segment
message Segment {
  // Segment ID (e.g., "MSH", "PID")
  string id = 1;

  // Fields
  repeated Field fields = 2;

  // Sequence number (for repeated segments)
  int32 sequence = 3;
}

// Field
message Field {
  // Field presence
  enum Presence {
    PRESENCE_UNSPECIFIED = 0;
    PRESENCE_MISSING = 1;
    PRESENCE_EMPTY = 2;
    PRESENCE_NULL = 3;
    PRESENCE_VALUE = 4;
  }

  Presence presence = 1;

  // Simple value (for non-repeating, non-component fields)
  optional string value = 2;

  // Repetitions (for repeating fields)
  repeated Repetition repetitions = 3;
}

// Repetition
message Repetition {
  // Simple value
  optional string value = 1;

  // Components
  repeated Component components = 2;
}

// Component
message Component {
  // Component value
  optional string value = 1;

  // Subcomponents
  repeated string subcomponents = 2;
}

// Message Metadata
message MessageMetadata {
  // Message type (e.g., "ADT^A01")
  string message_type = 1;

  // HL7 version (e.g., "2.5")
  string version = 2;

  // Message control ID
  string control_id = 3;

  // Sending facility
  string sending_facility = 4;

  // Receiving facility
  string receiving_facility = 5;
}

// Validate Request
message ValidateRequest {
  // HL7 message bytes
  bytes message = 1;

  // Inline HL7v2 profile YAML content
  string profile = 2;

  // Whether message is MLLP-framed
  bool mllp_framed = 3;

  // Validation options
  ValidationOptions options = 4;

  // Optional validation evidence schema version.
  //
  // Omitted or 1 preserves the legacy response fields. 2 includes the
  // validation_report_v2 field with embedded provenance.
  int32 report_schema_version = 5;
}

message ValidationOptions {
  // Fail on warnings
  bool fail_on_warning = 1;

  // Strict mode
  bool strict = 2;
}

// Validate Response
message ValidateResponse {
  // Whether validation passed
  bool valid = 1;

  // Errors
  repeated ValidationIssue errors = 2;

  // Warnings
  repeated ValidationIssue warnings = 3;

  // Summary
  ValidationSummary summary = 4;

  // Stable validation report fields shared with CLI, REST, Rust, and Python
  ValidationReport validation_report = 5;

  // Opt-in validation report with embedded evidence provenance
  ValidationReportV2 validation_report_v2 = 6;
}

// Validate and redact request.
message ValidateRedactedRequest {
  // HL7 message bytes
  bytes message = 1;

  // Inline HL7v2 profile YAML content
  string profile = 2;

  // Inline safe-analysis redaction policy in TOML format
  string redaction_policy = 3;

  // Whether message is MLLP-framed
  bool mllp_framed = 4;

  // Whether to include the redacted HL7 payload in the response
  bool include_redacted_hl7 = 5;

  // Optional validation evidence schema version.
  //
  // Omitted or 1 preserves the default response fields. 2 includes the
  // validation_report_v2 field with embedded provenance.
  int32 report_schema_version = 6;

  // Optional redaction receipt evidence schema version.
  //
  // Omitted or 1 preserves the default receipt fields. 2 includes the
  // redaction_receipt_v2 field with embedded provenance.
  int32 redaction_receipt_schema_version = 7;
}

// Validate and redact response.
message ValidateRedactedResponse {
  // Validation report generated from the redacted message
  ValidationReport validation_report = 1;

  // Opt-in validation report with embedded evidence provenance
  ValidationReportV2 validation_report_v2 = 2;

  // Receipt describing redaction actions applied before validation
  RedactionReceipt redaction_receipt = 3;

  // Opt-in redaction receipt with embedded evidence provenance
  RedactionReceiptV2 redaction_receipt_v2 = 4;

  // Redacted HL7 payload, included only when requested
  optional bytes redacted_hl7 = 5;
}

// Stable redaction receipt artifact.
message RedactionReceipt {
  // Whether any configured PHI-bearing field was removed or hashed
  bool phi_removed = 1;

  // Hash algorithm used by hash redaction actions
  string hash_algorithm = 2;

  // Per-rule redaction receipts
  repeated RedactionActionReceipt actions = 3;
}

// Redaction receipt v2 artifact with embedded evidence provenance.
message RedactionReceiptV2 {
  // Evidence artifact schema version
  string schema_version = 1;

  // Producer surface that generated this receipt
  string tool_name = 2;

  // Semantic version of the producing crate or binding package
  string tool_version = 3;

  // Whether any configured PHI-bearing field was removed or hashed
  bool phi_removed = 4;

  // Hash algorithm used by hash redaction actions
  string hash_algorithm = 5;

  // Per-rule redaction receipts
  repeated RedactionActionReceipt actions = 6;
}

// Per-rule redaction action receipt.
message RedactionActionReceipt {
  // HL7 path covered by this policy action
  string path = 1;

  // Policy action: hash, drop, or retain
  string action = 2;

  // Policy reason for the action
  string reason = 3;

  // Number of matching values affected by this action
  uint32 matched_count = 4;

  // Whether missing matches are acceptable
  bool optional = 5;

  // Action status: applied, retained, or not_found
  string status = 6;
}

// Inline corpus summary request.
message CorpusSummarizeRequest {
  // Inline HL7 messages to summarize. The service does not read filesystem
  // paths from this request.
  repeated CorpusMessageInput messages = 1;

  // Optional corpus summary evidence schema version.
  //
  // Omitted or 1 preserves the default summary fields. 2 includes the
  // summary_v2 field with embedded provenance.
  int32 summary_schema_version = 2;
}

// Caller-supplied in-memory corpus message.
message CorpusMessageInput {
  // Optional stable label for parse-error reporting. This is not a filesystem
  // path and must be safe to echo in evidence.
  optional string id = 1;

  // Raw HL7 message bytes. Plain HL7 and MLLP-framed messages are accepted.
  bytes message = 2;
}

// Inline corpus summary response.
message CorpusSummarizeResponse {
  // Stable corpus summary fields shared with CLI, REST, Rust, and Python.
  CorpusSummary summary = 1;

  // Opt-in corpus summary with embedded evidence provenance.
  CorpusSummaryV2 summary_v2 = 2;
}

// Stable corpus summary artifact.
message CorpusSummary {
  // Caller-independent corpus root label.
  string root = 1;

  // Number of inline messages inspected.
  uint32 file_count = 2;

  // Number of messages parsed successfully.
  uint32 message_count = 3;

  // Number of messages that could not be parsed as HL7 v2.
  uint32 parse_error_count = 4;

  // Total input bytes across the inline corpus.
  uint64 total_bytes = 5;

  // Message type counts from parsed MSH-9 values.
  repeated CorpusCount message_types = 6;

  // Segment ID counts across parsed messages.
  repeated CorpusCount segments = 7;

  // Field presence counts across parsed messages.
  repeated CorpusFieldPresence field_presence = 8;

  // Per-message parse failures.
  repeated CorpusParseFailure parse_errors = 9;
}

// Corpus summary v2 artifact with embedded evidence provenance.
message CorpusSummaryV2 {
  // Evidence artifact schema version.
  string schema_version = 1;

  // Producer surface that generated this summary.
  string tool_name = 2;

  // Semantic version of the producing crate or binding package.
  string tool_version = 3;

  // Caller-independent corpus root label.
  string root = 4;

  // Number of inline messages inspected.
  uint32 file_count = 5;

  // Number of messages parsed successfully.
  uint32 message_count = 6;

  // Number of messages that could not be parsed as HL7 v2.
  uint32 parse_error_count = 7;

  // Total input bytes across the inline corpus.
  uint64 total_bytes = 8;

  // Message type counts from parsed MSH-9 values.
  repeated CorpusCount message_types = 9;

  // Segment ID counts across parsed messages.
  repeated CorpusCount segments = 10;

  // Field presence counts across parsed messages.
  repeated CorpusFieldPresence field_presence = 11;

  // Per-message parse failures.
  repeated CorpusParseFailure parse_errors = 12;
}

// Count for a corpus dimension.
message CorpusCount {
  // Dimension value, such as a message type or segment ID.
  string value = 1;

  // Number of occurrences.
  uint32 count = 2;
}

// Field presence count across an inline corpus.
message CorpusFieldPresence {
  // HL7 path, such as PID.3.
  string path = 1;

  // Number of parsed messages where this path appeared.
  uint32 message_count = 2;

  // Number of field occurrences across all parsed messages.
  uint32 occurrence_count = 3;
}

// Parse failure captured while summarizing an inline corpus.
message CorpusParseFailure {
  // Caller-supplied message label or generated inline message label.
  string path = 1;

  // Parser error string. This must not include raw message content.
  string error = 2;
}

// Validation Issue
message ValidationIssue {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_ERROR = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_INFO = 3;
  }

  // Error code
  string code = 1;

  // Human-readable message
  string message = 2;

  // Severity
  Severity severity = 3;

  // Location in message
  Location location = 4;

  // Remediation advice
  string advice = 5;
}

// Location in message
message Location {
  // Segment ID
  string segment = 1;

  // Field number
  int32 field = 2;

  // Component number
  int32 component = 3;

  // Repetition number
  int32 repetition = 4;

  // Byte offset
  int64 byte_offset = 5;
}

// Validation Summary
message ValidationSummary {
  int32 error_count = 1;
  int32 warning_count = 2;
  int32 info_count = 3;
}

// Stable validation report artifact.
message ValidationReport {
  // Whether validation passed without error-level issues
  bool valid = 1;

  // HL7 trigger event from MSH.9, such as ADT^A01
  string message_type = 2;

  // Profile identifier, usually the loaded profile message structure
  optional string profile = 3;

  // Number of parsed message segments
  int32 segment_count = 4;

  // Number of reported validation issues
  int32 issue_count = 5;

  // Stable validation issue records
  repeated ValidationReportIssue issues = 6;
}

// Validation report v2 artifact with embedded evidence provenance.
message ValidationReportV2 {
  // Evidence artifact schema version
  string schema_version = 1;

  // Producer surface that generated this report
  string tool_name = 2;

  // Semantic version of the producing crate or binding package
  string tool_version = 3;

  // Whether validation passed without error-level issues
  bool valid = 4;

  // HL7 trigger event from MSH.9, such as ADT^A01
  string message_type = 5;

  // Profile identifier, usually the loaded profile message structure
  optional string profile = 6;

  // Reproducible profile identity metadata when available
  ValidationReportProfileIdentity profile_identity = 7;

  // Number of parsed message segments
  int32 segment_count = 8;

  // Number of reported validation issues
  int32 issue_count = 9;

  // Stable validation issue records
  repeated ValidationReportIssue issues = 10;
}

// Reproducible profile identity metadata.
message ValidationReportProfileIdentity {
  // Display label for the profile source
  string label = 1;

  // Loaded profile message structure when known
  optional string message_structure = 2;

  // Loaded profile HL7 version when known
  optional string version = 3;

  // SHA-256 digest of the profile bytes when available
  optional string sha256 = 4;
}

// Stable validation issue record used in machine-readable reports.
message ValidationReportIssue {
  // Stable snake_case issue code
  string code = 1;

  // Error or warning severity
  string severity = 2;

  // HL7 path associated with the issue, such as PID.3
  optional string path = 3;

  // Stable rule identifier
  optional string rule_id = 4;

  // Human-readable issue message
  string message = 5;

  // Zero-based segment index when known
  optional uint32 segment_index = 6;

  // One-based HL7 field index when known
  optional uint32 field_index = 7;
}

// ACK Request
message GenerateAckRequest {
  // Original message
  bytes message = 1;

  // ACK code
  enum AckCode {
    ACK_CODE_UNSPECIFIED = 0;
    ACK_CODE_AA = 1;  // Application Accept
    ACK_CODE_AE = 2;  // Application Error
    ACK_CODE_AR = 3;  // Application Reject
  }

  AckCode code = 2;

  // Error message (for AE/AR)
  optional string error_message = 3;
}

// ACK Response
message GenerateAckResponse {
  // Generated ACK message
  bytes ack_message = 1;

  // Parsed ACK (for verification)
  Message parsed_ack = 2;
}

// Normalize Request
message NormalizeRequest {
  // Message to normalize
  bytes message = 1;

  // Normalization options
  NormalizeOptions options = 2;
}

message NormalizeOptions {
  // Use canonical delimiters
  bool canonical_delimiters = 1;

  // Add MLLP framing
  bool mllp_frame = 2;

  // Sort fields
  bool sort_fields = 3;
}

// Normalize Response
message NormalizeResponse {
  // Normalized message
  bytes normalized = 1;
}

// Health Check Request
message HealthCheckRequest {}

// Health Check Response
message HealthCheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
    SERVING_STATUS_SERVICE_UNKNOWN = 3;
  }

  ServingStatus status = 1;
  string version = 2;
  int64 uptime_seconds = 3;
}

// Error
message Error {
  // Error code
  string code = 1;

  // Error message
  string message = 2;

  // Additional details
  map<string, string> details = 3;

  // Trace ID
  string trace_id = 4;
}
