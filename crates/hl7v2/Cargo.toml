[package]
name = "hl7v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage = "https://github.com/EffortlessMetrics/hl7v2-rs"
documentation = "https://docs.rs/hl7v2"
description = "HL7 v2 message parser and processor for Rust"
readme = "README.md"

[features]
default = [
    "json",
    "profile",
    "ack",
    "normalize",
]

json = []
profile = [
    "dep:hl7v2-prof",
    "dep:hl7v2-validation",
    "dep:chrono",
    "dep:regex",
]
ack = ["dep:chrono"]
normalize = []
batch = []
stream = ["dep:tokio"]
network = ["dep:hl7v2-network"]
synthetic = [
    "ack",
    "dep:serde",
    "dep:chrono",
    "dep:rand",
    "dep:rand_distr",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:uuid",
]
redact = []
lifecycle = ["dep:chrono", "dep:serde", "dep:sha2"]
experimental-guard = ["dep:serde"]

[dependencies]
hl7v2-model = { version = "1.2.0", path = "../hl7v2-model" }
hl7v2-escape = { version = "1.2.0", path = "../hl7v2-escape" }
hl7v2-mllp = { version = "1.2.0", path = "../hl7v2-mllp" }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
sha2 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rand = { version = "0.10.0", optional = true }
rand_distr = { version = "0.6.0", optional = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
tokio = { workspace = true, optional = true }

hl7v2-prof = { version = "1.2.0", path = "../hl7v2-prof", optional = true }
hl7v2-validation = { version = "1.2.0", path = "../hl7v2-validation", optional = true }
hl7v2-network = { version = "1.2.0", path = "../hl7v2-network", optional = true }

[dev-dependencies]
proptest = "1.6"

[lints]
workspace = true
