apiVersion: monitoring.coreos.com/v1
kind: AlertmanagerConfig
metadata:
  name: hl7v2-alerts
  namespace: hl7v2-system
spec:
  route:
    groupBy: ['alertname', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'default'
    routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warnings'
  receivers:
  - name: 'default'
    emailConfigs:
    - to: 'platform-team@effortlessmetrics.com'
      from: 'alerts@effortlessmetrics.com'
      smarthost: 'smtp.internal:587'
      authUsername: 'alerts@effortlessmetrics.com'
      authPassword:
        name: alertmanager-smtp
        key: password
      sendResolved: true
      
  - name: 'pagerduty-critical'
    pagerdutyConfigs:
    - serviceKey:
        name: pagerduty-service-key
        key: service-key
      severity: critical
      description: 'HL7v2 Server Critical Alert: {{ .GroupLabels.alertname }}'
      
  - name: 'slack-warnings'
    slackConfigs:
    - apiURL:
        name: slack-webhook-url
        key: url
      channel: '#hl7v2-alerts'
      title: 'HL7v2 Server Alert'
      text: |
        {{ range .Alerts }}
        *Alert:* {{ .Annotations.summary }}
        *Severity:* {{ .Labels.severity }}
        *Description:* {{ .Annotations.description }}
        {{ end }}
      sendResolved: true
