apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pass-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: nginx:1.25.3@sha256:abc123def456
        imagePullPolicy: IfNotPresent
