schema = 1
msrv = "1.93"

[policy]
panic_free_tests = true
allow_test_carveouts = false
suppression_style = "expect-with-reason"
blanket_categories = false

# Active lints are mirrored in the root Cargo.toml [workspace.lints] tables.
[[lint]]
name = "rust::unsafe_code"
level = "forbid"
status = "active"
class = "unsafe-memory"
reason = "This healthcare parser/protocol workspace does not permit unsafe Rust without a separate reviewed policy."

[[lint]]
name = "rust::unsafe_op_in_unsafe_fn"
level = "deny"
status = "active"
class = "unsafe-memory"
reason = "Unsafe operations must remain explicit even inside unsafe functions."

[[lint]]
name = "rust::unused_must_use"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Do not silently drop must-use work in parser, validation, IO, or test code."

[[lint]]
name = "clippy::unwrap_used"
level = "deny"
status = "active"
class = "panic"
reason = "No unchecked Result/Option collapse in production or tests."

[[lint]]
name = "clippy::expect_used"
level = "deny"
status = "active"
class = "panic"
reason = "Expected failures should be represented with typed errors or test Result returns, not panics."

[[lint]]
name = "clippy::panic"
level = "deny"
status = "active"
class = "panic"
reason = "The workspace policy is panic-free across parser/protocol production and tests."

[[lint]]
name = "clippy::indexing_slicing"
level = "deny"
status = "active"
class = "parser-safety"
reason = "HL7 parsing must avoid unchecked byte, slice, and field indexing at protocol boundaries."

[[lint]]
name = "clippy::string_slice"
level = "deny"
status = "active"
class = "parser-safety"
reason = "HL7 messages may contain non-ASCII payloads; UTF-8 slicing must be explicit and checked."

[[lint]]
name = "clippy::map_err_ignore"
level = "deny"
status = "active"
class = "silent-failure"
reason = "Error context must not be discarded at healthcare data boundaries."

[[lint]]
name = "clippy::allow_attributes_without_reason"
level = "deny"
status = "active"
class = "suppression-governance"
reason = "Every lint suppression must carry a reviewable reason."

[[lint]]
name = "clippy::same_length_and_capacity"
level = "deny"
status = "planned"
activate_when_msrv = "1.94"
class = "unsafe-memory"
reason = "Catch raw-parts reconstruction mistakes."

[[lint]]
name = "clippy::manual_ilog2"
level = "warn"
status = "planned"
activate_when_msrv = "1.94"
class = "numeric-correctness"
reason = "Prefer the standard integer log helper."

[[lint]]
name = "clippy::decimal_bitwise_operands"
level = "warn"
status = "planned"
activate_when_msrv = "1.94"
class = "numeric-correctness"
reason = "Make bit masks visually inspectable."

[[lint]]
name = "clippy::needless_type_cast"
level = "warn"
status = "planned"
activate_when_msrv = "1.94"
class = "numeric-correctness"
reason = "Avoid stale numeric type drift."

[[lint]]
name = "clippy::disallowed_fields"
level = "deny"
status = "planned"
activate_when_msrv = "1.95"
class = "architecture"
reason = "Allow architecture policy to ban direct field access across protected seams."

[[lint]]
name = "clippy::manual_checked_ops"
level = "warn"
status = "planned"
activate_when_msrv = "1.95"
class = "numeric-correctness"
reason = "Prefer checked arithmetic over manual divide-by-zero guards."

[[lint]]
name = "clippy::manual_take"
level = "warn"
status = "planned"
activate_when_msrv = "1.95"
class = "reviewability"
reason = "Use standard ownership helper instead of local reimplementation."

[[lint]]
name = "clippy::manual_pop_if"
level = "warn"
status = "planned"
activate_when_msrv = "1.95"
class = "reviewability"
reason = "Use collection APIs that encode predicate-and-pop intent directly."

[[lint]]
name = "clippy::duration_suboptimal_units"
level = "warn"
status = "planned"
activate_when_msrv = "1.95"
class = "reviewability"
reason = "Make durations legible without mental unit conversion."

[[lint]]
name = "clippy::unnecessary_trailing_comma"
level = "warn"
status = "planned"
activate_when_msrv = "1.95"
class = "reviewability"
reason = "Keep generated and hand-written format macro calls clean."
