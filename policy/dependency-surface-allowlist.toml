schema_version = "1.0"
policy = "dependency-surface-allowlist"
owner = "EffortlessMetrics"
status = "active"
updated = "2026-05-19"

# Dependency surfaces are governed separately from file presence so package
# managers and external toolchains remain reviewable.

[[allow]]
id = "rust-toolchain"
owner = "release/ci"
surface = "rust-msrv"
behavior = "The repository may pin Rust 1.95.0 with rustfmt and clippy components."
paths = ["rust-toolchain.toml", "Cargo.toml", "Cargo.lock"]
dependencies = ["rustc 1.95.0", "rustfmt", "clippy"]
reason = "Rust 1.95 is the declared MSRV and release support boundary."
covered_by = ["cargo run -p xtask -- gate --check"]
review_after = "2026-06-30"

[[allow]]
id = "python-maturin"
owner = "hl7v2-python"
surface = "python-binding"
behavior = "The Python distribution may use maturin/PyO3 build metadata while the Rust binding crate remains a governed binding backend outside the primary Rust product graph."
paths = ["pyproject.toml", "crates/hl7v2-python/Cargo.toml"]
dependencies = ["maturin", "pyo3"]
reason = "Python wheels are built from the internal PyO3 crate and published only through Python workflows."
covered_by = [".github/workflows/python-wheels.yml", ".github/workflows/python-testpypi.yml"]
review_after = "2026-06-30"

[[allow]]
id = "contract-toolchain"
owner = "api"
surface = "contracts"
behavior = "The contracts workflow may install pinned OpenAPI, schema, and protobuf validation tools."
paths = [".github/workflows/contracts.yml", ".spectral.yml"]
dependencies = ["Go 1.26.3", "@stoplight/spectral-cli 6.16.0", "@redocly/cli 2.31.1", "ajv-cli 5.0.0", "ajv-formats 3.0.1", "protoc-gen-doc 1.5.1", "@bufbuild/buf 1.69.0"]
reason = "Contract validation needs external linters for OpenAPI, JSON Schema, and protobuf compatibility."
covered_by = [".github/workflows/contracts.yml"]
review_after = "2026-06-30"

[[allow]]
id = "security-audit-tooling"
owner = "release/ci"
surface = "security"
behavior = "Security and nightly policy may depend on pinned cargo-audit and cargo-deny advisory, vulnerability, and license checks."
paths = ["deny.toml", ".github/workflows/security.yml", ".github/workflows/nightly.yml"]
dependencies = ["cargo-audit 0.22.1", "cargo-deny 0.19.6", "RustSec advisory database"]
reason = "Dependency and license gates require an explicit audit tool surface."
covered_by = ["cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings", "cargo deny check advisories licenses bans sources"]
review_after = "2026-06-30"

[[allow]]
id = "ripr-static-exposure"
owner = "release/ci"
surface = "ci"
behavior = "The advisory ripr workflow may install ripr 0.5.0 as the PR-time static mutation-exposure tool."
paths = [".github/workflows/ripr.yml", "ripr.toml", "policy/ripr-suppressions.toml"]
dependencies = ["ripr 0.5.0"]
reason = "ripr shifts mutation-exposure signal left without adding runtime mutation to ordinary PRs."
covered_by = [".github/workflows/ripr.yml"]
review_after = "2026-06-30"

[[allow]]
id = "targeted-runtime-mutation"
owner = "core/test"
surface = "ci"
behavior = "The targeted mutation workflow may install cargo-mutants 26.1.2 for routed runtime mutation proof."
paths = [".github/workflows/mutation.yml", "policy/ci-risk-packs.toml"]
dependencies = ["cargo-mutants 26.1.2"]
reason = "cargo-mutants is the slower runtime backstop that complements ripr static exposure analysis."
covered_by = [".github/workflows/mutation.yml"]
review_after = "2026-06-30"

[[allow]]
id = "nightly-runtime-mutation"
owner = "core/test"
surface = "ci"
behavior = "The nightly workflow may install cargo-mutants 26.1.2 for scheduled runtime mutation backstop proof."
paths = [".github/workflows/nightly.yml"]
dependencies = ["cargo-mutants 26.1.2"]
reason = "Nightly mutation is the slower runtime backstop that complements ripr and targeted PR-time mutation routing."
covered_by = [".github/workflows/nightly.yml"]
review_after = "2026-06-30"
