schema_version = "1.0"
policy = "evidence-parity"
owner = "EffortlessMetrics"
status = "active"
last_reviewed = "2026-05-17"

source_spec = "docs/specs/HL7V2-SPEC-0006-cross-surface-evidence-parity.md"
source_audit = "docs/audits/cross-surface-evidence-parity-gap-audit-2026-05-17.md"
support_map = "docs/status/SUPPORT_TIERS.md"

non_claims = [
  "This manifest does not claim TestPyPI, PyPI, npm, tag, GitHub release, or new crates.io success.",
  "Python local wheel proof is not public Python registry proof.",
  "hl7v2-python is binding backend infrastructure, not the recommended Rust API.",
  "TypeScript remains planned until @effortlessmetrics/hl7v2 has implementation and install proof.",
]

[surface.rust]
package = "hl7v2"
tier = "stable"
role = "Canonical parser, validator, normalizer, evidence model, and artifact semantics."
proof = [
  "cargo test -p hl7v2 --all-features",
  "cargo run -p xtask -- evidence-schema-check",
]

[surface.cli]
package = "hl7v2-cli"
tier = "stable"
role = "Operator and CI interface for evidence commands and support receipts."
proof = [
  "cargo test -p hl7v2-cli --test integration_tests",
  "cargo test -p hl7v2-cli --test bdd_tests",
]

[surface.rest]
package = "hl7v2-server"
tier = "stable"
role = "HTTP sidecar for validation, redaction, corpus, bundle, replay, and service integration."
proof = [
  "cargo test -p hl7v2-server --test parse_endpoint_test",
  "cargo test -p hl7v2-server --test validate_endpoint_test",
  "cargo test -p hl7v2-server --test validate_redacted_endpoint_test",
  "cargo test -p hl7v2-server --test bundle_endpoint_test",
  "cargo test -p hl7v2-server --test replay_endpoint_test",
  "cargo test -p hl7v2-server --test http_runtime_contract_test",
]

[surface.grpc]
package = "hl7v2-server"
tier = "beta"
role = "Typed service transport with evidence parity for implemented RPCs."
proof = [
  "cargo test -p hl7v2-server --test grpc_contract_tests",
  "cargo test -p hl7v2-cli --test serve_grpc_contract_test",
]

[surface.python]
package = "hl7v2"
backend_crate = "hl7v2-python"
tier = "experimental-local-wheel"
role = "Python user package backed by hl7v2-python; public registry proof is blocked by TestPyPI Trusted Publisher setup."
proof = [
  "python tests/python_smoke/smoke.py",
  "python tests/python_smoke/evidence_workflow_guide.py",
]
blocked_by = "https://github.com/EffortlessMetrics/hl7v2-rs/issues/563"

[surface.typescript]
package = "@effortlessmetrics/hl7v2"
tier = "planned"
role = "Future TypeScript package governed by HL7V2-SPEC-0005."
proof = []

