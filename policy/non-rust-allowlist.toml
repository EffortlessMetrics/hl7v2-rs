schema_version = "1.0"

[[allow]]
glob = ".github/workflows/*.yml"
kind = "ci_declarative"
owner = "release/ci"
reason = "GitHub Actions workflow definitions are platform-required YAML."
surface = "ci"
classification = "config"
covered_by = ["cargo xtask check-file-policy"]

[[allow]]
glob = "api/**/*.yaml"
kind = "api_contract"
owner = "api"
reason = "OpenAPI and Buf configuration are external interoperability contracts."
surface = "api"
classification = "production"
covered_by = ["cargo xtask check-file-policy", "cargo test --workspace"]

[[allow]]
glob = "api/**/*.proto"
kind = "api_contract"
owner = "api"
reason = "gRPC service definitions require Protocol Buffers."
surface = "api"
classification = "production"
covered_by = ["cargo xtask check-file-policy", "cargo test --workspace"]

[[allow]]
glob = "schemas/**/*.json"
kind = "schema_contract"
owner = "schema"
reason = "JSON Schemas define supported HL7 and configuration interchange contracts."
surface = "schema"
classification = "production"
covered_by = ["cargo xtask check-file-policy", "cargo test --workspace"]

[[allow]]
glob = "profiles/**/*.yaml"
kind = "fixture_profile"
owner = "profiles"
reason = "HL7 profile fixtures are data contracts used by parser and validator tests."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --workspace"]

[[allow]]
glob = "test_data/**"
kind = "fixture_input"
owner = "test-fixtures"
reason = "HL7 and YAML test fixtures intentionally exercise parser and template surfaces."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --workspace"]

[[allow]]
glob = "crates/**/fixtures/**"
kind = "fixture_input"
owner = "test-fixtures"
reason = "Crate-local fixture files are test inputs for protocol behavior."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --workspace"]

[[allow]]
glob = "crates/**/*.feature"
kind = "bdd_fixture"
owner = "test-fixtures"
reason = "Gherkin feature files document behavior scenarios used by crate tests."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --workspace"]

[[allow]]
glob = "crates/**/*.snap"
kind = "snapshot_fixture"
owner = "test-fixtures"
reason = "Insta snapshot files capture reviewed parser output fixtures."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --workspace"]

[[allow]]
glob = "crates/**/*.proptest-regressions"
kind = "property_regression_fixture"
owner = "test-fixtures"
reason = "Proptest regression seeds preserve minimized property failures."
surface = "fixtures"
classification = "test"
covered_by = ["cargo test --workspace"]

[[allow]]
