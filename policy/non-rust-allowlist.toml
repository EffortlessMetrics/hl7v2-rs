schema_version = "1.0"

[[allow]]
glob = ".github/workflows/*.yml"
kind = "ci_declarative"
owner = "release/ci"
reason = "GitHub Actions workflow definitions are platform-required YAML."
surface = "ci"
classification = "config"
covered_by = ["cargo xtask check-file-policy"]

[[allow]]
glob = "api/**/*.yaml"
kind = "api_contract"
owner = "api"
reason = "OpenAPI and Buf contracts are external interface definitions."
surface = "api"
classification = "production"
covered_by = ["cargo xtask check-file-policy"]

[[allow]]
glob = "*.toml"
kind = "rust_config"
owner = "workspace"
reason = "Cargo and Rust tool configuration are required workspace policy files."
surface = "build"
classification = "config"
covered_by = ["cargo xtask check-lint-policy"]

[[allow]]
glob = "*.yml"
kind = "repo_config"
owner = "workspace"
reason = "Repository service configuration uses provider-required YAML."
surface = "config"
