schema_version = "1.0"
policy = "process-allowlist"
owner = "EffortlessMetrics"
status = "active"
updated = "2026-05-19"

# Process execution is governed separately from script/config file presence.

[[allow]]
id = "cargo-and-xtask"
owner = "release/ci"
surface = "rust-workspace"
behavior = "Cargo and xtask may run formatting, lint, test, policy, schema, publish-plan, and publish-dry-run checks."
commands = [
  "cargo fmt",
  "cargo check",
  "cargo clippy",
  "cargo test",
  "cargo run -p xtask -- gate --check",
  "cargo run -p xtask -- check-ci-lane-whitelist",
  "cargo run -p xtask -- evidence-schema-check",
  "cargo run -p xtask -- publish-plan",
  "cargo run -p xtask -- publish-dry-run --workspace-patches --allow-dirty",
  "cargo run -p xtask -- check-python-publish-policy",
  "cargo run -p xtask -- check-deployment-provenance",
  "cargo run -p xtask -- policy-report",
]
reason = "Rust/Cargo and xtask are the primary governed process surface."
covered_by = ["cargo run -p xtask -- gate --check"]
review_after = "2026-06-30"

[[allow]]
id = "python-wheel-proof"
owner = "hl7v2-python"
surface = "python-binding"
behavior = "Python and maturin may build, install, and smoke-test the `hl7v2` distribution."
commands = [
  "python -m pip install",
  "maturin build",
  "python tests/python_smoke/smoke.py",
  "python tests/python_smoke/evidence_workflow_guide.py",
]
reason = "Python release proof requires wheel build/install/import validation."
covered_by = [".github/workflows/python-wheels.yml", ".github/workflows/python-testpypi.yml"]
review_after = "2026-06-30"

[[allow]]
id = "public-crates-install-smoke"
owner = "release"
surface = "release-proof"
behavior = "Python may orchestrate Cargo installs from crates.io into disposable scratch roots to verify public Rust, CLI, and server first-use workflows."
commands = [
  "python tests/public_crates_smoke/smoke.py --version 1.5.0",
  "cargo new rust-smoke --bin",
  "cargo add hl7v2@1.5.0",
  "cargo add serde_json",
  "cargo run --quiet",
  "cargo install hl7v2-cli --version 1.5.0",
  "cargo install hl7v2-server --version 1.5.0",
  "hl7v2-cli doctor --format json",
  "hl7v2-server --print-config",
  "hl7v2-server",
]
reason = "The v1.5.0 user path needs repeatable install-back proof without claiming a new publish."
covered_by = ["python tests/public_crates_smoke/smoke.py --version 1.5.0"]
review_after = "2026-06-30"

[[allow]]
id = "contract-tool-processes"
owner = "api"
surface = "contracts"
behavior = "Node, AJV, Redocly, Spectral, and buf may run contract validation inside the contracts workflow."
commands = [
  "npm install -g @stoplight/spectral-cli@6.16.0",
  "npm install -g @redocly/cli@2.31.1",
  "npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1",
  "go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1",
  "npx -y @bufbuild/buf@1.69.0",
  "ajv validate",
  "ajv compile",
  "redocly build-docs",
  "spectral lint",
]
reason = "OpenAPI, protobuf, and schema contracts need ecosystem-native validators."
covered_by = [".github/workflows/contracts.yml"]
review_after = "2026-06-30"

[[allow]]
id = "container-smoke"
owner = "platform"
surface = "deployment"
behavior = "Docker compose may render and smoke-check deployment sidecar configuration."
commands = ["docker compose -f infrastructure/docker/docker-compose.yml config"]
reason = "Deployment proof needs container configuration validation without making Docker a default PR tax."
covered_by = ["docker compose -f infrastructure/docker/docker-compose.yml config"]
review_after = "2026-06-30"

[[allow]]
id = "security-audit-tooling"
owner = "release/ci"
surface = "security"
behavior = "Security workflows may install pinned audit tooling and run dependency, advisory, license, and source checks."
commands = [
  "cargo install cargo-audit --version 0.22.1 --locked",
  "cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings",
  "cargo install cargo-deny --version 0.19.6 --locked",
  "cargo deny check advisories licenses bans sources",
]
reason = "Security and nightly audit proof should fail on real dependency or policy violations without unpinned tool drift."
covered_by = ["cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --deny warnings", "cargo deny check advisories licenses bans sources"]
review_after = "2026-06-30"

[[allow]]
id = "ripr-static-exposure"
owner = "release/ci"
surface = "ci"
behavior = "The advisory ripr lane may install ripr and render portable PR evidence, review guidance, annotations, impacted-evidence routing receipts, and repo-scoped badge endpoints."
commands = [
  "cargo install ripr --version 0.5.0 --locked",
  "ripr check --root . --format repo-badge-shields",
  "ripr check --root . --format repo-badge-plus-shields",
  "ripr check --root . --diff target/ripr/pr/pr.diff --format json",
  "ripr review-comments --root . --base origin/main --head HEAD --out target/ripr/review/comments.json",
  "cargo run -p xtask -- badges --check",
  "cargo run -p xtask -- ripr-pr",
  "cargo run -p xtask -- ripr-review-comments",
  "cargo run -p xtask -- ripr-pr-summary",
  "cargo run -p xtask -- ripr-annotations",
  "cargo run -p xtask -- impacted-evidence",
]
reason = "Static mutation-exposure analysis should be cheap, advisory, artifact-backed, and separate from runtime mutation."
covered_by = [".github/workflows/ripr.yml"]
review_after = "2026-06-30"

[[allow]]
id = "targeted-runtime-mutation"
owner = "core/test"
surface = "ci"
behavior = "The routed mutation lane may install cargo-mutants, compute a changed-file diff, and run cargo-mutants against only that diff or a manual file glob."
commands = [
  "cargo install cargo-mutants --version 26.1.2 --locked",
  "git diff --unified=0 origin/main...HEAD",
  "cargo mutants --workspace --all-features --in-diff target/mutation/changed.diff",
  "cargo mutants --workspace --all-features --file crates/hl7v2/src/parser/**/*.rs",
]
reason = "Runtime mutation should remain a targeted risk proof without becoming default PR cost."
covered_by = [".github/workflows/mutation.yml"]
review_after = "2026-06-30"

[[allow]]
id = "nightly-runtime-mutation"
owner = "core/test"
surface = "ci"
behavior = "The nightly lane may install pinned cargo-mutants and run the scheduled workspace mutation backstop."
commands = [
  "cargo install cargo-mutants --version 26.1.2 --locked",
  "cargo mutants --workspace --timeout 300 --output target/nightly-mutation --no-shuffle",
]
reason = "Nightly runtime mutation should remain slower scheduled proof while surfacing missed mutants, timeouts, and tool failures."
covered_by = [".github/workflows/nightly.yml"]
review_after = "2026-06-30"
