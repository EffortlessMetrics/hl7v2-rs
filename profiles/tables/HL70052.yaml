# HL7 Table 0052 - Diagnosis Type
# HL7 v2.5.1 Standard
# Used in DG1 segment for diagnosis classification

hl7_table:
  id: "HL70052"
  name: "Diagnosis Type"
  version: "2.5.1"
  codes:
    - value: "A"
      description: "Admitting"
      status: "A"
    - value: "W"
      description: "Working"
      status: "A"
    - value: "F"
      description: "Final"
      status: "A"
