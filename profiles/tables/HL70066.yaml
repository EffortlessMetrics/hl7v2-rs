# HL7 Table 0066 - Employment Status
# HL7 v2.5.1 Standard
# Used in PID segment for patient employment

hl7_table:
  id: "HL70066"
  name: "Employment Status"
  version: "2.5.1"
  codes:
    - value: "1"
      description: "Full time employed"
      status: "A"
    - value: "2"
      description: "Part time employed"
      status: "A"
    - value: "3"
      description: "Unemployed"
      status: "A"
    - value: "4"
      description: "Self-employed"
      status: "A"
    - value: "5"
      description: "Retired"
      status: "A"
    - value: "6"
      description: "On active military duty"
      status: "A"
    - value: "7"
      description: "Unknown"
      status: "A"
    - value: "8"
      description: "Not in labor force"
      status: "A"
    - value: "9"
      description: "Disabled"
      status: "A"
