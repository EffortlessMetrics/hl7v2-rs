# HL7 Table 0075 - Result Status
# HL7 v2.5.1 Standard
# Used in OBR.25 and ORC.5

hl7_table:
  id: "HL70075"
  name: "Result Status"
  version: "2.5.1"
  codes:
    - value: "A"
      description: "Some but not all results available"
      status: "A"
    - value: "C"
      description: "Correction to results"
      status: "A"
    - value: "F"
      description: "Final results"
      status: "A"
    - value: "I"
      description: "No results available"
      status: "A"
    - value: "N"
      description: "Order sent to wrong filler"
      status: "A"
    - value: "O"
      description: "Order received"
      status: "A"
    - value: "P"
      description: "Preliminary results"
      status: "A"
    - value: "R"
      description: "Results stored"
      status: "A"
    - value: "S"
      description: "Partial results"
      status: "A"
    - value: "X"
      description: "Results cannot be obtained"
      status: "A"
    - value: "Y"
      description: "No order on record"
      status: "A"
    - value: "Z"
      description: "No record of patient"
      status: "A"
