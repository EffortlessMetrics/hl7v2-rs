# HL7 Table 0085 - Observation Result Status
# HL7 v2.5.1 Standard
# Used in OBX.11 for result status

hl7_table:
  id: "HL70085"
  name: "Observation Result Status"
  version: "2.5.1"
  codes:
    - value: "C"
      description: "Record coming over is a correction and thus replaces a final result"
      status: "A"
    - value: "D"
      description: "Deletes the OBX record"
      status: "A"
    - value: "F"
      description: "Final results; Can only be changed with a corrected result"
      status: "A"
    - value: "I"
      description: "Specimen in lab; results pending"
      status: "A"
    - value: "N"
      description: "Not asked; used to affirmatively mark that the observation was not asked"
      status: "A"
    - value: "O"
      description: "Order detail description only (no result)"
      status: "A"
    - value: "P"
      description: "Preliminary results"
      status: "A"
    - value: "R"
      description: "Results entered -- not verified"
      status: "A"
    - value: "S"
      description: "Partial results"
      status: "A"
    - value: "U"
      description: "Results status change to final without retransmitting results already sent"
      status: "A"
    - value: "W"
      description: "Post original as wrong, e.g., transmitted for wrong patient"
      status: "A"
    - value: "X"
      description: "Results cannot be obtained for this observation"
      status: "A"
