# HL7 Table 0089 - Signature Code
# HL7 v2.5.1 Standard
# Used for document signing

hl7_table:
  id: "HL70089"
  name: "Signature Code"
  version: "2.5.1"
  codes:
    - value: "S"
      description: "Signed"
      status: "A"
    - value: "U"
      description: "Unsigned"
      status: "A"
    - value: "E"
      description: "Electronic signature"
      status: "A"
    - value: "N"
      description: "Not applicable"
      status: "A"
    - value: "W"
      description: "Wet signature"
      status: "A"
