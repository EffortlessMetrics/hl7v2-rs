# HL7 Table 0100 - Bed Status
# HL7 v2.5.1 Standard
# Used for bed/location status

hl7_table:
  id: "HL70100"
  name: "Bed Status"
  version: "2.5.1"
  codes:
    - value: "C"
      description: "Closed"
      status: "A"
    - value: "H"
      description: "Housekeeping"
      status: "A"
    - value: "O"
      description: "Occupied"
      status: "A"
    - value: "U"
      description: "Unoccupied"
      status: "A"
    - value: "K"
      description: "Contaminated"
      status: "A"
    - value: "I"
      description: "Isolated"
      status: "A"
    - value: "M"
      description: "Maintenance"
      status: "A"
